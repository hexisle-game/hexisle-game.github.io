<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>게임 방법 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300..900&display=swap">
<style>
:root{--ink:#3b2412;--ink2:#5e4026;--red:#8a2a14;--gold:#c9a35a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0c12;font-family:Hahmlet,serif;overflow:hidden}
/* dimmed game behind */
.bg{position:fixed;inset:0;background:url(../assets/title/titlebgS.webp) center/cover;filter:blur(3px) brightness(.35)}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
/* the book */
.book{position:relative;width:min(1180px,96vw,calc((100vh - 40px)*1.62));aspect-ratio:1.62/1;display:flex;filter:drop-shadow(0 24px 40px rgba(0,0,0,.65))}
.book::before{content:"";position:absolute;inset:-1.6% -1.4% -3.2%;border-radius:10px;background:linear-gradient(#4a2a16,#2b170b);box-shadow:inset 0 0 0 2px #6b4425,inset 0 0 0 5px #1d0f06,inset 0 0 0 6px rgba(201,163,90,.55)}
/* page stack under the pages */
.book::after{content:"";position:absolute;left:1%;right:1%;bottom:-1.6%;height:3%;border-radius:0 0 6px 6px;background:repeating-linear-gradient(180deg,#d9c39a 0 2px,#b99e70 2px 3px);z-index:0}
.page{position:relative;flex:1;z-index:1;background:url(parchment.webp) center/cover;overflow:hidden}
.page.l{border-radius:6px 2px 2px 6px;transform:scaleX(1)}
.page.r{border-radius:2px 6px 6px 2px}
.page.l::before{content:"";position:absolute;inset:0;background:url(parchment.webp) center/cover;transform:scaleX(-1);opacity:1}
/* curvature & spine shadow */
.page.l::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.10) 0,rgba(0,0,0,0) 8%,rgba(0,0,0,0) 78%,rgba(70,40,15,.18) 90%,rgba(40,20,5,.48) 100%)}
.page.r::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.10) 0,rgba(0,0,0,0) 8%,rgba(0,0,0,0) 78%,rgba(70,40,15,.18) 90%,rgba(40,20,5,.48) 100%)}
.spine{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:rgba(60,32,10,.55);z-index:2;box-shadow:0 0 6px rgba(40,20,5,.6)}
.in{position:relative;z-index:1;height:100%;padding:7% 8% 7% 9%}
.page.r .in{padding:7% 9% 6% 8%;display:flex;flex-direction:column}
/* left: picture only */
.pic{height:100%;display:flex;align-items:center;justify-content:center}
.pic figure{margin:0;width:88%;aspect-ratio:1;position:relative;transform:rotate(-1.2deg)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.18) saturate(.92) contrast(1.02);border:6px solid #f1e3c0;box-shadow:0 1px 0 #fff8 inset,0 6px 14px rgba(60,30,10,.35),0 0 0 1px rgba(90,60,30,.4)}
.pic figure::before,.pic figure::after{content:"";position:absolute;width:26%;height:7%;background:rgba(232,214,170,.82);box-shadow:0 1px 2px rgba(0,0,0,.18);z-index:2}
.pic figure::before{left:-5%;top:-2%;transform:rotate(-34deg)}
.pic figure::after{right:-5%;bottom:-2%;transform:rotate(-34deg)}
/* right: text + buttons */
.lab{font-size:clamp(11px,1.15vw,14px);letter-spacing:.18em;color:var(--red);font-weight:600}
.ttl{font-size:clamp(22px,2.9vw,38px);font-weight:800;color:var(--ink);margin:.35em 0 .1em;line-height:1.2}
.rule{height:10px;margin:.5em 0 1.1em;background:radial-gradient(circle,var(--ink2) 0 2px,transparent 3px) center/14px 10px no-repeat,linear-gradient(90deg,transparent,rgba(94,64,38,.55) 15%,rgba(94,64,38,.55) 85%,transparent) center/100% 1px no-repeat}
.key{font-size:clamp(15px,1.75vw,22px);font-weight:700;color:var(--ink);line-height:1.45;margin:0 0 .8em}
.txt{font-size:clamp(13px,1.35vw,17px);color:var(--ink2);line-height:1.75;margin:0}
.txt b{color:var(--red)}
.foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:12px}
.dots{display:flex;gap:6px;margin-right:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(94,64,38,.3)}.dots i.on{background:var(--red)}
.pb{white-space:nowrap;flex:none;font:inherit;font-weight:700;font-size:clamp(12px,1.25vw,16px);padding:.6em 1.2em;border-radius:4px;cursor:pointer;color:var(--ink);background:rgba(255,248,230,.35);border:1.5px solid rgba(94,64,38,.6)}
.pb.ghost{border-color:transparent;background:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.pb.main{color:#f7e6c4;background:linear-gradient(#9a3a1c,#6e2410);border-color:#4d170a;box-shadow:inset 0 1px 0 rgba(255,220,180,.35),0 2px 4px rgba(60,20,5,.35)}
.close{position:absolute;right:-1.2%;top:-2.6%;width:44px;height:44px;border-radius:50%;z-index:5;border:2px solid #c9a35a;background:radial-gradient(circle at 40% 35%,#a8311c,#5d1308);color:#f7e6c4;font-size:20px;box-shadow:0 3px 8px rgba(0,0,0,.6)}
.ribbon{position:absolute;right:30%;top:-2%;width:22px;height:16%;z-index:3;background:linear-gradient(#8a2a14,#6e1f0e);clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
@media (max-height:520px){
 .book{width:min(96vw,calc((100vh - 24px)*1.62))}
 .in{padding:6% 7% 6% 8%}.page.r .in{padding:6% 8% 5% 7%}
 .lab{font-size:10px}.ttl{font-size:clamp(18px,4.6vh,26px)}.rule{margin:.3em 0 .7em}
 .key{font-size:clamp(13px,3.6vh,17px);margin-bottom:.5em}.txt{font-size:clamp(11px,3vh,14px);line-height:1.6}
 .foot{flex-wrap:wrap;gap:6px}.dots{width:100%;margin:0 0 4px}.pb{font-size:12px;padding:.5em .9em}.pb.ghost{margin-right:auto;padding-left:0}
 .close{width:34px;height:34px;font-size:15px}
}
.switch{position:fixed;left:12px;bottom:10px;z-index:9;display:flex;gap:6px}
.switch button{font:12px system-ui;padding:6px 10px;border-radius:6px;border:1px solid #666;background:#222;color:#ddd}
</style></head><body>
<div class="bg"></div>
<div class="wrap"><div class="book">
  <div class="page l"><div class="in"><div class="pic"><figure><img id="im" src="../assets/rules/2.webp" alt=""></figure></div></div></div>
  <div class="spine"></div>
  <div class="page r"><div class="ribbon"></div><div class="in">
    <div class="lab" id="lb">게임 방법 · 2 / 7</div>
    <div class="ttl" id="tt">땅과 자원</div>
    <div class="rule"></div>
    <p class="key" id="ky">땅마다 나오는<br>자원이 달라요.</p>
    <p class="txt" id="tx">숲은 <b>목재</b>, 언덕은 <b>벽돌</b>, 목초지는 <b>양모</b>, 밭은 <b>곡물</b>, 산은 <b>광석</b>을 줘요. 사막은 아무것도 주지 않아요.</p>
    <div class="foot"><div class="dots" id="dt"></div><button class="pb ghost">건너뛰기</button><button class="pb" id="pv">이전</button><button class="pb main" id="nx">다음</button></div>
  </div></div>
  <button class="close" aria-label="닫기">✕</button>
</div></div>
<script>
const R=[["어떤 게임인가요?","주사위를 굴려 자원을 받고,<br>마을을 넓혀 점수를 쌓아요.","무인도에 처음 정착한 개척자가 되어 마을을 넓혀 가는 게임이에요. 땅에서 나오는 자원으로 도로, 마을, 도시를 지으면 점수가 올라가요. <b>10점</b>을 가장 먼저 모으면 이겨요."],
["땅과 자원","땅마다 나오는<br>자원이 달라요.","숲은 <b>목재</b>, 언덕은 <b>벽돌</b>, 목초지는 <b>양모</b>, 밭은 <b>곡물</b>, 산은 <b>광석</b>을 줘요. 사막은 아무것도 주지 않아요."]];
let i=1;const show=()=>{const p=R[i%R.length];document.getElementById('tt').textContent=p[0];document.getElementById('ky').innerHTML=p[1];document.getElementById('tx').innerHTML=p[2];
 document.getElementById('lb').textContent=`게임 방법 · ${i+1} / 7`;document.getElementById('im').src=`../assets/rules/${i+1}.webp`;document.getElementById('dt').innerHTML=Array.from({length:7},(_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');};
show();document.getElementById('nx').onclick=()=>{i=(i+1)%2;show();};document.getElementById('pv').onclick=()=>{i=(i+1)%2;show();};
</script>
</body></html>
