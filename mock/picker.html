<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex"><title>캐릭터 선택 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300..900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070c;font-family:Hahmlet,serif;color:#efe2c4;overflow:hidden}
/* the game's phone layout is a 905x440 virtual screen scaled to the device; same here */
#vp{position:fixed;left:0;top:0;width:905px;height:440px;transform-origin:0 0}
.bg{position:absolute;inset:0;background:url(../assets/title/titlebgS.webp) center/cover;filter:brightness(.45)}
.frame{position:absolute;inset:6px;background:#2a1d12 radial-gradient(ellipse at 50% 30%,#3a2818,#20160d);border:2px solid #b98d45;outline:1px solid rgba(233,196,122,.35);outline-offset:-6px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:14px 26px}
.fh{display:flex;align-items:baseline;gap:12px}.fh h3{margin:0;font-size:26px;color:#f3dfae}
.x{position:absolute;right:14px;top:12px;width:36px;height:36px;background:url(../assets/title/back.webp) center/contain no-repeat;border:0}
.rows{margin:14px 0 0 28px;display:flex;flex-direction:column;gap:22px}
.row{display:grid;grid-template-columns:168px 1fr;align-items:center}
.lab{font-size:15px;color:#d9ccb1}
.seg{display:flex;gap:30px;font-size:15px;color:#c9b48a}.seg b{color:#f3dfae;border-bottom:2px solid #e9c47a;padding-bottom:3px}
.foot{position:absolute;right:26px;bottom:18px;display:flex;align-items:center;gap:16px}
.foot p{margin:0;font-size:12px;color:#a8977a}
.gb{font:inherit;font-weight:700;font-size:15px;color:#fff0d2;background:none;border-style:solid;border-width:12px 14px;padding:2px 26px;border-image:url(../assets/ui/0188c1d8.webp) 34 36 fill / 12px 14px stretch;cursor:pointer}
.gb.dk{border-image:url(../assets/ui/28241176.webp) 34 36 fill / 12px 14px stretch;color:#f3e2bd}
.av{--c:#888;border-radius:50%;background:center/cover;box-shadow:0 0 0 5px var(--c),0 0 0 7px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.6);flex:none}
.var{position:fixed;right:60px;top:6px;z-index:9;display:flex;gap:6px}
.var button{font:600 10px system-ui;padding:4px 7px;border-radius:6px;border:1px solid #777;background:#222;color:#ddd}.var button.on{background:#c9a35a;color:#111}
/* ---------- A: me-card + picker dialog ---------- */
.me{display:flex;align-items:center;gap:18px}
.me .av{width:58px;height:58px}
.me .t{font-size:13px;color:#a8977a}.me .t b{display:block;font-size:16px;color:#f3dfae;margin-bottom:2px}
.me .chg{margin-left:10px;font:inherit;font-size:13px;color:#e9c47a;background:none;border:1px solid rgba(233,196,122,.45);padding:6px 14px;border-radius:2px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;height:392px;background:#2a1d12 radial-gradient(ellipse at 50% 20%,#3d2a19,#1f150c);border:2px solid #b98d45;outline:1px solid rgba(233,196,122,.35);outline-offset:-6px;box-shadow:0 14px 40px rgba(0,0,0,.7);padding:14px 22px;text-align:center}
.dlg h4{margin:4px 0 0;font-size:20px;color:#f3dfae}
.car{position:relative;height:178px;margin:10px -22px 0;display:flex;align-items:center;justify-content:center;gap:22px;overflow:hidden}
.car .av{width:72px;height:72px;opacity:.45;filter:saturate(.7);box-shadow:0 0 0 3px rgba(233,196,122,.25),0 3px 8px rgba(0,0,0,.6)}
.car .av.n1{width:92px;height:92px;opacity:.75}
.car .av.c{width:132px;height:132px;opacity:1;filter:none;box-shadow:0 0 0 7px var(--c),0 0 0 9px rgba(0,0,0,.6),0 0 30px rgba(0,0,0,.6)}
.car .ar{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;color:#e9c47a;opacity:.8}.car .ar.l{left:18px}.car .ar.r{right:18px}
.cname{font-size:14px;color:#e6dccb;margin-top:6px}
.chips{display:flex;justify-content:center;gap:16px;margin-top:14px}
.chips i{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.55);filter:saturate(.8) brightness(.84)}
.chips i.on{box-shadow:0 0 0 3px #f3dfae,0 0 0 6px rgba(0,0,0,.5)}
.chips i.tk{opacity:.25}
.dlg .ft{position:absolute;right:18px;bottom:14px}
/* ---------- B: in-row toggle + one swipe strip ---------- */
.tg{display:inline-flex;gap:0;margin-bottom:8px;border:1px solid rgba(233,196,122,.4);border-radius:2px;overflow:hidden}
.tg span{font-size:13px;padding:4px 14px;color:#c9b48a}.tg span.on{background:rgba(233,196,122,.22);color:#f3dfae}
.strip{display:flex;gap:16px;align-items:center;overflow:hidden;padding:8px 4px;width:560px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.strip .av{width:52px;height:52px;box-shadow:0 0 0 3px rgba(233,196,122,.25),0 2px 6px rgba(0,0,0,.6)}
.strip .av.on{box-shadow:0 0 0 5px var(--c),0 0 0 7px rgba(0,0,0,.55)}
.strip i{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.55);filter:saturate(.8) brightness(.84)}
.strip i.on{box-shadow:0 0 0 3px #f3dfae,0 0 0 6px rgba(0,0,0,.5)}

/* A v2: tap the portrait itself; grid picker */
.me2{display:flex;align-items:center;gap:16px;cursor:pointer}
.me2 .av{width:58px;height:58px;position:relative}
.me2 .av::after{content:"";position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:#2a1d12 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e9c47a' stroke-width='2.4' stroke-linecap='round'><path d='M4 20h4L19 9l-4-4L4 16z'/></svg>") center/12px no-repeat;box-shadow:0 0 0 2px #e9c47a}
.me2 .t{font-size:13px;color:#a8977a}.me2 .t b{display:block;font-size:16px;color:#f3dfae;margin-bottom:2px}
.dlg2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:720px;height:410px;background:#2a1d12 radial-gradient(ellipse at 50% 20%,#3d2a19,#1f150c);border:2px solid #b98d45;outline:1px solid rgba(233,196,122,.35);outline-offset:-6px;box-shadow:0 14px 40px rgba(0,0,0,.7);padding:12px 22px;display:flex;flex-direction:column;align-items:center}
.dlg2 h4{margin:2px 0 8px;font-size:19px;color:#f3dfae}
.grid{flex:1;width:100%;overflow-y:auto;display:grid;grid-template-columns:repeat(8,1fr);gap:16px 10px;padding:8px 10px;justify-items:center;-webkit-mask-image:linear-gradient(180deg,#000 85%,transparent);mask-image:linear-gradient(180deg,#000 85%,transparent)}
.grid .av{width:58px;height:58px;opacity:.85;box-shadow:0 0 0 2px rgba(233,196,122,.2),0 2px 6px rgba(0,0,0,.6)}
.grid .av.on{opacity:1;box-shadow:0 0 0 5px var(--c),0 0 0 7px rgba(0,0,0,.55)}
.grid .av.tk{opacity:.25}
.dlg2 .chips{margin:8px 0 6px}
.dlg2 .ft2{margin-top:4px}
/* B v2: one-row portrait strip + existing colour row */
.strip2{display:flex;gap:18px;align-items:center;overflow:hidden;padding:9px 6px;width:600px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.strip2 .av{width:46px;height:46px;opacity:.8;box-shadow:0 0 0 2px rgba(233,196,122,.2),0 2px 6px rgba(0,0,0,.6)}
.strip2 .av.on{opacity:1;box-shadow:0 0 0 5px var(--c),0 0 0 7px rgba(0,0,0,.55)}
.sws{display:flex;gap:16px}.sws i{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.55);filter:saturate(.8) brightness(.84)}.sws i.on{box-shadow:0 0 0 3px #f3dfae,0 0 0 6px rgba(0,0,0,.5)}

/* C: one row: [toggle] + one strip that shows portraits or colours */
.crow{display:flex;align-items:center;gap:14px}
.ctg{display:flex;align-items:center;gap:7px;flex:none;cursor:pointer}
.ctg img{width:62px;height:auto;display:block}
.ctg span{font-size:13px;color:#8f7f63}.ctg span.on{color:#f3dfae;font-weight:700}
.cstrip{display:flex;gap:14px;align-items:center;overflow:hidden;padding:12px 10px;width:470px;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.cstrip .av{width:44px;height:44px;opacity:.8;box-shadow:0 0 0 2px rgba(233,196,122,.2),0 2px 6px rgba(0,0,0,.6)}
.cstrip .av.cc{opacity:.6;box-shadow:0 0 0 5px var(--c),0 0 0 7px rgba(0,0,0,.55)}
.cstrip .av.sel{box-shadow:0 0 0 5px var(--c),0 0 0 7px rgba(0,0,0,.55),0 0 0 9px #f3dfae}
.cstrip .av.on{opacity:1;box-shadow:0 0 0 5px var(--c),0 0 0 7px rgba(0,0,0,.55)}
.cstrip i{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.55);filter:saturate(.8) brightness(.84)}.cstrip i.on{box-shadow:0 0 0 3px #f3dfae,0 0 0 6px rgba(0,0,0,.5)}
.ctg .only img{width:62px}

/* E: [toggle] label | strip — colour mode keeps the chosen character and swipes ring colours */
.erow{display:flex;align-items:center;gap:12px}
.erow .etg{width:62px;flex:none;cursor:pointer}
.erow .elab{width:44px;font-size:14px;color:#f3dfae;font-weight:700;flex:none}
.erow .vdiv{width:1px;height:44px;background:linear-gradient(180deg,transparent,rgba(233,196,122,.22) 50%,transparent);flex:none;margin-right:4px}
.cstrip .ring{width:44px;height:44px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 5px var(--c),0 0 0 2px rgba(0,0,0,.5);opacity:.85}
</style></head><body>
<div class="var"><button data-v="E1">E. 캐릭터 모드</button><button data-v="E2">E. 색상 6색</button><button data-v="E3">E. 색상 7색(아이보리)</button><button data-v="A">A. 초상화 눌러 선택 창</button><button data-v="A2">A. 선택 창(목록)</button><button data-v="B">B. 한 줄 + 색상 줄</button><button data-v="C1">C. 글자 토글·캐릭터</button><button data-v="C2">C. 글자 토글·색상</button><button data-v="D1">D. 아이콘 토글·캐릭터</button><button data-v="D2">D. 아이콘 토글·색상</button></div>
<div id="vp"></div>
<script>
const PT=['otter','owl','cat','mole'],NM={otter:'수달 상인',owl:'부엉이 학자',cat:'고양이 모험가',mole:'두더지 광부'};
const COL=['#ff2a1a','#3a8cff','#e046e0','#f5c400'];
const mute=c=>{const n=parseInt(c.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;const m=(r+g+b)/3;const f=x=>Math.round((x*.75+m*.25)*.85);return `rgb(${f(r)},${f(g)},${f(b)})`;};
const av=(p,cls='',c=COL[0])=>`<div class="av ${cls}" style="--c:${mute(c)};background-image:url(pt/${p}.webp)"></div>`;
const frame=(meRow)=>`<div class="bg"></div><div class="frame"><button class="x"></button><div class="fh"><h3>싱글 플레이</h3></div>
 <div class="rows"><div class="row"><div class="lab">내 캐릭터</div>${meRow}</div>
 <div class="row"><div class="lab">난이도</div><div class="seg"><span>쉬움</span><b>보통</b><span>어려움</span></div></div>
 <div class="row"><div class="lab">인원</div><div class="seg"><span>2인</span><span>3인</span><b>4인</b></div></div></div>
 <div class="foot"><button class="gb">시작</button></div></div>`;
const meCard=`<div class="me">${av('otter')}<div class="t"><b>수달 상인</b>빨강</div><button class="chg">바꾸기</button></div>`;
const meCard2=`<div class="me2">${av('otter')}<div class="t"><b>수달 상인</b>눌러서 캐릭터·색상 바꾸기</div></div>`;
const MANY=Array.from({length:24},(_,i)=>PT[i%4]);
const frame2=(rows)=>`<div class="bg"></div><div class="frame"><button class="x"></button><div class="fh"><h3>싱글 플레이</h3></div>
 <div class="rows" style="gap:18px">${rows}
 <div class="row"><div class="lab">난이도</div><div class="seg"><span>쉬움</span><b>보통</b><span>어려움</span></div></div>
 <div class="row"><div class="lab">인원</div><div class="seg"><span>2인</span><span>3인</span><b>4인</b></div></div></div>
 <div class="foot"><button class="gb">시작</button></div></div>`;
const strip=(mode)=>mode==='p'?`<div class="cstrip">${MANY.map((p,i)=>av(p,i==0?'on':'')).join('')}</div>`:`<div class="cstrip">${COL.map((c,i)=>`<i class="${i==0?'on':''}" style="background:${c}"></i>`).join('')}</div>`;
const tgl=(mode,icon)=>icon?`<div class="ctg"><img src="pt/tg_icon${mode==='p'?'L':'R'}.webp"></div>`:`<div class="ctg"><span class="${mode==='p'?'on':''}">캐릭터</span><img src="pt/tg_plain${mode==='p'?'L':'R'}.webp"><span class="${mode==='c'?'on':''}">색상</span></div>`;
const crow=(mode,icon)=>frame2(`<div class="row"><div class="lab">내 캐릭터</div><div class="crow">${tgl(mode,icon)}${strip(mode)}</div></div>`);
const PAL={a:['#c9391e','#3a8cff','#7f17dd','#e331c5','#f5c400','#2fb36b'],b:['#c9391e','#3a8cff','#7f17dd','#e331c5','#f5c400','#2fb36b','#efe6cf']};let COL6=PAL.a;
const estrip=(mode)=>`<div class="cstrip">${mode==='p'?MANY.map((p,i)=>av(p,i==0?'on':'')).join(''):COL6.map((c,i)=>av('otter',i==0?'on sel':'cc',c)).join('')}</div>`;
const erow=(mode,pal)=>{COL6=PAL[pal||'a'];return frame2(`<div class="row"><div class="lab">내 캐릭터</div><div class="erow"><img class="etg" src="pt/tg_plain${mode==='p'?'L':'R'}.webp"><span class="elab">${mode==='p'?'캐릭터':'색상'}</span><span class="vdiv"></span>${estrip(mode)}</div></div>`);};
const V={
 E1:()=>erow('p'),E2:()=>erow('c','a'),E3:()=>erow('c','b'),
 C1:()=>crow('p',false),C2:()=>crow('c',false),D1:()=>crow('p',true),D2:()=>crow('c',true),
 A:()=>frame2(`<div class="row"><div class="lab">내 캐릭터</div>${meCard2}</div>`),
 A2:()=>frame2(`<div class="row"><div class="lab">내 캐릭터</div>${meCard2}</div>`)+`<div class="dim"></div><div class="dlg2"><h4>캐릭터 선택</h4>
   <div class="grid">${MANY.map((p,i)=>av(p,i==0?'on':(i==5?'tk':''))).join('')}</div>
   <div class="chips">${COL.map((c,i)=>`<i class="${i==0?'on':''}${i==3?' tk':''}" style="background:${c}"></i>`).join('')}</div>
   <div class="ft2"><button class="gb">확인</button></div></div>`,
 B:()=>frame2(`<div class="row"><div class="lab">내 캐릭터</div><div class="strip2">${MANY.map((p,i)=>av(p,i==0?'on':'')).join('')}</div></div>
   <div class="row"><div class="lab">내 말 색상</div><div class="sws">${COL.map((c,i)=>`<i class="${i==0?'on':''}" style="background:${c}"></i>`).join('')}</div></div>`)
};
let cur='A';const vp=document.getElementById('vp');
const fit=()=>{const k=Math.min(innerWidth/905,innerHeight/440);vp.style.transform=`translate(${(innerWidth-905*k)/2}px,${(innerHeight-440*k)/2}px) scale(${k})`;};
const show=k=>{cur=k;vp.innerHTML=V[k]();document.querySelectorAll('.var button').forEach(b=>b.classList.toggle('on',b.dataset.v===k));};
document.querySelectorAll('.var button').forEach(b=>b.onclick=()=>show(b.dataset.v));
addEventListener('resize',fit);fit();show(new URLSearchParams(location.search).get('v')||'E1');
</script></body></html>
