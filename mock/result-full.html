<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>결과 화면 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Hahmlet:wght@300..900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;font-family:Hahmlet,serif;overflow:hidden;color:#efe2c4}
.scene{position:fixed;inset:0;overflow:hidden}
.art{position:absolute;inset:0;background:center/cover no-repeat;animation:artIn 2.4s ease-out both}
.win .art{background-image:url(../assets/result/win.webp)}
.lose .art{background-image:url(../assets/result/lose.webp?v=2);filter:saturate(.8)}
@keyframes artIn{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:scale(1.02)}}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 55%,rgba(10,7,4,.25),rgba(10,7,4,.78) 100%),linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.lose .shade{background:radial-gradient(ellipse 70% 60% at 50% 55%,rgba(8,10,14,.35),rgba(8,10,14,.85) 100%),linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.6))}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
.fx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;pointer-events:none;opacity:0;animation:fxIn 1.2s ease .9s forwards}
.lose .fx{animation-name:fxInL}
@keyframes fxIn{to{opacity:.72}}@keyframes fxInL{to{opacity:.55}}
h1{background:none!important;filter:none!important;line-height:0}
h1 img{display:block;width:min(560px,70vw);height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)) drop-shadow(0 0 24px rgba(255,210,120,.18))}
.lose h1 img{filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
@media (max-height:520px){h1 img{width:min(320px,50vw)}}
.box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 16px}
.kick{font-size:clamp(12px,1.4vw,16px);letter-spacing:.3em;color:#e9c47a;opacity:0;animation:up .8s ease-out .9s both}
h1{margin:0 0 .25em;font-family:'Hahmlet',serif;font-size:clamp(48px,8vw,104px);font-weight:900;line-height:1;letter-spacing:.04em;opacity:0;white-space:nowrap;
  background:linear-gradient(180deg,#fff4cf 0%,#f3cf72 45%,#b9822e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 2px rgba(40,18,4,.55)) drop-shadow(0 6px 18px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(255,200,90,.28));animation:title 1.1s cubic-bezier(.2,.9,.25,1.2) 1.1s both}
.lose h1{background:linear-gradient(180deg,#f2eee6 0%,#c9c2b4 50%,#8c8476 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)) drop-shadow(0 6px 18px rgba(0,0,0,.6))}
@keyframes title{from{opacity:0;transform:scale(1.5);letter-spacing:.24em}to{opacity:1;transform:none;letter-spacing:.04em}}
.sub{font-size:clamp(11px,1.05vw,13px);color:#e6dccb;opacity:0;animation:upSub .8s ease-out 1.7s both}
@keyframes upSub{from{opacity:0;transform:translateY(14px)}to{opacity:.7;transform:none}}
.sub b{color:var(--wc,#f3d58e)}
.tbl{margin-top:clamp(12px,2.6vh,22px);width:min(760px,96vw);display:flex;flex-direction:column;padding:4px 120px;background:linear-gradient(90deg,transparent 0,rgba(12,8,4,.62) 22%,rgba(12,8,4,.68) 50%,rgba(12,8,4,.62) 78%,transparent 100%);opacity:0;animation:up .6s ease-out 1.95s both}
@media (max-width:700px){.tbl{padding:4px 70px}}
.win .tbl{background:linear-gradient(90deg,transparent 0,rgba(12,8,4,.5) 22%,rgba(12,8,4,.54) 50%,rgba(12,8,4,.5) 78%,transparent 100%)}
.lose .tbl{background:linear-gradient(90deg,transparent 0,rgba(12,8,4,.56) 22%,rgba(12,8,4,.61) 50%,rgba(12,8,4,.56) 78%,transparent 100%)}
.tbl>div{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:clamp(12px,1.15vw,14px);opacity:0;animation:up .6s ease-out both}
.tbl>div+div{border-top:1px solid;border-image:linear-gradient(90deg,transparent,rgba(233,196,122,.22),transparent) 1}
.tbl>div:first-child{color:#f6e3b4}
.tbl .rk{width:22px;color:#c9b48a;font-weight:700}.tbl>div:first-child .rk{color:#f3d58e}
.tbl .av{width:18px;height:18px;flex:none;border-radius:50%;background:#e8d6ac center/cover no-repeat;box-shadow:0 0 0 3.5px var(--c),0 0 0 5px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.5);margin:0 6px 0 4px}
@media (max-height:520px){.tbl .av{width:14px;height:14px;margin:0 5px 0 4px;box-shadow:0 0 0 3.5px var(--c),0 0 0 5px rgba(0,0,0,.55)}.tbl>div{padding:3px 14px!important}}
.tbl .nm{flex:1}.tbl b{color:#f3d58e;font-size:1.08em}
.btns{display:flex;gap:14px;margin-top:clamp(16px,3.2vh,30px);opacity:0;animation:up .7s ease-out 3.1s both}
.gb{font:inherit;font-weight:700;font-size:clamp(13px,1.3vw,16px);color:#f3e2bd;background:none;cursor:pointer;border-style:solid;border-width:10px 12px;padding:4px 22px;min-width:9em;text-shadow:0 1px 0 #1d1006;border-image:url(../assets/ui/28241176.webp) 34 36 fill / 10px 12px stretch}
.gb.next{border-image:url(../assets/ui/0188c1d8.webp) 34 36 fill / 10px 12px stretch;color:#fff0d2}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.var{position:fixed;left:10px;top:10px;z-index:9;display:flex;gap:6px}
.var button{font:600 12px system-ui;padding:6px 10px;border-radius:6px;border:1px solid #777;background:#222;color:#ddd}
.var button.on{background:#c9a35a;color:#111;border-color:#c9a35a}
@media (max-height:520px){.tbl>div{padding:5px 14px}h1{font-size:clamp(40px,13vh,64px)}.box{padding:2vh 16px}}

/* subtitle sits right under the title */
h1{margin-bottom:0!important}
.sub{margin-top:-2px;letter-spacing:.02em}
.tbl{margin-top:clamp(14px,3vh,26px)}
@media (max-height:520px){
 h1 img{width:min(288px,45vw)!important}
 .sub{font-size:10px}
 .tbl>div{font-size:11px}
 .gb{font-size:12px;border-width:9.5px 11.4px;border-image-width:9.5px 11.4px;padding:3px 20px;min-width:8.5em}
}
.loseb .art{background-image:url(../assets/result/lose_b.webp)!important}

/* push the score list and buttons further down */
.box{justify-content:center!important;padding-top:0!important}
.tbl{margin-top:clamp(48px,11vh,110px)!important}
.btns{margin-top:clamp(12px,2.4vh,22px)!important}
@media (max-height:520px){.box{justify-content:flex-start!important;padding-top:11vh!important}.tbl{margin-top:9vh!important}.btns{position:absolute;left:0;right:0;bottom:4vh;justify-content:center;margin-top:0!important}}

.tbl>div{font-size:clamp(11px,1vw,12.5px)!important;padding-top:7px!important;padding-bottom:7px!important}
.tbl b{font-size:1em!important}
@media (max-height:520px){.tbl>div{font-size:10px!important;padding-top:3px!important;padding-bottom:3px!important}}
</style></head><body>
<div class="var"><button data-v="win" class="on">승리</button><button data-v="lose">패배</button><button id="rp">다시 재생</button></div>
<div class="scene" id="sc"></div>
<script>
const P=[['나','#ff2a1a',10,'(승점 카드 1장)','rabbit'],['꼼꼼한 수달','#3a8cff',8,'','otter'],['자유로운 판다','#2fb36b',6,'','panda'],['느긋한 늑대','#f5c400',4,'','wolf']];
const mute=c=>{const n=parseInt(c.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;const m=(r+g+b)/3;const f=x=>Math.round((x*.75+m*.25)*.85);return `rgb(${f(r)},${f(g)},${f(b)})`;};
let mode='win',raf;
function play(){cancelAnimationFrame(raf);const win=mode==='win';const LB=mode==='loseb';const order=win?P:[P[1],P[0],P[2],P[3]];const W2=order[0];
 document.getElementById('sc').className='scene '+(LB?'lose loseb':mode);
 document.getElementById('sc').innerHTML=`<div class="art"></div><div class="shade"></div><canvas id="cv"></canvas>
 <video class="fx" muted playsinline loop autoplay src="../assets/result/${win?'confetti':'snow'}.mp4"></video><div class="box"><h1><img src="../assets/result/${win?'victory':'gameover'}.webp" alt="${win?'VICTORY':'GAME OVER'}"></h1>
 <div class="sub" style="--wc:${W2[1]}">${win?'12바퀴 만에 섬의 영주가 되었어요.':`<b style="color:${mute(W2[1])};filter:brightness(1.35)">${W2[0]}</b>이(가) 12바퀴 만에 섬의 영주가 되었어요.`}</div>
 <div class="tbl">${order.map((p,i)=>`<div style="animation-delay:${2.1+i*.22}s"><span class="rk">${i+1}</span><span class="av" style="--c:${mute(p[1])};background-image:url(../assets/pt/${p[4]}.webp)"></span><span class="nm">${p[0]} <small style="color:#a8977a">${p[3]}</small></span><b>${win||i?p[2]:10}점</b></div>`).join('')}</div>
 <div class="btns"><button class="gb">보드 보기</button><button class="gb next">새 게임</button></div></div>`;
 const cv=document.getElementById('cv'),c=cv.getContext('2d');const fit=()=>{cv.width=innerWidth*Math.min(2,devicePixelRatio||1);cv.height=innerHeight*Math.min(2,devicePixelRatio||1);};fit();
 const R=Math.random,k=cv.width/innerWidth;const N=win?110:45;const ps=Array.from({length:N},()=>({x:R()*cv.width,y:-R()*cv.height,vy:(win?1.2:.5)+R()*(win?1.8:.6),vx:(R()-.5)*.6,r:(win?3:1.6)+R()*(win?4:2),a:R()*6.3,va:(R()-.5)*.15,c:win?['#f3d27a','#fff1c4','#e9b44e','#ffffff'][R()*4|0]:'#cfd8e6'}));
 const t0=performance.now();const f=t=>{c.clearRect(0,0,cv.width,cv.height);const on=Math.min(1,Math.max(0,(t-t0-900)/800));
  for(const p of ps){p.y+=p.vy*k;p.x+=p.vx*k+Math.sin((t/700)+p.a)*.4*k;p.a+=p.va;if(p.y>cv.height+20){p.y=-20;p.x=R()*cv.width;}
   c.save();c.globalAlpha=on*(win?.9:.35);c.translate(p.x,p.y);if(win){c.rotate(p.a);c.fillStyle=p.c;c.shadowColor='rgba(255,210,120,.8)';c.shadowBlur=8*k;c.fillRect(-p.r*k/2,-p.r*k*.7,p.r*k,p.r*k*1.4);}
   else{c.fillStyle=p.c;c.fillRect(0,0,1*k,p.r*6*k);}c.restore();}
  raf=requestAnimationFrame(f);};raf=requestAnimationFrame(f);}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{mode=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b));play();});
document.getElementById('rp').onclick=play;addEventListener('resize',play);play();
</script>
</body></html>
