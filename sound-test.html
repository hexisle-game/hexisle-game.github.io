<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>효과음 테스트</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#17110b;--panel:#241a10;--line:rgba(233,196,122,.28);--gold:#e9c47a;--txt:#efe2c4;--mut:#a8977a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:24px 16px 60px}
.wrap{max-width:980px;margin:0 auto}h1{color:var(--gold);font-size:26px;margin:0 0 4px}p.sub{color:var(--mut);margin:0 0 18px}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:22px}
.top label{color:var(--mut)}input[type=range]{accent-color:#d9a64c;width:180px}
h2{color:var(--gold);font-size:18px;margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.slot.empty{border-style:dashed}
.slot h3{margin:0;font-size:17px;color:#f6deaa;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:rgba(120,190,110,.18);color:#a9dc9c;white-space:nowrap}.empty .tag{background:rgba(255,255,255,.07);color:var(--mut)}
.desc{color:var(--mut);font-size:13px;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button,.file{font:inherit;font-size:14px;border-radius:8px;border:1px solid #8a6630;background:linear-gradient(#b4782e,#7c4c18);color:#fff3d6;padding:8px 14px;cursor:pointer}
button.alt{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--txt)}
button:disabled{opacity:.35;cursor:default}
.file{background:rgba(255,255,255,.04);border:1px dashed var(--line);color:var(--mut);display:inline-block}.file input{display:none}
.gain{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}.gain input{width:140px}.gain b{color:var(--txt);min-width:34px}
.fname{font-size:12px;color:var(--mut);word-break:break-all}
</style></head><body><div class="wrap">
<h1>효과음 테스트</h1><p class="sub">게임에 넣기 전에 들어보는 페이지예요. <b>새 효과음</b>은 올려준 파일, <b>현재</b>는 지금 게임에 들어 있는 소리예요. 빈 칸은 파일을 고르면 바로 들어볼 수 있어요(내 기기에서만 재생, 업로드 안 됨).</p>
<div class="top"><label>전체 효과음 음량</label><input type="range" id="master" min="0" max="100" value="55"><b id="mv">55%</b></div>
<h2>새 효과음 슬롯</h2><div class="grid" id="slots"></div>
<h2>기존 효과음 (참고)</h2><div class="grid"><div class="slot" style="grid-column:1/-1"><div class="btns" id="old"></div></div></div>
</div>
<script>
// ================= AUDIO v3 (procedural piano-centric) =================
const SND={ctx:null,playing:null,next:0,timer:null,vol:{bgm:.55,sfx:.8},on:{bgm:true,sfx:true},
  load(){try{const v=JSON.parse(localStorage.getItem('hexisle-audio')||'{}');Object.assign(this.vol,v.vol||{});Object.assign(this.on,v.on||{});}catch(e){}},
  save(){try{localStorage.setItem('hexisle-audio',JSON.stringify({vol:this.vol,on:this.on}));}catch(e){}},
  init(){if(this.ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    const c=this.ctx=new AC();const master=c.createDynamicsCompressor();master.threshold.value=-16;master.ratio.value=3;master.connect(c.destination);
    this.bgmBus=c.createGain();this.bgmG=c.createGain();this.sfxBus=c.createGain();this.sfxG=c.createGain();this.bgmBus.connect(this.bgmG);this.sfxBus.connect(this.sfxG);this.bgmG.connect(master);this.sfxG.connect(master);
    const mk=(sec,dec)=>{const len=c.sampleRate*sec,ir=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}return ir;};
    this.rev=c.createConvolver();this.rev.buffer=mk(3.2,2.2);const rg=c.createGain();rg.gain.value=.42;this.rev.connect(rg);rg.connect(this.bgmG);
    this.revS=c.createConvolver();this.revS.buffer=mk(1.8,2.6);const rs=c.createGain();rs.gain.value=.22;this.revS.connect(rs);rs.connect(this.sfxG);
    this.apply();return true;},
  apply(){if(!this.ctx)return;const t=this.ctx.currentTime;this.bgmG.gain.setTargetAtTime(this.on.bgm?this.vol.bgm*.55:0,t,.15);this.sfxG.gain.setTargetAtTime(this.on.sfx?this.vol.sfx:0,t,.05);},
  unlock(){if(!this.init())return;if(this.ctx.state==='suspended')this.ctx.resume();this.apply();},
  hz(n){return 440*Math.pow(2,(n-69)/12);},
  nbuf:null,noiseBuf(){if(this.nbuf)return this.nbuf;const c=this.ctx,b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return this.nbuf=b;},
  waves:{},
  wave(kind){if(this.waves[kind])return this.waves[kind];const N=24,re=new Float32Array(N),im=new Float32Array(N);
    const A={piano:k=>Math.pow(k,-1.35)*(k%7===0?.3:1)*(k===2?1.15:1),bell:k=>[0,1,.5,.0,.35,.0,.2,0,.1][k]||0,marimba:k=>k===1?1:k===4?.35:k===10?.08:0,harp:k=>Math.pow(k,-1.9),string:k=>1/k}[kind];
    for(let k=1;k<N;k++)im[k]=A(k);return this.waves[kind]=this.ctx.createPeriodicWave(re,im);},
  // ---------- instruments (dest: bus, rev) ----------
  piano(n,t,v,dur,bus,rv){const c=this.ctx,f=this.hz(n);bus=bus||this.bgmBus;rv=rv||this.rev;
    const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';const bright=Math.min(9000,f*(5+v*30));lp.frequency.setValueAtTime(bright,t);lp.frequency.exponentialRampToValueAtTime(Math.max(f*1.5,300),t+Math.min(2.5,dur));lp.Q.value=.3;
    [-3,3].forEach(ct=>{const o=c.createOscillator();o.setPeriodicWave(this.wave('piano'));o.frequency.value=f;o.detune.value=ct;o.connect(lp);o.start(t);o.stop(t+dur+1.2);});
    const T=Math.max(.6,4.2*Math.pow(220/f,.55));
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(v*.35,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+Math.min(T,dur+1));
    lp.connect(g);g.connect(bus);g.connect(rv);
    const h=c.createBufferSource();h.buffer=this.noiseBuf();const hf=c.createBiquadFilter();hf.type='bandpass';hf.frequency.value=Math.min(4000,f*4);hf.Q.value=1.5;const hg=c.createGain();
    hg.gain.setValueAtTime(v*.08,t);hg.gain.exponentialRampToValueAtTime(.0001,t+.03);h.connect(hf);hf.connect(hg);hg.connect(bus);h.start(t,Math.random());h.stop(t+.05);},
  tone(kind,n,t,v,dur,bus,rv){const c=this.ctx,f=this.hz(n);bus=bus||this.bgmBus;rv=rv||this.rev;const o=c.createOscillator(),g=c.createGain();o.setPeriodicWave(this.wave(kind));o.frequency.value=f;o.connect(g);g.connect(bus);g.connect(rv);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(kind==='marimba'?.003:.006));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.05);},
  strings(ns,t,v,dur,bus,rv){const c=this.ctx;bus=bus||this.bgmBus;rv=rv||this.rev;const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;lp.Q.value=.5;lp.connect(g);g.connect(bus);g.connect(rv);
    ns.forEach(n=>[-8,0,7].forEach(ct=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=this.hz(n);o.detune.value=ct;const og=c.createGain();og.gain.value=.33;o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur+.1);}));
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(1.2,dur*.4));g.gain.setValueAtTime(v,t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur);},
  flute(n,t,v,dur){const c=this.ctx;const o=c.createOscillator(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain(),f=c.createBiquadFilter();
    o.type='sine';o.frequency.value=this.hz(n);lfo.frequency.value=5;lg.gain.value=this.hz(n)*.004;lfo.connect(lg);lg.connect(o.frequency);f.type='lowpass';f.frequency.value=2200;o.connect(f);f.connect(g);g.connect(this.bgmBus);g.connect(this.rev);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.12);g.gain.setValueAtTime(v*.85,t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05);},
  // ---------- songs ----------
  SONGS:{},
  play(name){if(!this.ctx||this.playing===name)return;this.stop();if(!this.SONGS[name])return;this.playing=name;this.bar=0;this.mi=0;this.next=this.ctx.currentTime+.25;
    const now=this.ctx.currentTime;this.bgmBus.gain.cancelScheduledValues(now);this.bgmBus.gain.setValueAtTime(0,now);this.bgmBus.gain.linearRampToValueAtTime(1,now+1.5);this.loop();},
  loop(){if(!this.playing)return;const sg=this.SONGS[this.playing];while(this.next<this.ctx.currentTime+1.4){this.next+=sg.call(this,this.bar,this.next);this.bar++;}this.timer=setTimeout(()=>this.loop(),300);},
  stop(){this.playing=null;clearTimeout(this.timer);},
  // ---------- sfx: lower, instrument-based ----------
  sfx(k){if(!this.ctx||!this.on.sfx||this.vol.sfx<=0)return;if(this.ctx.state==='suspended')this.ctx.resume();const c=this.ctx,t=c.currentTime,B=this.sfxBus,R=this.revS;
    const pn=(n,dt,v,d)=>this.piano(n,t+dt,v,d||1.2,B,R);const mar=(n,dt,v,d)=>this.tone('marimba',n,t+dt,v,d||.35,B,R);const bell=(n,dt,v,d)=>this.tone('bell',n,t+dt,v,d||1.6,B,R);
    const st=(ns,dt,v,d)=>this.strings(ns,t+dt,v,d,B,R);
    const noise=(dt,v,d,type,fq,q)=>{const s=c.createBufferSource();s.buffer=this.noiseBuf();const f=c.createBiquadFilter();f.type=type;f.frequency.value=fq;f.Q.value=q||.7;const g=c.createGain();s.connect(f);f.connect(g);g.connect(B);
      g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(v,t+dt+d*.25);g.gain.exponentialRampToValueAtTime(.0001,t+dt+d);s.start(t+dt,Math.random());s.stop(t+dt+d+.05);};
    const knock=(dt,v,f0)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t+dt);o.frequency.exponentialRampToValueAtTime(f0*.6,t+dt+.07);o.connect(g);g.connect(B);
      g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(v,t+dt+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dt+.09);o.start(t+dt);o.stop(t+dt+.12);};
    switch(k){
      case 'click':mar(45,0,.28,.22);break;
      case 'card':noise(0,.18,.09,'highpass',2800,.5);noise(.05,.13,.12,'bandpass',4200,.8);noise(.11,.08,.08,'highpass',3500,.5);break;
      case 'roll':{noise(0,.035,.55,'bandpass',900,.6);let dt=.08,gap=.13,v=.16;for(let i=0;i<8;i++){knock(dt,v,300+Math.random()*90);noise(dt,v*.25,.03,'bandpass',1400,3);if(i%2)knock(dt+.02,v*.6,340+Math.random()*80);dt+=gap;gap*=.78;v*=i<2?1.15:.82;}break;}
      case 'gain':pn(62,0,.11,1.4);pn(66,.08,.09,1.4);pn(69,.16,.09,1.8);break;
      case 'build':mar(43,0,.34);mar(47,.1,.26);pn(55,.22,.11,1.4);pn(62,.3,.09,1.6);break;
      case 'road':mar(43,0,.38);mar(45,.09,.25);break;
      case 'city':mar(40,0,.32);mar(43,.1,.28);pn(50,.24,.11,2);pn(54,.32,.1,2);pn(57,.4,.1,2);pn(62,.48,.11,2.4);break;
      case 'dev':noise(0,.06,.14,'highpass',2600,.5);pn(67,.12,.12,1.2);pn(71,.2,.1,1.4);break;
      case 'trade':bell(74,0,.07,1.2);bell(79,.09,.06,1.3);bell(76,.18,.05,1.4);break;
      case 'turn':pn(50,0,.11,2);pn(57,0,.08,2);pn(62,.05,.08,2.2);break;
      case 'robber':pn(31,0,.12,2.4);pn(38,0,.08,2.2);pn(39,.02,.05,2.2);st([38,45],0,.025,2);break;
      case 'steal':pn(57,0,.15,1.2);pn(53,.15,.15,1.4);break;
      case 'error':pn(48,0,.16,.8);pn(47,.12,.14,.9);break;
      case 'win':st([50,57,62,66],0,.05,3.6);[50,54,57,62,66,69,74].forEach((n,i)=>pn(n,i*.13,.11,2.6));pn(38,0,.15,3.4);pn(45,.9,.1,3);break;
      case 'lose':st([45,52,57],0,.035,3);[57,55,52,50].forEach((n,i)=>pn(n,i*.28,.1,2));pn(38,.1,.11,3);break;}},
};

SND.vol.sfx=.55;
const SLOTS=[
 {id:'card',name:'카드 선택',desc:'자원·발전 카드를 고르거나 버릴 카드를 누를 때',file:'assets/sfx/card.mp3',fname:'taking-playing-card-3',gain:.5,cur:['card']},
 {id:'dice',name:'주사위 굴리기',desc:'주사위를 굴릴 때',file:'assets/sfx/dice.mp3',fname:'dice-sound',gain:.7,cur:['roll']},
 {id:'win',name:'승리',desc:'게임에서 이겼을 때',file:'assets/sfx/win.mp3',fname:'victory sound',gain:.6,cur:['win']},
 {id:'ui',name:'UI 펼치기 / 닫기',desc:'팝업·다이얼로그·설정 창을 열고 닫을 때',gain:.6,cur:[]},
 {id:'btn1',name:'주요 버튼',desc:'시작, 확인, 주사위, 건설 등 메인 버튼',gain:.6,cur:['click']},
 {id:'btn2',name:'보조 버튼',desc:'교환 후 거래, 취소, 탭 전환 같은 보조 버튼',gain:.6,cur:['click']},
 {id:'place',name:'건설 요소 놓기',desc:'도로·마을·도시를 보드에 놓을 때',gain:.6,cur:[['road','도로'],['build','마을'],['city','도시']]},
];
const bufs={};
async function loadBuf(key,ab){SND.unlock();const b=await new Promise((r,j)=>SND.ctx.decodeAudioData(ab,r,j));bufs[key]=b;return b;}
async function fileBuf(s){if(bufs[s.id])return bufs[s.id];if(!s.file)return null;const r=await fetch(s.file);return loadBuf(s.id,await r.arrayBuffer());}
async function playNew(s){SND.unlock();const b=await fileBuf(s);if(!b)return;const c=SND.ctx,src=c.createBufferSource(),g=c.createGain();g.gain.value=s.gain;src.buffer=b;src.connect(g);g.connect(SND.sfxBus);src.start();}
const box=document.getElementById('slots');
SLOTS.forEach(s=>{const el=document.createElement('div');el.className='slot'+(s.file?'':' empty');
  const cur=s.cur.map(c=>Array.isArray(c)?`<button class="alt" data-cur="${c[0]}">현재 · ${c[1]}</button>`:`<button class="alt" data-cur="${c}">현재 ▶</button>`).join('')||'<span class="desc">현재 게임엔 소리가 없어요</span>';
  el.innerHTML=`<h3>${s.name}<span class="tag">${s.file?'파일 등록됨':'파일 대기'}</span></h3><p class="desc">${s.desc}</p>
  <div class="btns"><button class="new" ${s.file?'':'disabled'}>새 효과음 ▶</button>${cur}</div>
  <div class="gain">볼륨 <input type="range" min="0" max="150" value="${Math.round(s.gain*100)}"><b>${Math.round(s.gain*100)}%</b></div>
  <div class="fname">${s.file?'파일: '+s.fname:''}</div>
  <label class="file">내 파일로 들어보기<input type="file" accept="audio/*"></label>`;
  el.querySelector('.new').onclick=()=>playNew(s);
  el.querySelectorAll('[data-cur]').forEach(b=>b.onclick=()=>{SND.unlock();SND.sfx(b.dataset.cur);});
  const r=el.querySelector('.gain input');r.oninput=()=>{s.gain=r.value/100;el.querySelector('.gain b').textContent=r.value+'%';};
  el.querySelector('input[type=file]').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await loadBuf(s.id,await f.arrayBuffer());el.querySelector('.new').disabled=false;el.querySelector('.fname').textContent='내 파일: '+f.name+' (이 기기에서만)';playNew(s);}catch(x){alert('이 파일은 재생할 수 없어요');}};
  box.appendChild(el);});
const OLD=[['click','클릭'],['card','카드'],['roll','주사위'],['gain','자원 획득'],['road','도로'],['build','마을'],['city','도시'],['dev','발전카드'],['trade','교환'],['turn','턴 시작'],['robber','도둑'],['steal','훔치기'],['error','오류'],['win','승리'],['lose','패배']];
document.getElementById('old').innerHTML=OLD.map(([k,n])=>`<button class="alt" data-k="${k}">${n}</button>`).join('');
document.querySelectorAll('#old [data-k]').forEach(b=>b.onclick=()=>{SND.unlock();SND.sfx(b.dataset.k);});
const m=document.getElementById('master');m.oninput=()=>{SND.vol.sfx=m.value/100;document.getElementById('mv').textContent=m.value+'%';SND.unlock();SND.apply();};
</script></body></html>
