<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HexIsle 사운드 테스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;700;800&display=swap">
<style>
:root{color-scheme:dark}body{margin:0;background:#1c140c;color:#efd9a6;font-family:Hahmlet,serif;padding:24px 18px 60px}
h1{font-size:26px;margin:0 0 6px}h2{font-size:19px;margin:30px 0 10px;color:#ffe2a0;border-bottom:1px solid rgba(233,196,122,.3);padding-bottom:6px}
p{color:#b8ab92;font-size:14px;margin:4px 0 12px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:900px}
button{font:inherit;font-size:16px;padding:14px 10px;border-radius:6px;border:1px solid #c9a35a;background:linear-gradient(180deg,#5a3c22,#36230f);color:#fff0d2;cursor:pointer}
button:active{transform:translateY(1px)}button.on{background:linear-gradient(180deg,#a3561e,#6a2d0c);box-shadow:0 0 12px rgba(243,190,90,.5)}
button small{display:block;font-size:12px;color:#d9c9a6;margin-top:3px}
.vol{display:flex;gap:14px;align-items:center;margin:10px 0}input{width:220px}
</style></head><body>
<h1>HexIsle 사운드 테스트</h1><p>버튼을 눌러 들어 보세요. 배경음은 하나씩만 재생돼요. (휴대폰은 무음 모드를 꺼 주세요)</p>
<div class="vol">배경음 <input type="range" min="0" max="100" value="60" id="vb"> 효과음 <input type="range" min="0" max="100" value="80" id="vs"></div>
<h2>배경음 후보</h2><p>첫 화면·대기실용 1곡, 게임 진행용 1곡을 골라 주세요. (같은 곡을 둘 다 써도 돼요)</p>
<div class="grid" id="bgm">
<button data-s="title">A. 성 앞 광장<small>첫 화면/대기실 후보 · 잔잔한 호른</small></button>
<button data-s="meadow">B. 초원 들판<small>3박자 하프 + 오보에</small></button>
<button data-s="village">C. 시골 마을<small>지난번 곡을 더 잔잔하게</small></button>
<button data-s="tavern">D. 아늑한 여관<small>가벼운 류트 + 피리</small></button>
<button data-s="calm">E. 고요한 섬<small>게임용 · 아주 미니멀</small></button>
<button data-s="">■ 정지</button></div>
<h2>효과음 (톤 낮춤)</h2><div class="grid" id="sfx">
<button data-k="click">버튼 클릭</button><button data-k="card">카드 선택</button><button data-k="roll">주사위 굴리기</button>
<button data-k="gain">자원 받기</button><button data-k="road">도로 건설</button><button data-k="build">정착지 건설</button><button data-k="city">도시 건설</button>
<button data-k="dev">발전 카드 구매</button><button data-k="trade">교환 성공</button><button data-k="turn">내 차례</button>
<button data-k="robber">도적 이동</button><button data-k="steal">카드 빼앗김</button><button data-k="error">실패</button><button data-k="win">승리</button><button data-k="lose">패배</button></div>
<script>// ================= AUDIO v2 (procedural) =================
const SND={ctx:null,bgmG:null,sfxG:null,rev:null,playing:null,next:0,timer:null,
  vol:{bgm:.55,sfx:.8},on:{bgm:true,sfx:true},
  load(){try{const v=JSON.parse(localStorage.getItem('hexisle-audio')||'{}');Object.assign(this.vol,v.vol||{});Object.assign(this.on,v.on||{});}catch(e){}},
  save(){try{localStorage.setItem('hexisle-audio',JSON.stringify({vol:this.vol,on:this.on}));}catch(e){}},
  init(){if(this.ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    const c=this.ctx=new AC();const master=c.createDynamicsCompressor();master.threshold.value=-14;master.ratio.value=3;master.connect(c.destination);
    this.bgmBus=c.createGain();this.bgmBus.gain.value=1;this.bgmG=c.createGain();this.sfxG=c.createGain();this.bgmBus.connect(this.bgmG);this.bgmG.connect(master);this.sfxG.connect(master);
    const len=c.sampleRate*3,ir=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);}
    this.rev=c.createConvolver();this.rev.buffer=ir;const rg=c.createGain();rg.gain.value=.38;this.rev.connect(rg);rg.connect(this.bgmBus);
    this.revS=c.createConvolver();this.revS.buffer=ir;const rs=c.createGain();rs.gain.value=.14;this.revS.connect(rs);rs.connect(this.sfxG);
    this.apply();return true;},
  apply(){if(!this.ctx)return;const t=this.ctx.currentTime;this.bgmG.gain.setTargetAtTime(this.on.bgm?this.vol.bgm*.5:0,t,.15);this.sfxG.gain.setTargetAtTime(this.on.sfx?this.vol.sfx:0,t,.05);},
  unlock(){if(!this.init())return;if(this.ctx.state==='suspended')this.ctx.resume();this.apply();},
  hz(n){return 440*Math.pow(2,(n-69)/12);},
  env(g,t,a,peak,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);},
  nbuf:null,noiseBuf(){if(this.nbuf)return this.nbuf;const c=this.ctx,b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return this.nbuf=b;},
  out(g){g.connect(this.bgmBus);g.connect(this.rev);},
  // ---------- instruments ----------
  I:{
    lute(n,t,v,dur){const c=this.ctx;const o=c.createOscillator(),o2=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain(),g2=c.createGain();
      o.type='triangle';o2.type='sawtooth';o.frequency.value=this.hz(n);o2.frequency.value=this.hz(n)*1.003;g2.gain.value=.15;
      f.type='lowpass';f.frequency.setValueAtTime(2600,t);f.frequency.exponentialRampToValueAtTime(420,t+dur*.6);f.Q.value=1;
      o.connect(f);o2.connect(g2);g2.connect(f);f.connect(g);this.out(g);this.env(g,t,.004,v,dur);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);},
    harp(n,t,v,dur){const c=this.ctx;[1,2,3].forEach((h,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=this.hz(n)*h;o.connect(g);this.out(g);this.env(g,t,.003,v*[1,.32,.12][i],dur*[1,.6,.35][i]);o.start(t);o.stop(t+dur+.05);});},
    flute(n,t,v,dur){const c=this.ctx;const o=c.createOscillator(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain(),f=c.createBiquadFilter();
      o.type='sine';o.frequency.value=this.hz(n);lfo.frequency.value=5;lg.gain.value=this.hz(n)*.005;lfo.connect(lg);lg.connect(o.frequency);
      const nb=c.createBufferSource();nb.buffer=this.noiseBuf();const nf=c.createBiquadFilter();nf.type='bandpass';nf.frequency.value=this.hz(n)*2;nf.Q.value=4;const ng=c.createGain();ng.gain.value=.04;nb.connect(nf);nf.connect(ng);ng.connect(g);
      f.type='lowpass';f.frequency.value=2200;o.connect(f);f.connect(g);this.out(g);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.14);g.gain.setValueAtTime(v*.85,t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur);
      o.start(t);lfo.start(t);nb.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05);nb.stop(t+dur+.05);},
    oboe(n,t,v,dur){const c=this.ctx;const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter(),lfo=c.createOscillator(),lg=c.createGain();
      o.type='sawtooth';o.frequency.value=this.hz(n);lfo.frequency.value=5.5;lg.gain.value=this.hz(n)*.004;lfo.connect(lg);lg.connect(o.frequency);
      f.type='bandpass';f.frequency.value=1100;f.Q.value=1.4;o.connect(f);f.connect(g);this.out(g);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.09);g.gain.setValueAtTime(v*.8,t+dur*.75);g.gain.linearRampToValueAtTime(0,t+dur);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05);},
    horn(n,t,v,dur){const c=this.ctx;const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.value=this.hz(n);
      f.type='lowpass';f.frequency.setValueAtTime(400,t);f.frequency.linearRampToValueAtTime(1100,t+.25);f.Q.value=.7;o.connect(f);f.connect(g);this.out(g);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.22);g.gain.setValueAtTime(v*.8,t+dur*.75);g.gain.linearRampToValueAtTime(0,t+dur);o.start(t);o.stop(t+dur+.05);},
    pad(ns,t,v,dur){const c=this.ctx;ns.forEach(n=>{[0,.006].forEach(dt=>{const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='triangle';o.frequency.value=this.hz(n)*(1+dt);
      f.type='lowpass';f.frequency.value=800;o.connect(f);f.connect(g);this.out(g);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur);o.start(t);o.stop(t+dur+.05);});});},
    drum(t,v){const c=this.ctx;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(100,t);o.frequency.exponentialRampToValueAtTime(52,t+.2);o.connect(g);g.connect(this.bgmBus);this.env(g,t,.003,v,.28);o.start(t);o.stop(t+.32);},
  },
  // ---------- songs: each fn(bar,t) schedules one bar; returns bar length (s) ----------
  SONGS:{},
  play(name){if(!this.ctx)return;if(this.playing===name)return;this.stop();const sg=this.SONGS[name];if(!sg)return;this.playing=name;this.bar=0;this.mi=0;this.next=this.ctx.currentTime+.25;
    this.bgmBus.gain.cancelScheduledValues(this.ctx.currentTime);this.bgmBus.gain.setValueAtTime(0,this.ctx.currentTime);this.bgmBus.gain.linearRampToValueAtTime(1,this.ctx.currentTime+1.5);this.loop();},
  loop(){if(!this.playing)return;const sg=this.SONGS[this.playing];const I={};for(const k in this.I)I[k]=this.I[k].bind(this);
    while(this.next<this.ctx.currentTime+1.4){const len=sg.call(this,this.bar,this.next,I);this.next+=len;this.bar++;}
    this.timer=setTimeout(()=>this.loop(),300);},
  stop(){this.playing=null;clearTimeout(this.timer);},
  // ---------- sfx (lower, rounder) ----------
  sfx(k){if(!this.ctx||!this.on.sfx||this.vol.sfx<=0)return;if(this.ctx.state==='suspended')this.ctx.resume();const c=this.ctx,t=c.currentTime,G=this.sfxG;
    const tone=(n,dt,v,d,type)=>{const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;o.type=type||'sine';o.frequency.value=this.hz(n);o.connect(f);f.connect(g);g.connect(G);g.connect(this.revS);this.env(g,t+dt,.006,v,d);o.start(t+dt);o.stop(t+dt+d+.05);};
    const noise=(dt,v,d,fq,q)=>{const s=c.createBufferSource();s.buffer=this.noiseBuf();const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=q||1;const g=c.createGain();s.connect(f);f.connect(g);g.connect(G);this.env(g,t+dt,.002,v,d);s.start(t+dt,Math.random()*.5);s.stop(t+dt+d+.05);};
    const tok=(dt,v,f0,d)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t+dt);o.frequency.exponentialRampToValueAtTime(f0*.55,t+dt+(d||.09));o.connect(g);g.connect(G);this.env(g,t+dt,.002,v,d||.1);o.start(t+dt);o.stop(t+dt+(d||.1)+.05);noise(dt,v*.35,.025,f0*3,2);};
    const clack=(dt,v)=>{tok(dt,v,520+Math.random()*120,.06);noise(dt,v*.6,.03,1500+Math.random()*500,4);};
    switch(k){
      case 'click':tok(0,.22,330,.07);break;
      case 'card':noise(0,.16,.07,1100,1.2);tok(.02,.12,260,.08);break;
      case 'roll':{let dt=0,gap=.16,v=.34;for(let i=0;i<7;i++){clack(dt,v);if(i%2===0)clack(dt+.025,v*.7);dt+=gap;gap*=.72;v*=.8;}noise(0,.06,.5,700,.6);break;}
      case 'gain':[69,73,76].forEach((n,i)=>tone(n,i*.08,.13,.55));break;
      case 'build':tok(0,.4,170,.14);tok(.13,.32,210,.12);[62,67].forEach((n,i)=>tone(n,.24+i*.09,.11,.6,'triangle'));break;
      case 'road':tok(0,.38,180,.13);noise(.02,.12,.1,500,.8);break;
      case 'city':tok(0,.45,150,.15);tok(.12,.38,180,.13);tok(.24,.34,220,.12);[62,66,69,74].forEach((n,i)=>tone(n,.34+i*.09,.11,.8,'triangle'));break;
      case 'dev':noise(0,.15,.1,1400,1);noise(.09,.12,.09,1700,1);tone(76,.16,.07,.3);break;
      case 'trade':for(let i=0;i<4;i++)tone(76+Math.floor(Math.random()*5),i*.07,.08,.28);break;
      case 'turn':tone(62,0,.14,1.3);tone(69,0,.06,1.3);break;
      case 'robber':tone(38,0,.2,1.2,'triangle');tone(39,0,.12,1.2,'triangle');noise(0,.1,.6,240,.7);break;
      case 'steal':noise(0,.14,.12,900,1);tone(58,.05,.1,.22,'triangle');tone(54,.14,.1,.28,'triangle');break;
      case 'error':tone(50,0,.12,.2,'triangle');tone(47,.12,.12,.25,'triangle');break;
      case 'win':[50,54,57,62,66,69,74].forEach((n,i)=>tone(n,i*.12,.14,1.4,'triangle'));tone(38,0,.14,2.4,'triangle');break;
      case 'lose':[57,55,52,50].forEach((n,i)=>tone(n,i*.22,.12,1,'triangle'));break;}},
};
// ---------- song library ----------
(()=>{const S=SND.SONGS;
// A: village (current style, gentler)  D dorian 6/8
S.village=function(bar,t,I){const beat=60/70,e=beat/3,D=62;const P=[[0,7,15],[-2,5,14],[-4,3,12],[-2,5,14],[0,7,15],[3,10,19],[-2,5,14],[0,7,12]];const ch=P[bar%8];
  [0,1,2,1,2,1].forEach((k,i)=>I.lute(D-12+ch[k],t+i*e,i?.06:.09,1.2));I.lute(D-24+ch[0],t,.1,2.4);if(bar%2===0)I.pad([D-12+ch[0],D-12+ch[1],D-12+ch[2]],t,.03,beat*4);
  const M=[[14,2],[12,1],[10,1],[12,2],[14,1],[17,3],[15,2],[14,1],[12,3],[10,2],[12,1],[14,2],[10,1],[9,3],[12,2],[10,1],[7,3],[0,3]];const cyc=bar%24;
  if(cyc>=8&&cyc<20){let mt=0;while(mt<6){const m=M[this.mi%M.length];I.flute(D+m[0],t+mt*e,.06,m[1]*e*.95);mt+=m[1];this.mi++;}}else this.mi=0;return beat*2;};
// B: meadow field  G major 3/4, harp waltz + oboe
S.meadow=function(bar,t,I){const q=60/88,G=55;const P=[[0,4,7],[5,9,12],[7,11,14],[0,4,7],[-3,0,4],[5,9,12],[2,5,9],[7,11,14]];const ch=P[bar%8];
  I.harp(G-12+ch[0],t,.12,2.2);I.harp(G+ch[1],t+q,.07,1.3);I.harp(G+ch[2],t+q*2,.07,1.3);if(bar%4===0)I.pad([G+ch[0],G+ch[1],G+ch[2]],t,.022,q*12);
  const M=[[12,2],[14,1],[16,2],[14,1],[12,3],[9,2],[11,1],[12,2],[14,1],[11,3],[12,2],[16,1],[19,2],[17,1],[16,3],[14,2],[12,1],[14,3]];const cyc=bar%16;
  if(cyc>=4&&cyc<12){let mt=0;while(mt<3){const m=M[this.mi%M.length];I.oboe(G+m[0],t+mt*q,.045,m[1]*q*.95);mt+=m[1];this.mi++;}}else this.mi=0;return q*3;};
// C: calm play (minimal, for focus)  A minor pentatonic, sparse harp over drone
S.calm=function(bar,t,I){const b=60/60,A=57;const P=[[0,7,12],[-4,3,8],[-2,5,10],[-5,2,7]];const ch=P[bar%4];
  I.pad([A-12+ch[0],A-12+ch[1],A+ch[2]],t,.026,b*4.4);const pent=[0,3,5,7,10,12,15];const seed=(bar*7919)%13;
  [0,1.5,2.5,3.25].forEach((x,i)=>{if((seed+i)%3!==0)I.harp(A+pent[(seed+i*3)%pent.length],t+x*b,.055,2.4);});return b*4;};
// D: title / lobby  grand but soft, D major, horn + strings
S.title=function(bar,t,I){const b=60/64,D=62;const P=[[0,4,7],[-5,-1,2],[-3,0,4],[-7,-3,0],[0,4,7],[5,9,12],[-5,-1,2],[0,4,7]];const ch=P[bar%8];
  I.pad([D-12+ch[0],D+ch[1],D+ch[2],D+12+ch[0]],t,.028,b*4.2);I.harp(D-24+ch[0],t,.11,3);[0,1,2,3].forEach(i=>I.harp(D+ch[(i%3)]+(i===3?12:0),t+b*(i+.5),.04,1.8));
  const M=[[7,2],[9,1],[11,1],[12,4],[11,2],[9,2],[7,4],[4,2],[7,2],[9,4],[7,4]];const cyc=bar%16;
  if(cyc>=4&&cyc<12){let mt=0;while(mt<4){const m=M[this.mi%M.length];I.horn(D+m[0]-12,t+mt*b,.05,m[1]*b*.97);mt+=m[1];this.mi++;}}else this.mi=0;
  if(bar%4===3)I.drum(t+b*3,.08);return b*4;};
// E: tavern-lite  F lydian folk, 6/8 lute + flute, light & cozy
S.tavern=function(bar,t,I){const beat=60/80,e=beat/3,F=65;const P=[[0,4,7],[2,6,9],[0,4,7],[-1,2,7],[-3,0,4],[2,6,9],[-5,-1,2],[0,4,7]];const ch=P[bar%8];
  I.lute(F-24+ch[0],t,.11,1.4);I.lute(F-12+ch[1],t+e*2,.06,.9);I.lute(F-12+ch[2],t+e*3,.06,.9);I.lute(F-12+ch[1],t+e*5,.05,.8);if(bar%2===1)I.drum(t+e*3,.06);
  const M=[[7,1],[9,1],[11,1],[12,2],[11,1],[9,2],[7,1],[4,3],[6,1],[7,1],[9,1],[11,3],[9,2],[7,1],[6,3],[7,3]];const cyc=bar%16;
  if(cyc>=4&&cyc<14){let mt=0;while(mt<6){const m=M[this.mi%M.length];I.flute(F+m[0],t+mt*e,.05,m[1]*e*.92);mt+=m[1];this.mi++;}}else this.mi=0;return beat*2;};
})();

SND.vol={bgm:.6,sfx:.8};
document.getElementById('bgm').onclick=e=>{const b=e.target.closest('button');if(!b)return;SND.unlock();document.querySelectorAll('#bgm button').forEach(x=>x.classList.toggle('on',x===b&&!!b.dataset.s));if(!b.dataset.s)SND.stop();else{SND.stop();SND.play(b.dataset.s);}};
document.getElementById('sfx').onclick=e=>{const b=e.target.closest('button');if(!b)return;SND.unlock();SND.sfx(b.dataset.k);};
vb.oninput=()=>{SND.vol.bgm=vb.value/100;SND.apply();};vs.oninput=()=>{SND.vol.sfx=vs.value/100;SND.apply();};
</script></body></html>
