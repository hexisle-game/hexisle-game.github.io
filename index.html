<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b09">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<title>HexIsle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300..900&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--sea:#0b1620;--sea-2:#122230;--surface:#162736;--surface-2:#1f3547;--line:#33506a;--trim:#8a6d3b;--ink:#ecf0ec;--muted:#9fb3c0;--gold:#e3b95c;--gold-ink:#2a1e06;--danger:#ff8a7a;--ok:#7fd6a1;--t-wood:#2f6f3e;--t-brick:#b65a35;--t-wool:#94c45c;--t-grain:#e3b63f;--t-ore:#7d8899;--t-desert:#d6c290;--token:#f5ead0;--token-ink:#26221a;--hot:#cf3a2f;--shore:#c9b98a;--display:"Hahmlet",system-ui,sans-serif;--body:"Hahmlet",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{font-family:var(--body);font-size:14px}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap}
header.top h1{margin:0}
header.top .tools{margin-left:auto;display:flex;flex-wrap:wrap}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
select.btn{appearance:auto}
.game{display:grid;margin:0 auto;align-items:start}
@media (max-width:920px){
  .game{grid-template-columns:minmax(0,1fr)}
}
.board-wrap{min-width:0;display:flex;flex-direction:column}
.coach{border:1px solid var(--line);border-radius:10px}
.side{display:flex;flex-direction:column;min-width:0}
.panel{background:linear-gradient(180deg,var(--surface-2),var(--surface) 60px);border:1px solid var(--line);border-top-color:var(--trim);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.panel h2{text-transform:uppercase}
.turnbar{display:flex;align-items:center;gap:12px}
.turnbar .who{flex:1;min-width:0}
.turnbar .who .n{font-family:var(--display);font-weight:800;line-height:1.1}
.turnbar .who .t{color:var(--muted);font-size:12px}
.dice{display:flex;gap:6px}
.die{width:38px;height:38px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5px}
.die i{width:7px;height:7px;border-radius:50%;background:var(--token-ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.roll{animation:shake .45s}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.08)}60%{transform:rotate(10deg)}100%{transform:rotate(0)}}
.art.bg-wood{background:linear-gradient(160deg,#4f8a45,#2c5a2a)}
.art.bg-brick{background:linear-gradient(160deg,#c4704a,#8a3f24)}
.art.bg-wool{background:linear-gradient(160deg,#9ccc65,#5f8c36)}
.art.bg-grain{background:linear-gradient(160deg,#e6be4f,#a8811f)}
.art.bg-ore{background:linear-gradient(160deg,#8a94a3,#4d5562)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{display:flex;align-items:center;gap:10px;padding:8px 10px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;min-width:0}
.act:hover:not(:disabled){border-color:var(--gold);background:#24405a}
.act.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;background:#2a3f30}
.act .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.act .tx b{font-size:13.5px}
.act .tx small{color:var(--muted);font-size:11.5px}
.tray{position:relative;display:grid;background-color:#5b3a20;background-size:cover}
.tray-h{display:flex;align-items:baseline;flex-wrap:wrap}
.tray-h span{font-weight:500;font-size:12.5px}
.fan{position:relative;height:var(--fh,230px);margin:4px 0 0}
.fan .cw{position:absolute;left:50%;top:22px;transform-origin:50% 120%;transition:transform .25s}
.fan .card{display:block;width:var(--cw,128px);height:auto;border-radius:calc(var(--cw,128px)*.075);box-shadow:0 1px 0 rgba(0,0,0,.3),-2px 6px 14px rgba(0,0,0,.45);transition:transform .18s;cursor:default;user-select:none;-webkit-user-drag:none}
.fan .cw:hover .card{transform:translateY(-22px)}
.fan .cw:hover{z-index:99!important}
.fan .newtag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;white-space:nowrap}
.emptyhand{display:grid;place-items:center;text-align:center;padding:10px}
.tally{display:flex;flex-wrap:wrap}
.tally span{font-size:12.5px;font-variant-numeric:tabular-nums}
.tally span.z{opacity:.45}
.bld{position:relative;display:flex;flex-direction:column;align-items:center;color:#f3dfb8}
.bld img{width:100%;max-width:150px;height:auto;aspect-ratio:260/220;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));pointer-events:none}
.bld .devstack{display:grid;place-items:center;position:relative;width:100%}
.bld .devstack img{position:absolute;max-width:none;aspect-ratio:auto;border-radius:5px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}
.bld .meta2{color:rgba(243,223,184,.8)}
.mini{display:flex;gap:0;justify-content:center}
.mini img{height:auto;border-radius:2px;box-shadow:-1px 1px 2px rgba(0,0,0,.5)}
.mini img:first-child{margin-left:0}
.tbtn{padding:12px 10px;border-radius:10px;font-weight:800;font-size:14.5px;border:1px solid rgba(0,0,0,.4);background:linear-gradient(180deg,#3b4c5c,#25323e);color:#f3eadb;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 rgba(0,0,0,.35)}
.tbtn.primary{background:linear-gradient(180deg,#f0c55e,#c99a33);color:#2a1e06}
.tbtn:hover:not(:disabled){filter:brightness(1.08)}
.tbtn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 0 rgba(0,0,0,.35)}
.sum{font-weight:800;font-size:30px;color:var(--gold);min-width:36px;text-align:right;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sum small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:0}
.res{border-radius:10px;padding:6px 4px 5px;text-align:center;color:#fff;position:relative;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.res svg{width:22px;height:22px;display:block;margin:0 auto;color:rgba(255,255,255,.9)}
.res .c{font-size:20px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.res .l{font-size:11px;opacity:.9}
.bg-wood{background:var(--t-wood)}
.bg-brick{background:var(--t-brick)}
.bg-wool{background:#6e9d3a}
.bg-grain{background:#b88a17}
.bg-ore{background:#5f6a7b}
.bg-desert{background:#9d8a5a}
.dev{display:flex;align-items:center;gap:8px;background:var(--sea-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.dev .nm{font-weight:700}
.dev .ds{color:var(--muted);font-size:12px;flex:1;min-width:0}
.dev .btn{padding:4px 10px}
.empty{color:var(--muted);font-size:12.5px}
.cost{display:flex;gap:3px;flex-wrap:wrap}
.pip{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:4px;font-size:10.5px;font-weight:700;color:#fff}
.players{display:flex;flex-direction:column}
.pl{display:grid;align-items:center}
.pl .dot{border-radius:3px;grid-column:1;grid-row:1/3}
.pl .nm{grid-column:2;grid-row:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .vp{grid-column:3;grid-row:1/3;font-variant-numeric:tabular-nums}
.pl .meta{grid-column:2;grid-row:2;display:flex;flex-wrap:wrap}
.badge{font-size:10.5px;padding:0 5px}
.log{max-height:220px;overflow:auto;display:flex;flex-direction:column}
.log .turn{padding-top:4px;margin-top:2px}
.log .sys{color:var(--muted)}
details.ref summary{cursor:pointer;font-size:12.5px}
.reftable{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.reftable td{padding:4px 0}
#stage{position:relative;overflow:hidden;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
.toast{position:absolute;background:rgba(10,20,28,.88);border:1px solid var(--trim);border-radius:10px;line-height:1.5;z-index:3;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast .ex{font-size:12.5px;margin-top:2px}
.toast.show{animation:toastIn .25s ease-out}
#tip,#pop{position:fixed;z-index:70;max-width:300px;background:#0d1922;border:1px solid var(--trim);border-radius:9px;padding:9px 11px;font-size:12.8px;line-height:1.55;box-shadow:0 10px 28px rgba(0,0,0,.45);color:var(--ink)}
#tip{pointer-events:none}
#pop{max-width:340px}
#pop h4{margin:0 0 4px;font-family:var(--display);font-weight:800;color:var(--gold);font-size:16px}
#pop p{margin:0 0 6px}
#pop .muted{color:var(--muted);font-size:12px}
#pop ul{margin:4px 0 6px;padding-left:18px}
.q{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--line);font-size:11px;margin-left:3px;text-decoration:none}
.linkish{background:none;border:none;padding:4px 0 0;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.cnt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.cnt .btn{display:flex;flex-direction:column;align-items:flex-start;min-width:110px;flex:1;text-align:left}
.cnt small{font-weight:400;opacity:.8;font-size:11.5px}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1}
.nogl{padding:40px 20px;text-align:center;color:var(--muted)}
@media (max-width:920px){
  #stage{height:min(96vw,620px);min-height:340px}
}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){
  .die.roll{animation:none}
}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);width:min(620px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet h3{font-size:24px;margin:0 0 10px;text-wrap:balance}
.sheet p{margin:0 0 10px;max-width:62ch}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
.pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:6px 0 12px}
.pick button{border:2px solid transparent;border-radius:10px;padding:6px 2px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.pick button.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.pick button small{display:block;font-size:11px;opacity:.9}
.pick svg{width:20px;height:20px;display:block;margin:0 auto}
.step{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:6px 0 12px}
.step .cell{border-radius:10px;padding:6px 4px;text-align:center;color:#fff}
.step .cell .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.step .cell .b{display:flex;gap:4px;justify-content:center}
.step .cell button{width:26px;height:26px;border-radius:6px;border:none;background:rgba(0,0,0,.3);font-weight:700}
.label{font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.resp{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.resp .r{display:flex;align-items:center;gap:8px;padding:6px 10px}
.resp .r span{flex:1}
.ok{color:var(--ok)}
.no{color:var(--danger)}
.tut-body{min-height:240px}
.diag{display:block;width:100%;max-width:380px;height:auto;margin:2px auto 12px;color:var(--ink);font-family:var(--body)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.flow span{border:1px solid var(--trim);padding:5px 9px;font-weight:700;font-size:13px}
.flow i{color:var(--gold);font-style:normal}
.tut-dots{display:flex;gap:5px;align-items:center;margin-right:auto}
.tut-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tut-dots i.on{background:var(--gold)}
.terr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.terr div{border-radius:10px;padding:8px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4);font-size:13px}
.terr b{display:block;font-size:15px}
.steps{margin:6px 0 10px;padding-left:20px;line-height:1.75}
.hero-title{font-size:44px;line-height:1;margin:4px 0 8px}
.scores{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.scores div{display:flex;gap:10px;align-items:center;background:var(--sea-2);padding:6px 10px;border-radius:8px}
.scores b{margin-left:auto;font-family:var(--display);font-size:18px}
header.top{max-width:none}
.game{max-width:none;grid-template-columns:minmax(0,1fr) 272px}
.coach{min-height:0}
#stage{height:auto;min-height:380px;max-height:none;flex:1}
@media (min-width:1101px) and (min-height:700px){
  body{padding-block:12px}
  .board-wrap{height:calc(100dvh - 96px)}
  .side{height:calc(100dvh - 96px);overflow:hidden}
  .side .logpanel{flex:1;min-height:0;display:flex;flex-direction:column}
  .side .log{max-height:none;flex:1}
}
@media (max-width:1100px){
  .game{grid-template-columns:minmax(0,1fr)}
  #stage{flex:none;height:min(78vw,640px)}
}
.stagebtns{position:absolute;z-index:2;display:flex}
.dicebox{position:absolute;z-index:2;display:flex;align-items:center;border-radius:12px}
.dicebox .sum{min-width:0}
.dicebox .who{font-size:12px;color:var(--muted);line-height:1.3;max-width:120px}
.dicebox.rolling .die{animation:none}
.dicebox .dice{overflow:hidden}
@keyframes slotIn{from{transform:translateY(-55%);opacity:.35}to{transform:none;opacity:1}}
.toast{left:auto;transform:none}
@media (max-width:640px){
  .stagebtns .tbtn{flex:1;min-width:0}
}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}}
.crow{display:flex;align-items:flex-end;min-height:calc(var(--cw)*1.525 + 14px)}
.crow .cw{position:relative;transition:transform .15s;flex:none}
.crow .cw:hover{transform:translateY(-14px);z-index:99!important}
.crow .card{display:block;width:var(--cw);height:auto;border-radius:calc(var(--cw)*.075);user-select:none;-webkit-user-drag:none}
.crow.devrow2 .card{cursor:pointer}
.crow .newtag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;white-space:nowrap}
.emptyhand{height:auto;min-height:100px;font-size:12.5px}
.builds{display:grid}
.bld .pimg{display:grid;place-items:center;width:100%}
.bld .pimg img{width:auto;max-width:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.bld b{font-size:12.5px}
.bld .meta2{font-size:10.5px}
.mini{min-height:20px;margin-top:2px}
.mini img{width:14px;margin-left:-4px}
.bld .devstack{height:58px}
.bld .devstack img{width:30px}
.turnbar .who .n{font-size:18px}
.pl{grid-template-columns:10px minmax(0,1fr) auto}
.pl .dot{width:10px;height:10px}

><path d='M1.5 29V9.5C1.5 5 5 1.5 9.5 1.5H29' stroke='%23c9a560' stroke-width='1.6'/><path d='M5 24V11C5 7.5 7.5 5 11 5h13' stroke='%237a5a30' stroke-width='1'/><path d='M8.5 15c0-4 2.5-6.5 6.5-6.5' stroke='%23d9b36a' stroke-width='1.2'/></g><g transform='translate(30 30) scale(-1 -1)'><circle cx='9' cy='9' r='2.2' fill='%23e6c47a'/><circle cx='9' cy='9' r='.9' fill='%233a2414'/></g></svg>");--leather:none}
header.top .sub{color:#a88f6c;letter-spacing:.04em}

/* trade info */
.tinfo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.tinfo .cost{margin-top:6px;flex-wrap:wrap}
.tinfo .pdev{background:rgba(255,255,255,.14)}
/* side panels text-only (PC like phone) */
.side .panel{background:none!important;border:0!important;box-shadow:none!important}
.side .pl,.side .log,.side .panel h2,.side .gameinfo,.side .roundline{text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.6)}
html:not(.phone) .side .pl.cur{background:rgba(0,0,0,.3)!important}
/* bigger logo + dice */
html:not(.phone) header.top h1.logo{font-size:39px}
html.phone header.top h1.logo{font-size:26px}
.dicebox .die{width:86px!important;height:86px!important;padding:12px!important;border-radius:14px!important}
.dicebox .die i{width:15px;height:15px}
.dicebox .sum{font-size:69px!important}
.dicebox{gap:18px!important}
.reelwin{border-radius:14px}
html.phone .dicebox .die{width:55px!important;height:55px!important;padding:8px!important;border-radius:11px!important}
html.phone .dicebox .die i{width:10px;height:10px}
html.phone .dicebox .sum{font-size:44px!important}
html.phone .dicebox{gap:12px!important}
html.phone .reelwin{border-radius:11px}
/* roomier PC modals */
html:not(.phone) .sheet.sheet-start{width:min(980px,calc(100vw - 48px));display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:0 56px;align-items:center;padding:56px 64px!important;font-size:16px}
html:not(.phone) .sheet-start .hero-title.logo{font-size:68px;margin:12px 0 22px}
html:not(.phone) .sheet-start .st-l p{font-size:18px;line-height:1.8}
html:not(.phone) .sheet-start .label{font-size:15px;margin-top:18px!important;margin-bottom:10px}
html:not(.phone) .sheet-start .st-l .label{margin-top:0!important}
html:not(.phone) .sheet-start .cnt{gap:10px}
html:not(.phone) .sheet-start .cnt .btn{font-size:18px;padding:14px 16px;gap:4px;min-width:0}
html:not(.phone) .sheet-start .cnt small{font-size:13.5px;line-height:1.45}
html:not(.phone) .sheet-start .st-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
html:not(.phone) .sheet-start .st-btns .btn{font-size:17px;padding:15px 12px}
html:not(.phone) .sheet-start .st-btns #sTut{grid-column:1/-1}
html:not(.phone) .sheet-newgame .st-l h3{font-size:38px;line-height:1.25;margin-bottom:16px}
html:not(.phone) .sheet-newgame .st-btns #cYes{order:2}
html:not(.phone) .sheet.sheet-rules{width:min(940px,calc(100vw - 48px));height:min(880px,calc(100dvh - 48px));padding:44px 56px 34px!important;font-size:16.5px}
html:not(.phone) .sheet-rules h3{font-size:32px;margin:6px 0 22px!important}
html:not(.phone) .sheet-rules .label{font-size:14px}
html:not(.phone) .sheet-rules .tut-body p,html:not(.phone) .sheet-rules .tut-body li{font-size:16.5px;line-height:1.85}
html:not(.phone) .sheet-rules .tut-body p{margin-bottom:16px;max-width:none}
html:not(.phone) .sheet-rules .steps li{margin-bottom:8px}
html:not(.phone) .sheet-rules .reftable{font-size:15.5px}
html:not(.phone) .sheet-rules .reftable td{padding:10px 8px 10px 0}
html:not(.phone) .sheet-rules .row{padding-top:20px}
html:not(.phone) .sheet-rules .row .btn{font-size:16px;padding:12px 26px}
html:not(.phone) .sheet-rules .mclose{top:22px;right:22px;width:44px;height:44px;font-size:28px}
html:not(.phone) body #leftcol{top:100px}
.dicebox .who{max-width:none;white-space:nowrap}
.cnt small{word-break:keep-all}
html.phone .sheet-trade p.empty{display:none}
html.phone .sheet-trade .tinfo{margin-top:8px;padding-top:8px}
.sheet-start .st-btns #sNew:last-child{grid-column:1/-1}

/* discard v3 */
.dzone{min-height:calc(var(--cw)*1.525 + 20px);display:flex;align-items:flex-end;margin:4px 0 12px}
.dzone .crow{padding-top:16px;min-height:0}
.crow.dpick .card{cursor:pointer}
.crow.dfull .card{cursor:not-allowed;filter:brightness(.7)}
.crow.dfull .cw:hover{transform:none}
.dempty{width:100%;min-height:calc(var(--cw)*1.525);display:grid;place-items:center;border:1px dashed rgba(255,255,255,.2);color:#8f897f;font-size:14px}
.dcnt{margin-left:4px;color:#e9c47a}
.dcnt.ok{color:#9fd68a}
/* settings align */
.setpanel .msep{display:none}
.setpanel .mi{box-sizing:border-box;height:68px;padding:0 36px!important;margin:0}
.setpanel .seg button{padding:7px 14px;line-height:1.2}
html.phone .setpanel .mi{height:52px;padding:0 26px!important}
html.phone .setpanel .seg button{padding:5px 11px;font-size:14px}
/* start modal spacing */
html:not(.phone) .sheet-start .cnt .btn{gap:6px}
html:not(.phone) .sheet-start .st-r .label{margin-top:26px!important;margin-bottom:14px}
html:not(.phone) .sheet-start .st-r .label:first-child{margin-top:0!important}
html.phone .sheet-start .cnt .btn{gap:4px}
html.phone .sheet-start .st-r .label{margin-top:18px!important;margin-bottom:8px}
html.phone .sheet-start .st-r .label:first-child{margin-top:0!important}
/* info icon gap */
.tray-h .qi{margin-left:-6px}

<script id="logic">
// ================= GAME LOGIC (no DOM) =================
const HR=60,SQ3=Math.sqrt(3);
const RES=['wood','brick','wool','grain','ore'];
const RN={wood:'목재',brick:'벽돌',wool:'양모',grain:'곡물',ore:'광석',desert:'사막'};
const TN={wood:'숲',brick:'언덕',wool:'목초지',grain:'밭',ore:'산',desert:'사막'};
const COST={road:{wood:1,brick:1},settlement:{wood:1,brick:1,wool:1,grain:1},city:{grain:2,ore:3},dev:{wool:1,grain:1,ore:1}};
const BN={road:'도로',settlement:'정착지',city:'도시',dev:'발전 카드'};
const DEVN={knight:'기사',roads:'도로 건설',plenty:'풍년',monopoly:'독점',vp:'승점'};
const DEVD={knight:'도적을 옮기고 상대 카드 1장을 빼앗아요.',roads:'도로 2개를 무료로 놓아요.',plenty:'은행에서 원하는 자원 2장을 받아요.',monopoly:'자원 1종을 골라 상대들이 가진 것을 전부 가져와요.',vp:'갖고만 있어도 1점. 상대에게는 보이지 않아요.'};
const PCOL=['#f03a2e','#3a8cff','#e046e0','#f5c400'];
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const emptyRes=()=>({wood:0,brick:0,wool:0,grain:0,ore:0});
const sumRes=r=>RES.reduce((s,k)=>s+(r[k]||0),0);
const pips=n=>n?6-Math.abs(7-n):0;
function argmax(arr,f){let b=arr[0],bv=-Infinity;for(const x of arr){const v=f(x);if(v>bv){bv=v;b=x;}}return b;}
const fmt=o=>RES.filter(k=>o[k]).map(k=>`${RN[k]} ${o[k]}`).join(', ')||'없음';

const G=(function(){
  const hexes=[],verts=[],edges=[],vk=new Map(),ek=new Map();
  for(let r=-2;r<=2;r++)for(let q=-2;q<=2;q++){if(Math.abs(q+r)>2)continue;hexes.push({q,r,x:HR*SQ3*(q+r/2),y:HR*1.5*r,v:[],e:[],n:[]});}
  hexes.forEach((h,hi)=>{
    for(let k=0;k<6;k++){const a=(60*k-90)*Math.PI/180;const x=h.x+HR*Math.cos(a),y=h.y+HR*Math.sin(a);const key=Math.round(x)+','+Math.round(y);
      let id=vk.get(key);if(id===undefined){id=verts.length;vk.set(key,id);verts.push({x,y,h:[],e:[],adj:[]});}
      verts[id].h.push(hi);h.v.push(id);}
    for(let k=0;k<6;k++){const a=h.v[k],b=h.v[(k+1)%6];const key=Math.min(a,b)+'-'+Math.max(a,b);let id=ek.get(key);
      if(id===undefined){id=edges.length;ek.set(key,id);edges.push({a,b,h:[]});verts[a].e.push(id);verts[b].e.push(id);verts[a].adj.push(b);verts[b].adj.push(a);}
      edges[id].h.push(hi);h.e.push(id);}
  });
  edges.forEach(e=>{if(e.h.length===2){hexes[e.h[0]].n.push(e.h[1]);hexes[e.h[1]].n.push(e.h[0]);}});
  const ang=i=>{const e=edges[i];return Math.atan2((verts[e.a].y+verts[e.b].y)/2,(verts[e.a].x+verts[e.b].x)/2);};
  const coast=edges.map((_,i)=>i).filter(i=>edges[i].h.length===1).sort((i,j)=>ang(i)-ang(j));
  return {hexes,verts,edges,coast};
})();
let TOKGEO=null,SCLEAR=0;
const VIDX=G.verts.map((_,i)=>i), EIDX=G.edges.map((_,i)=>i), HIDX=G.hexes.map((_,i)=>i);

let S=null;
function log(p,t,k,ex){S.logSeq=(S.logSeq||0)+1;S.log.push({p,t,k:k||'',ex,seq:S.logSeq});if(S.log.length>150)S.log.splice(0,S.log.length-150);}

const NICK_A=['보라색','침착한','민트빛','자유로운','주황빛','졸린','용감한','수줍은','바쁜','느긋한','반짝이는','배고픈','엉뚱한','다정한','꼼꼼한','씩씩한','고요한','신난','하늘색','용감한'].filter((v,i,a)=>a.indexOf(v)===i);
const NICK_B=['감자','문어','고래','수달','펭귄','부엉이','두더지','고양이','너구리','해달','거북','다람쥐','갈매기','여우','토끼','양','곰','사슴','클로드','버섯'];
function aiNames(k){const out=[],used=new Set();while(out.length<k){const a=NICK_A[rnd(NICK_A.length)],b=NICK_B[rnd(NICK_B.length)];if(used.has(a)||used.has(b))continue;used.add(a);used.add(b);out.push(a+' '+b);}return out;}
function newGame(n,diff){n=n||4;
  const tiles=shuffle([...Array(4).fill('wood'),...Array(3).fill('brick'),...Array(4).fill('wool'),...Array(4).fill('grain'),...Array(3).fill('ore'),'desert']);
  let hexes;
  for(let t=0;t<1000;t++){
    const nums=shuffle([2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]);let k=0;
    hexes=tiles.map(res=>({res,num:res==='desert'?0:nums[k++]}));
    const hot=i=>hexes[i].num===6||hexes[i].num===8;
    if(G.hexes.every((h,i)=>!hot(i)||h.n.every(j=>!hot(j))))break;
  }
  const ptypes=shuffle(['any','any','any','any','wood','brick','wool','grain','ore']);
  const gaps=[3,3,4,3,3,4,3,3,4];let idx=rnd(30);const ports=[];
  ptypes.forEach((t,i)=>{ports.push({e:G.coast[idx%30],t});idx+=gaps[i];});
  S={board:{hexes,robber:hexes.findIndex(h=>h.res==='desert'),ports},
    players:['나',...aiNames(n-1)].map((name,i)=>({name,color:PCOL[i],ai:i!==0,res:emptyRes(),dev:[],knights:0})),
    vb:Array(G.verts.length).fill(null),eo:Array(G.edges.length).fill(-1),
    bank:{wood:19,brick:19,wool:19,grain:19,ore:19},
    deck:shuffle([...Array(14).fill('knight'),...Array(5).fill('vp'),'roads','roads','plenty','plenty','monopoly','monopoly']),
    n,diff:diff||'normal',order:[...Array(n).keys(),...[...Array(n).keys()].reverse()],phase:'setup',si:0,sub:'settlement',lastV:-1,cur:0,rolled:false,dice:null,rollId:0,devPlayed:false,
    pend:null,lr:{o:-1,len:0},la:{o:-1,n:0},rl:Array(n).fill(0),log:[],winner:-1,turn:1,acts:0};
  log(-1,'새 게임이 시작됐어요. 초기 배치부터 진행해요.','turn');
  return S;
}

function portOf(v){for(const p of S.board.ports){const e=G.edges[p.e];if(e.a===v||e.b===v)return p.t;}return null;}
function ratios(p){const b=(S.diff==='hard'&&S.players[p].ai)?3:4;const r={wood:b,brick:b,wool:b,grain:b,ore:b};
  S.vb.forEach((b,v)=>{if(b&&b.o===p){const t=portOf(v);if(t==='any')RES.forEach(k=>r[k]=Math.min(r[k],3));else if(t)r[t]=2;}});return r;}
function count(p){let s=0,c=0;S.vb.forEach(b=>{if(b&&b.o===p){b.c?c++:s++;}});let r=0;S.eo.forEach(o=>{if(o===p)r++;});return{s,c,r};}
function vp(p,real){const k=count(p);let v=k.s+2*k.c;if(S.lr.o===p)v+=2;if(S.la.o===p)v+=2;if(real)v+=S.players[p].dev.filter(d=>d.t==='vp').length;return v;}

function spotFree(v){return !S.vb[v]&&G.verts[v].adj.every(a=>!S.vb[a]);}
function canSettle(p,v,setup){if(!spotFree(v))return false;if(setup)return true;return G.verts[v].e.some(e=>S.eo[e]===p);}
function canRoad(p,e,setup){
  if(S.eo[e]!==-1)return false;const E=G.edges[e];
  if(setup)return E.a===S.lastV||E.b===S.lastV;
  return [E.a,E.b].some(v=>{const b=S.vb[v];if(b)return b.o===p;return G.verts[v].e.some(x=>x!==e&&S.eo[x]===p);});
}
function canCity(p,v){const b=S.vb[v];return !!b&&b.o===p&&!b.c;}
const settleSpots=(p,setup)=>VIDX.filter(v=>canSettle(p,v,setup));
const roadSpots=(p,setup)=>EIDX.filter(e=>canRoad(p,e,setup));
const citySpots=p=>VIDX.filter(v=>canCity(p,v));
function afford(p,c){const r=S.players[p].res;return RES.every(k=>r[k]>=(c[k]||0));}
function pay(p,c){RES.forEach(k=>{const n=c[k]||0;S.players[p].res[k]-=n;S.bank[k]+=n;});}
function canBuild(p,w){const k=count(p);
  if(w==='road')return afford(p,COST.road)&&k.r<15&&roadSpots(p).length>0;
  if(w==='settlement')return afford(p,COST.settlement)&&k.s<5&&settleSpots(p).length>0;
  if(w==='city')return afford(p,COST.city)&&k.c<4&&citySpots(p).length>0;
  if(w==='dev')return afford(p,COST.dev)&&S.deck.length>0;return false;}

function placeSettlement(p,v){
  const setup=S.phase==='setup';
  if(!setup)pay(p,COST.settlement);
  S.vb[v]={o:p,c:false};
  if(setup){S.lastV=v;
    if(S.si>=S.n){const got=emptyRes();for(const hi of G.verts[v].h){const t=S.board.hexes[hi];if(t.res!=='desert'&&S.bank[t.res]>0){S.players[p].res[t.res]++;S.bank[t.res]--;got[t.res]++;}}
      log(p,`두 번째 정착지를 놓고 ${fmt(got)} 받았어요.`,'','두 번째 정착지는 닿아 있는 땅의 자원을 1장씩 바로 받아요.');}
    else log(p,'첫 정착지를 놓았어요.');
    S.sub='road';
  } else {log(p,'정착지를 지었어요. (+1점)','','정착지는 1점이고, 닿아 있는 땅의 숫자가 나오면 자원을 1장씩 받아요.');updateLongest();}
}
function placeRoad(p,e,free){
  if(S.phase==='setup'){S.eo[e]=p;S.si++;
    if(S.si>=2*S.n){S.phase='main';S.cur=0;S.rolled=false;S.turn=1;log(-1,'초기 배치 끝! 본 게임을 시작해요.','turn');log(0,'의 차례','turn');}
    else{S.cur=S.order[S.si];S.sub='settlement';}
    return;}
  if(!free)pay(p,COST.road);S.eo[e]=p;
  if(!free)log(p,'도로를 건설했어요.');
  updateLongest();
}
function placeCity(p,v){pay(p,COST.city);S.vb[v].c=true;log(p,'정착지를 도시로 업그레이드했어요. (+1점)','','도시는 2점이고, 닿아 있는 땅에서 자원을 2장씩 받아요.');}
function buyDev(p){pay(p,COST.dev);const t=S.deck.pop();S.players[p].dev.push({t,fresh:true});
  log(p,p===0?`발전 카드를 샀어요. (${DEVN[t]})`:'발전 카드를 샀어요.','',p===0?DEVD[t]+' 산 차례에는 쓸 수 없어요.':'어떤 카드인지는 비공개예요. 다음 차례부터 쓸 수 있어요.');return t;}

function roll(p){
  const a=1+rnd(6),b=1+rnd(6),n=a+b;S.dice=[a,b];S.rolled=true;S.rollId++;
  log(p,`주사위 ${a} + ${b} = ${n}`,'',n===7?'7은 아무 땅도 생산하지 않아요. 카드가 8장 이상인 사람은 절반을 버리고, 굴린 사람이 도적을 옮겨요.':`숫자 ${n}이 적힌 땅에 건물이 닿아 있는 사람이 자원을 받아요.`);
  if(n===7){
    let human=false;
    S.players.forEach((pl,i)=>{const t=sumRes(pl.res);if(t>7){if(pl.ai)aiDiscard(i,Math.floor(t/2));else human=true;}});
    S.pend=human?{k:'discard',p:0,n:Math.floor(sumRes(S.players[0].res)/2)}:{k:'robber'};
  } else produce(n);
}
function produce(n){
  const gain=S.players.map(()=>emptyRes());
  S.board.hexes.forEach((t,hi)=>{if(t.num!==n||hi===S.board.robber)return;for(const v of G.hexes[hi].v){const b=S.vb[v];if(b)gain[b.o][t.res]+=b.c?2:1;}});
  RES.forEach(r=>{const tot=gain.reduce((s,g)=>s+g[r],0);if(!tot||tot<=S.bank[r])return;
    const recv=gain.filter(g=>g[r]>0).length;
    if(recv>1){gain.forEach(g=>g[r]=0);log(-1,`은행에 ${RN[r]}이 부족해서 아무도 받지 못했어요.`,'sys');}
    else gain.forEach(g=>{if(g[r])g[r]=S.bank[r];});});
  let any=false;
  gain.forEach((g,i)=>{if(!sumRes(g))return;any=true;RES.forEach(r=>{S.players[i].res[r]+=g[r];S.bank[r]-=g[r];});log(i,`${fmt(g)} 획득`);});
  if(!any)log(-1,'이번에는 아무도 자원을 받지 못했어요.','sys');
  if(DF()==='hard'){const bon=[];S.players.forEach((pl,i)=>{if(!pl.ai||sumRes(gain[i])>1)return;const g=aiGoal(i);const c=g?COST[g]:{};const k=argmax(RES.filter(r=>S.bank[r]>0),r=>((c[r]||0)-pl.res[r])+Math.random()*.1);if(!k)return;pl.res[k]++;S.bank[k]--;bon.push(pl.name);});if(bon.length)log(-1,`어려움 보너스: ${bon.join(', ')} 자원 1장씩`,'sys');}
}
function discard(p,obj){RES.forEach(r=>{S.players[p].res[r]-=obj[r]||0;S.bank[r]+=obj[r]||0;});log(p,`카드 ${sumRes(obj)}장을 버렸어요.`);}
function robberVictims(p,hi){return [...new Set(G.hexes[hi].v.map(v=>S.vb[v]).filter(b=>b&&b.o!==p&&sumRes(S.players[b.o].res)>0).map(b=>b.o))];}
function moveRobber(p,hi){
  S.board.robber=hi;const t=S.board.hexes[hi];
  log(p,`도적을 ${TN[t.res]}${t.num?'('+t.num+')':''}으로 옮겼어요.`,'','도적(검은 망토)이 있는 땅은 숫자가 나와도 자원이 나오지 않아요.');
  const vs=robberVictims(p,hi);
  if(!vs.length){S.pend=null;return;}
  if(vs.length===1||S.players[p].ai){steal(p,vs.length===1?vs[0]:DF()==='easy'?vs[rnd(vs.length)]:argmax(vs,q=>vp(q)+sumRes(S.players[q].res)*0.1));S.pend=null;return;}
  S.pend={k:'steal',v:vs};
}
function steal(p,q){const pool=[];RES.forEach(r=>{for(let i=0;i<S.players[q].res[r];i++)pool.push(r);});
  if(!pool.length)return;const r=pool[rnd(pool.length)];S.players[q].res[r]--;S.players[p].res[r]++;
  log(p,`${S.players[q].name}에게서 ${(p===0||q===0)?RN[r]+' ':''}카드 1장을 빼앗았어요.`,'','도적을 옮긴 사람은 그 땅에 건물이 있는 상대의 카드 1장을 무작위로 가져가요.');}

function canPlayDev(p,t){return S.phase==='main'&&S.cur===p&&!S.devPlayed&&!S.pend&&t!=='vp'&&S.players[p].dev.some(d=>d.t===t&&!d.fresh);}
function playDev(p,t){const pl=S.players[p];const i=pl.dev.findIndex(d=>d.t===t&&!d.fresh);pl.dev.splice(i,1);S.devPlayed=true;log(p,`${DEVN[t]} 카드를 사용했어요.`,'',DEVD[t]);}
function useKnight(p){playDev(p,'knight');S.players[p].knights++;updateArmy(p);S.pend={k:'robber'};}
function updateArmy(p){const n=S.players[p].knights;
  if(S.la.o===p){S.la.n=n;return;}
  if(n>=3&&n>(S.la.o===-1?0:S.la.n)){S.la={o:p,n};log(p,`최강 기사단(기사 ${n}장)을 차지했어요! (+2점)`,'','기사 카드를 3장 이상, 가장 많이 쓴 사람이 2점을 받아요.');}}
function useRoads(p){playDev(p,'roads');const left=Math.min(2,15-count(p).r);S.pend=left>0&&roadSpots(p).length?{k:'roads',left}:null;}
function freeRoad(p,e){placeRoad(p,e,true);S.pend.left--;log(p,'무료 도로를 놓았어요.');
  if(S.pend.left<=0||!roadSpots(p).length||count(p).r>=15)S.pend=null;}
function plenty(p,a,b){playDev(p,'plenty');const got=emptyRes();[a,b].forEach(r=>{if(S.bank[r]>0){S.bank[r]--;S.players[p].res[r]++;got[r]++;}});log(p,`은행에서 ${fmt(got)} 받았어요.`);}
function monopoly(p,r){playDev(p,'monopoly');let tot=0;S.players.forEach((pl,i)=>{if(i!==p){tot+=pl.res[r];pl.res[r]=0;}});S.players[p].res[r]+=tot;log(p,`${RN[r]} ${tot}장을 모두 가져왔어요.`);}

function roadLen(p){let best=0;const used=new Set();
  const dfs=(v,len)=>{if(len>best)best=len;const b=S.vb[v];if(len>0&&b&&b.o!==p)return;
    for(const e of G.verts[v].e){if(S.eo[e]!==p||used.has(e))continue;used.add(e);const E=G.edges[e];dfs(E.a===v?E.b:E.a,len+1);used.delete(e);}};
  for(const v of VIDX){if(G.verts[v].e.some(e=>S.eo[e]===p))dfs(v,0);}return best;}
function updateLongest(){
  const IDX=S.players.map((_,i)=>i);const L=IDX.map(roadLen);const h=S.lr.o;const mx=Math.max(...L);let nh;
  if(h!==-1&&L[h]>=5&&L[h]>=mx)nh=h;
  else{const top=IDX.filter(i=>L[i]===mx);nh=(mx>=5&&top.length===1)?top[0]:-1;}
  if(nh!==h){if(nh!==-1)log(nh,`최장 교역로(${L[nh]}칸)를 차지했어요! (+2점)`,'','끊기지 않고 이어진 도로가 5칸 이상이면서 가장 긴 사람이 2점을 받아요.');else log(-1,'최장 교역로 보유자가 없어졌어요.','sys');}
  S.lr={o:nh,len:nh===-1?0:L[nh]};S.rl=L;
}
function bankTrade(p,give,get){const r=ratios(p)[give];S.players[p].res[give]-=r;S.bank[give]+=r;S.players[p].res[get]++;S.bank[get]--;
  log(p,`${RN[give]} ${r}장을 ${RN[get]} 1장으로 교환했어요. (${r===4?'은행':'항구 '+r+':1'})`);}
function playerTrade(p,q,give,get){RES.forEach(r=>{const a=give[r]||0,b=get[r]||0;S.players[p].res[r]+=b-a;S.players[q].res[r]+=a-b;});
  log(p,`${S.players[q].name}와 거래: ${fmt(give)} 주고 ${fmt(get)} 받음`);}
function endTurn(){const pl=S.players[S.cur];pl.dev.forEach(d=>d.fresh=false);
  S.cur=(S.cur+1)%S.players.length;S.rolled=false;S.devPlayed=false;S.pend=null;S.acts=0;if(S.cur===0)S.turn++;
  log(S.cur,'의 차례','turn');}
function checkWin(){if(!S||S.phase!=='main')return;const p=S.cur;if(vp(p,true)>=10){S.phase='over';S.winner=p;S.pend=null;log(p,`${vp(p,true)}점 달성! 승리했어요.`,'turn');}}
function actor(){if(!S||S.phase==='over')return null;if(S.pend&&S.pend.k==='discard')return S.pend.p;return S.cur;}

// ---------- AI ----------
const DF=()=>S.diff||'normal';
function prodOf(p){const pr=emptyRes();S.vb.forEach((b,v)=>{if(b&&b.o===p)for(const hi of G.verts[v].h){const t=S.board.hexes[hi];if(t.res!=='desert')pr[t.res]+=pips(t.num)*(b.c?2:1);}});return pr;}
function spotValue(v,p,pr){pr=pr||prodOf(p);let s=0;const kinds=new Set();
  for(const hi of G.verts[v].h){const t=S.board.hexes[hi];if(t.res==='desert')continue;let w=1;if(pr[t.res]===0)w+=0.35;if(t.res==='brick'||t.res==='wood')w+=0.1;
    s+=pips(t.num)*w*(hi===S.board.robber?0.6:1);kinds.add(t.res);}
  s+=kinds.size*0.5;const pt=portOf(v);if(pt==='any')s+=1;else if(pt)s+=pr[pt]>=4?2:0.4;return s;}
function roadScore(p,e,pr){pr=pr||prodOf(p);const E=G.edges[e];let best=0;
  for(const [near,far] of [[E.a,E.b],[E.b,E.a]]){if(S.vb[far]&&S.vb[far].o!==p)continue;
    if(spotFree(far))best=Math.max(best,spotValue(far,p,pr));
    else for(const a of G.verts[far].adj){if(a!==near&&spotFree(a))best=Math.max(best,spotValue(a,p,pr)*0.7);}}
  return best;}
function missing(p,c){const r=S.players[p].res;return RES.reduce((s,k)=>s+Math.max(0,(c[k]||0)-r[k]),0);}
function aiGoal(p){const k=count(p);const c=[];
  const spots=k.s<5&&settleSpots(p).length>0;
  if(spots)c.push(['settlement',0]);
  if(k.c<4&&k.s>0)c.push(['city',0.2]);
  if(!spots&&k.r<15&&k.s<5){const pr=prodOf(p);if(roadSpots(p).some(e=>roadScore(p,e,pr)>0))c.push(['road',0.3]);}
  if(S.deck.length)c.push(['dev',1.1]);
  if(!c.length)return null;
  c.sort((a,b)=>(missing(p,COST[a[0]])+a[1])-(missing(p,COST[b[0]])+b[1]));return c[0][0];}
function robberHurts(p){const hi=S.board.robber;return pips(S.board.hexes[hi].num)>=3&&G.hexes[hi].v.some(v=>S.vb[v]&&S.vb[v].o===p);}
function aiRobberHex(p){const d=DF();return argmax(HIDX.filter(i=>i!==S.board.robber),hi=>{const t=S.board.hexes[hi];let s=t.res==='desert'?-1:0;if(d==='easy')s+=Math.random()*12;
  for(const v of G.hexes[hi].v){const b=S.vb[v];if(!b)continue;if(b.o===p)s-=12;else s+=(b.c?2:1)*pips(t.num)*(1+vp(b.o)/(d==='hard'?4:8))*(d==='easy'&&b.o===0?.15:d==='hard'&&b.o===0&&vp(0)>=Math.max(...S.players.map((_,i)=>vp(i)))?1.6:1)+(sumRes(S.players[b.o].res)?0.5:0);}
  return s+Math.random()*0.2;});}
function aiDiscard(p,k){const r=S.players[p].res;if(DF()==='easy'){const out=emptyRes();for(let i=0;i<k;i++){const pick=RES.filter(x=>r[x]-out[x]>0);out[pick[rnd(pick.length)]]++;}discard(p,out);return;}const g=aiGoal(p);const c=g?COST[g]:{};const out=emptyRes();
  for(let i=0;i<k;i++){const pick=argmax(RES.filter(x=>r[x]-out[x]>0),x=>(r[x]-out[x])-(c[x]||0)*1.5);out[pick]++;}
  discard(p,out);}
function aiStep(p){
  if(S.phase==='setup'){
    const pr=prodOf(p);
    const nz={easy:7,normal:.6,hard:.15}[DF()];if(S.sub==='settlement')placeSettlement(p,argmax(settleSpots(p,true),v=>spotValue(v,p,pr)+Math.random()*nz));
    else placeRoad(p,argmax(roadSpots(p,true),e=>roadScore(p,e,pr)+Math.random()*0.3));
    return;}
  if(S.pend){if(S.pend.k==='robber')moveRobber(p,aiRobberHex(p));else S.pend=null;return;}
  if(!S.rolled){if(canPlayDev(p,'knight')&&robberHurts(p)){useKnight(p);return;}roll(p);return;}
  S.acts++;if(S.acts>40){endTurn();return;}
  const pl=S.players[p],res=pl.res;const d=DF();
  if(d==='easy'&&S.acts===1&&Math.random()<.35){endTurn();return;}
  if(d==='hard'&&!S.devPlayed&&canPlayDev(p,'knight')&&S.board.robber!==undefined){const lead=argmax(S.players.map((_,i)=>i).filter(i=>i!==p),i=>vp(i));if(vp(lead)>=5&&vp(lead)>=vp(p)&&!G.hexes[S.board.robber].v.some(v=>S.vb[v]&&S.vb[v].o===lead)){useKnight(p);return;}}
  if(!S.devPlayed&&(d!=='easy'||Math.random()<.4)){
    if(canPlayDev(p,'knight')&&(robberHurts(p)||(pl.knights+1>=3&&S.la.o!==p&&pl.knights+1>(S.la.o===-1?0:S.la.n)))){useKnight(p);return;}
    if(canPlayDev(p,'roads')&&count(p).r<15&&roadSpots(p).length){useRoads(p);const pr=prodOf(p);
      while(S.pend&&S.pend.k==='roads')freeRoad(p,argmax(roadSpots(p),e=>roadScore(p,e,pr)));return;}
    const g0=aiGoal(p);
    if(canPlayDev(p,'plenty')&&g0&&missing(p,COST[g0])>0){const need=[];RES.forEach(k=>{let m=(COST[g0][k]||0)-res[k];while(m-->0)need.push(k);});
      while(need.length<2)need.push(argmax(RES,k=>-res[k]));plenty(p,need[0],need[1]);return;}
    if(canPlayDev(p,'monopoly')){const others=r=>S.players.reduce((s,x,i)=>s+(i===p?0:x.res[r]),0);const r=argmax(RES,others);if(others(r)>=4){monopoly(p,r);return;}}
  }
  if(canBuild(p,'city')){placeCity(p,argmax(citySpots(p),v=>G.verts[v].h.reduce((s,hi)=>s+pips(S.board.hexes[hi].num),0)+(d==='easy'?Math.random()*20:0)));return;}
  if(canBuild(p,'settlement')){const pr=prodOf(p);placeSettlement(p,argmax(settleSpots(p),v=>spotValue(v,p,pr)+(d==='easy'?Math.random()*8:0)));return;}
  const goal=aiGoal(p);
  if(canBuild(p,'road')){const pr=prodOf(p);const rs=roadSpots(p);const be=argmax(rs,e=>roadScore(p,e,pr)+(d==='easy'?Math.random()*6:0));
    if((goal==='road'&&roadScore(p,be,pr)>0)||sumRes(res)>7){placeRoad(p,be);return;}}
  if(canBuild(p,'dev')&&(goal==='dev'||sumRes(res)>7)&&(d!=='easy'||Math.random()<.5)){buyDev(p);return;}
  if(goal&&S.acts<25&&(d!=='easy'||Math.random()<.3)){const c=COST[goal],rat=ratios(p);const need=RES.filter(k=>(c[k]||0)>res[k]&&S.bank[k]>0);
    if(need.length){const give=RES.filter(k=>res[k]-(c[k]||0)>=rat[k]);
      if(give.length){bankTrade(p,argmax(give,k=>res[k]-(c[k]||0)-rat[k]),need[0]);return;}}}
  endTurn();
}
function aiAccepts(q,give,get){
  const r=S.players[q].res;
  if(!sumRes(give)&&!sumRes(get))return{ok:false,why:'빈 제안이에요'};
  const d=DF();const lack=RES.filter(k=>(get[k]||0)>r[k]);
  if(lack.length){if(d==='easy')return{ok:false,why:'그 카드가 없어요'};if(d==='normal'&&RES.filter(k=>get[k]).length===1&&Math.random()<.5)return{ok:false,why:'그건 좀 부족해요'};return{ok:false,why:d==='hard'?'거절할게요':'저한테 손해예요'};}
const lead0=S.players.every((_,i)=>i===0||vp(0)>=vp(i));
if(sumRes(get)&&d!=='easy'&&lead0&&vp(0)>=(d==='hard'?6:8))return{ok:false,why:d==='hard'?'거절할게요':'선두와는 거래 안 해요'};
  const g=aiGoal(q)||'dev';const c=COST[g];let gain=0,loss=0;
  RES.forEach(k=>{gain+=(give[k]||0)*(1+((c[k]||0)>r[k]?1.2:0));const n=get[k]||0;if(n){const after=r[k]-n;loss+=n*(1+(after<(c[k]||0)?1.5:0));}});
  const ok=(d==='easy'?gain>=loss-2.5:d==='hard'?gain>=loss+1:gain>=loss)&&sumRes(give)>0||!sumRes(get);
  return{ok,why:ok?'좋아요, 거래해요':(d==='hard'?'거절할게요':'저한테 손해예요')};
}
</script>

<script>
// ================= UI =================
const $=s=>document.querySelector(s);
const KEY='windisle-save-v1';
const ui={mode:null,speed:'보통',hints:true,tips:true,n:4,diff:'normal',gfx:'low',modal:null,shownRoll:0};
const DELAY={'느림':1100,'보통':600,'빠름':180};
try{const st=JSON.parse(localStorage.getItem('windisle-ui')||'{}');if(st.speed)ui.speed=st.speed;if(st.hints===false)ui.hints=false;if(st.tips===false)ui.tips=false;if(st.n)ui.n=st.n;if(st.diff)ui.diff=st.diff;if(st.gfx)ui.gfx=st.gfx;}catch(e){}
function saveUi(){try{localStorage.setItem('windisle-ui',JSON.stringify({speed:ui.speed,hints:ui.hints,tips:ui.tips,n:ui.n,diff:ui.diff,gfx:ui.gfx}));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return s&&s.phase&&s.phase!=='over'?s:null;}catch(e){return null;}}

let aiTimer=null;
function update(){checkWin();save();render();kick();}
function kick(){clearTimeout(aiTimer);const a=actor();if(a===null||!S.players[a].ai||ui.modal==='start')return;
  aiTimer=setTimeout(()=>{if(actor()===a){try{aiStep(a);}catch(err){console.error(err);if(S.phase==='main'&&S.cur===a&&S.rolled&&!S.pend)endTurn();}update();}},DELAY[ui.speed]);}

const icon=(k,cls)=>`<svg class="${cls||''}" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-${k}"/></svg>`;
const costPips=c=>`<span class="cost">${RES.filter(k=>c[k]).map(k=>`<span class="pip bg-${k}" title="${RN[k]}">${RN[k][0]}${c[k]>1?'×'+c[k]:''}</span>`).join('')}</span>`;
const pname=p=>`<b style="color:${S.players[p].color}">${S.players[p].name}</b>`;

function targets(){const t={v:[],e:[],h:[],kind:null};
  if(!S||S.phase==='over'||S.cur!==0||ui.modal==='start')return t;
  if(S.phase==='setup'){if(S.sub==='settlement'){t.kind='setupS';t.v=settleSpots(0,true);}else{t.kind='setupR';t.e=roadSpots(0,true);}return t;}
  if(S.pend){if(S.pend.k==='robber'){t.kind='robber';t.h=HIDX.filter(i=>i!==S.board.robber);}else if(S.pend.k==='roads'){t.kind='freeRoad';t.e=roadSpots(0);}return t;}
  if(ui.mode==='road'){t.kind='road';t.e=roadSpots(0);}
  else if(ui.mode==='settlement'){t.kind='settlement';t.v=settleSpots(0);}
  else if(ui.mode==='city'){t.kind='city';t.v=citySpots(0);}
  return t;}

const PCOL3=PCOL.map(c=>parseInt(c.slice(1),16));
// ---------- 3D board ----------
const SC=1/60;
const W={ok:false,boardKey:null,prev:null,tokens:[],mills:[],robberFrom:null,anim:new Set()};
W.robU={value:new THREE.Vector2(99,99)};
const GEO={},MATS={},TEX={};
function tone(c){const col=new THREE.Color(c);const h={};col.getHSL(h);col.setHSL(h.h,Math.min(1,h.s*.98),h.l*.96);return col;}
function M(c,extra){const k=c+'|'+(extra?JSON.stringify(extra):'');return MATS[k]||(MATS[k]=new THREE.MeshStandardMaterial(Object.assign({color:extra&&extra.emissive!==undefined?c:tone(c),flatShading:true,roughness:.94,metalness:0},extra||{})));}
// procedural noise textures
function makeNoise(seed,per){const P=new Uint8Array(512);const r=seeded(seed);const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)P[i]=p[i&255];
  const f=t=>t*t*(3-2*t);

}

 ['어떤 게임인가요?',`<p>무인도에 처음 정착한 개척자가 되어 <b>마을을 넓혀 가는 게임</b>이에요. 나와 AI 1~3명이 경쟁해요(2~4인).</p>${FLOW}<p>땅에서 나오는 자원(목재, 벽돌, 양모, 곡물, 광석)을 모아 도로, 마을, 도시를 지으면 점수가 올라가요. <b>10점</b>을 가장 먼저 모으면 이겨요.</p><p>한 판은 보통 30~60분 정도예요. 다음 장부터 하나씩 차근차근 설명할게요.</p>`],
 ['보드 읽는 법',`<p>섬은 육각형 땅 19칸으로 되어 있어요. 땅마다 나오는 자원이 정해져 있어요.</p><div class="terr">${['wood','brick','wool','grain','ore','desert'].map(k=>`<div class="bg-${k}"><b>${TN[k]}</b>${k==='desert'?'아무것도 안 나옴':RN[k]+' 생산'}</div>`).join('')}</div><p>땅 위에 떠 있는 <b>동그란 숫자판</b>이 이 게임의 핵심이에요. 곧 자세히 설명할게요. 섬 가장자리의 <b>배와 깃발 표지판</b>은 항구예요(교환 장에서 설명).</p>`],
 ['건물은 어디에 짓나요?',`${DIA_CORNER}<p>정착지와 도시는 땅 위가 아니라 땅의 <b>꼭짓점</b>(땅 2~3개가 만나는 점)에 지어요. 그래서 건물 하나가 최대 <b>3개의 땅</b>에서 자원을 받아요.</p><p>도로는 땅과 땅 사이의 <b>변</b>(선)에 놓아요.</p>`],
 ['숫자판의 뜻',`${DIA_PROD}<p>매 차례 주사위 2개를 굴려 <b>두 눈의 합</b>을 봐요. 그 합과 <b>같은 숫자가 적힌 땅</b>이 자원을 만들어요. 그 땅의 꼭짓점에 건물이 있는 사람은 모두 자원을 받아요.</p><ul class="steps"><li>정착지는 1장, 도시는 2장</li><li><b>내 차례가 아니어도</b> 받아요. 상대가 굴린 주사위로도 자원이 들어와요.</li><li>사막에는 숫자가 없어서 아무것도 안 나와요.</li></ul>`],
 ['숫자마다 나오는 빈도',`${DIA_PROB}<p>주사위 2개의 합은 숫자마다 나오는 확률이 달라요. 예를 들어 6은 (1,5)(2,4)(3,3)(4,2)(5,1) 다섯 가지 경우가 있지만, 2는 (1,1) 하나뿐이에요.</p><p>그래서 <b>7에 가까운 숫자일수록</b> 자주 나와요. 막대 위 숫자는 36번 굴렸을 때 나오는 평균 횟수예요.</p><ul class="steps"><li><b style="color:#e05a4e">6·8</b>: 가장 자주 나와서 빨간 글씨로 표시돼요(36번 중 5번).</li><li>2·12: 36번 굴리면 1번꼴로 아주 드물어요.</li><li>7이 제일 잘 나오지만 7이 적힌 땅은 없어요. 대신 도적이 움직여요.</li></ul><p><b>정리하면:</b> 집이 자주 나오는 숫자의 땅에 많이 닿을수록 자원을 많이 받아요.</p>`],
 ['도로는 왜 깔아요?',`${DIA_ROAD}<p>도로 자체는 점수가 없지만, 도로가 없으면 확장을 할 수 없어요.</p><ul class="steps"><li><b>새 정착지는 내 도로가 이어진 꼭짓점에만</b> 지을 수 있어요. 처음 두 개 이후로는 도로를 깔아 길을 내야 새 마을을 세울 수 있어요.</li><li>좋은 자리를 상대보다 먼저 차지하려고 도로를 뻗어요. 상대 도로는 내 건물을 지나갈 수 없어서 길을 막을 수도 있어요.</li><li>끊기지 않은 도로가 <b>5칸 이상이고 가장 길면</b> '최장 교역로' 보너스 <b>2점</b>을 받아요.</li></ul><p>목표 자리 없이 아무렇게나 깔면 자원 낭비예요. 지을 곳을 정하고 그쪽으로 뻗으세요.</p>`],
 ['거리 규칙',`${DIA_DIST}<p>건물 바로 옆 꼭짓점(도로 1칸 거리)에는 누구의 건물이든 새로 지을 수 없어요. <b>최소 도로 2칸</b>은 떨어져야 해요. 그래서 좋은 자리는 금방 사라져요.</p><p>게임에서 지을 수 있는 자리는 반짝이는 동그라미로 표시되니 직접 계산할 필요는 없어요.</p>`],
 ['무엇을 지을 수 있나요?',`<table class="reftable"><tbody><tr><td><b>도로</b></td><td>${costPips(COST.road)}</td><td>영역 확장, 최장 교역로</td></tr><tr><td><b>정착지</b></td><td>${costPips(COST.settlement)}</td><td><b>1점</b>, 주변 땅에서 1장씩 생산</td></tr><tr><td><b>도시</b></td><td>${costPips(COST.city)}</td><td>내 정착지를 업그레이드. <b>2점</b>, 2장씩 생산</td></tr><tr><td><b>발전 카드</b></td><td>${costPips(COST.dev)}</td><td>무작위 특수 카드 1장</td></tr></tbody></table><p style="margin-top:10px">초반에는 <b>목재·벽돌</b>(도로, 정착지)이 중요하고, 후반에는 <b>곡물·광석</b>(도시, 발전 카드)이 중요해져요. 말은 1인당 도로 15개, 정착지 5개, 도시 4개까지예요.</p>`],
 ['게임 시작: 초기 배치',`<p>주사위를 굴리기 전에 모두 <b>정착지 1개와 거기 붙은 도로 1개</b>를 두 번씩 공짜로 놓아요.</p><p>순서는 뱀 모양이에요. 4인이면 나 → 한결 → 솔 → 도담, 그리고 거꾸로 도담 → 솔 → 한결 → 나. 그래서 나는 첫 번째와 마지막에 놓아요.</p><p><b>두 번째 정착지</b>를 놓으면 닿아 있는 땅의 자원을 1장씩 바로 받고 시작해요.</p><p><b>자리 고르는 요령</b></p><ul class="steps"><li>자주 나오는 숫자(6, 8, 5, 9)에 닿는 꼭짓점</li><li>여러 종류의 자원을 고루 받는 자리</li><li>두 정착지가 서로 다른 자원을 보완하도록</li></ul><p>초기 배치 때는 금색 고리로 추천 자리를 보여 줘요.</p>`],
 ['내 차례에 하는 일',`<ol class="steps"><li><b>주사위 굴리기</b>: 모두 자원을 받아요.</li><li><b>교환</b>(선택): 필요한 자원을 바꿔요.</li><li><b>건설</b>(선택): 도로, 정착지, 도시, 발전 카드</li><li><b>턴 종료</b>: 다음 사람에게 넘겨요.</li></ol><p>교환과 건설은 순서 상관없이 자원이 있는 만큼 여러 번 할 수 있어요. 보드 위 안내 문구가 지금 할 수 있는 일을 알려 줘요.</p><p>AI 차례에는 기다리면서 오른쪽 <b>기록</b>을 보면 누가 뭘 했는지 알 수 있어요.</p>`],
 ['주사위 7과 도적',`<p>7은 가장 잘 나오는 숫자지만 7이 나오면 <b>아무도 자원을 받지 못해요.</b> 대신 이런 일이 생겨요.</p><ol class="steps"><li>카드가 <b>8장 이상</b>인 사람은 절반(내림)을 버려요. 9장이면 4장을 버려요.</li><li>굴린 사람이 <b>도적</b>을 원하는 땅으로 옮겨요. 도적은 보드 위 <b>검은 망토를 쓴 인물</b>이고 머리 위에 '도적' 표지가 떠 있어요. 처음에는 사막에 있어요.</li><li>도적이 앉은 땅은 숫자가 나와도 <b>생산이 멈춰요.</b></li><li>그 땅에 건물이 있는 상대 한 명에게서 카드 1장을 무작위로 빼앗아요.</li></ol><p><b>요령:</b> 카드를 7장 이하로 유지하고, 도적은 선두나 내가 원하는 자원을 많이 받는 상대의 좋은 땅에 보내세요.</p>`],
 ['교환하기',`<ul class="steps"><li><b>은행</b>: 같은 자원 <b>4장</b> → 원하는 자원 1장. 언제든 가능해요.</li><li><b>3:1 항구</b>: 그 항구의 두 꼭짓점 중 하나에 내 건물이 있으면 같은 자원 3장 → 1장</li><li><b>2:1 항구</b>: 표지판에 적힌 자원 2장 → 원하는 자원 1장. 그 자원이 많이 나오는 사람에게 아주 좋아요.</li><li><b>AI와 거래</b>: 교환 → AI 플레이어 탭에서 주고받을 장수를 정해 제안해요. 수락한 AI 중 한 명과 거래할 수 있어요. AI는 손해 보는 거래와 8점 이상인 선두와의 거래는 거절해요.</li></ul><p>내 현재 교환 비율은 오른쪽 '건설 비용과 은행 잔고'에서 확인할 수 있어요.</p>`],
 ['발전 카드',`<p>양모 + 곡물 + 광석으로 사요. 25장 중 무작위로 나와요.</p><ul class="steps">${[['knight',14],['vp',5],['roads',2],['plenty',2],['monopoly',2]].map(([t,n])=>`<li><b>${DEVN[t]}</b>(${n}장): ${DEVD[t]}</li>`).join('')}</ul><ul class="steps"><li>산 차례에는 쓸 수 없고 다음 차례부터 쓸 수 있어요.</li><li>한 차례에 1장만 쓸 수 있어요.</li><li>기사는 주사위 굴리기 전에도 쓸 수 있어요.</li><li>승점 카드는 쓰지 않아도 자동으로 점수에 들어가요.</li></ul>`],
 ['점수와 승리',`<table class="reftable"><tbody><tr><td>정착지</td><td>1점</td></tr><tr><td>도시</td><td>2점</td></tr><tr><td>승점 카드</td><td>1장당 1점</td></tr><tr><td>최장 교역로</td><td>2점. 끊기지 않은 도로가 5칸 이상이고 가장 긴 사람</td></tr><tr><td>최강 기사단</td><td>2점. 기사 카드를 3장 이상, 가장 많이 쓴 사람</td></tr></tbody></table><p style="margin-top:10px">보너스 2점은 다른 사람이 더 길게, 더 많이 하면 빼앗겨요. <b>내 차례에 10점</b>이 되는 순간 이겨요.</p>`],
 ['초보를 위한 다섯 가지 요령',`<ol class="steps"><li><b>숫자가 다양한 자리</b>를 잡으세요. 6만 두 군데 잡으면 6이 안 나올 때 아무것도 못 받아요.</li><li><b>초반엔 확장</b>이에요. 정착지가 늘어야 자원도 늘어요. 도로 → 정착지를 먼저 노리세요.</li><li><b>도시는 효율이 좋아요.</b> 점수 +1에 생산이 두 배가 돼요. 광석·곡물이 모이면 바로 업그레이드하세요.</li><li><b>카드는 7장 이하로.</b> 많이 쥐고 있으면 7이 나올 때 절반을 잃어요. 남는 카드는 교환이나 발전 카드로 바꾸세요.</li><li><b>부족한 자원은 항구로.</b> 많이 나오는 자원의 2:1 항구를 잡으면 사실상 모든 자원을 얻을 수 있어요.</li></ol>`],
 ['조작 방법',`<ul class="steps"><li><b>보드 돌리기</b>: 드래그하면 360도로 돌리고 기울일 수 있어요. <b>보드 옮기기</b>: 오른쪽 드래그(휴대폰은 두 손가락으로 끌기). <b>확대·축소</b>: 마우스 휠이나 두 손가락. <b>시점 초기화</b> 버튼으로 돌아와요.</li><li><b>놓을 수 있는 곳</b>은 하얗게 반짝여요. 그 위를 누르면 지어져요.</li><li><b>건설</b>: 아래 나무판의 '건설'에서 지을 것을 누르면 보드에 자리가 표시돼요. 같은 버튼을 다시 누르면 취소돼요.</li><li>숫자판이 <b>금색 테두리</b>로 빛나면 방금 주사위로 생산한 땅이에요.</li><li><b>툴팁</b>을 켜 두면 보드의 땅, 건물, 도적, 항구와 화면의 숫자에 마우스를 올리거나(휴대폰은 탭) 설명을 볼 수 있어요. 주요 사건은 보드 위에 해설이 떠요.</li><li>이 설명은 언제든 위쪽 <b>게임 방법</b> 버튼으로 다시 볼 수 있어요. 진행 상황은 자동 저장돼요.</li></ul>`],
];

function showRules(i,after){i=i||0;
  openModal('rules',`<button class="mclose" id="rx" aria-label="닫기" title="닫기"></button><div class="label">게임 방법 ${i+1} / ${PAGES.length}</div><h3>${PAGES[i][0]}</h3><div class="tut-body">${PAGES[i][1]}</div>
  <div class="row"><div class="tut-dots">${PAGES.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
  ${i>0?'<button class="btn" id="rp">이전</button>':'<button class="btn" id="rs">건너뛰기</button>'}
  ${i<PAGES.length-1?'<button class="btn primary" id="rn">다음</button>':'<button class="btn primary" id="rd">게임으로</button>'}</div>`);
  const done=()=>{closeModal();if(after)after();else update();};
  $('#rx').onclick=done;if($('#rp'))$('#rp').onclick=()=>showRules(i-1,after);if($('#rs'))$('#rs').onclick=done;
  if($('#rn'))$('#rn').onclick=()=>showRules(i+1,after);if($('#rd'))$('#rd').onclick=done;}

function onPick(pk){
  if(ui.modal&&ui.modal!=='closed-over')return;const T=targets();if(!T.kind)return;
  if(pk.v!==undefined){const v=pk.v;if(!T.v.includes(v))return;
    if(T.kind==='setupS'||T.kind==='settlement')placeSettlement(0,v);else if(T.kind==='city')placeCity(0,v);ui.mode=null;}
  else if(pk.e!==undefined){const e=pk.e;if(!T.e.includes(e))return;
    if(T.kind==='freeRoad')freeRoad(0,e);else placeRoad(0,e);ui.mode=null;}
  else if(pk.h!==undefined){if(T.kind!=='robber'||!T.h.includes(pk.h))return;moveRobber(0,pk.h);}
  else return;
  update();}

// ---------- painted cards (canvas) ----------
const CARDIMG={},CW=400,CH=610;
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function lg(x,y0,y1,stops){const g=x.createLinearGradient(0,y0,0,y1);stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));return g;}
function strokes(x,rng,n,area,cols,len,w,ang){for(let i=0;i<n;i++){const px=area[0]+rng()*area[2],py=area[1]+rng()*area[3];x.strokeStyle=cols[Math.floor(rng()*cols.length)];x.lineWidth=w*(.6+rng()*.8);const a=(ang||0)+(rng()-.5)*.6,l=len*(.5+rng());x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke();}}
function pine(x,cx,by,h,col,hi){const w=h*.42;x.fillStyle='#3b2a1a';x.fillRect(cx-h*.03,by-h*.12,h*.06,h*.12);
  for(let t=0;t<3;t++){const ty=by-h*.1-t*h*.27,tw=w*(1-t*.25);x.fillStyle=col;x.beginPath();x.moveTo(cx-tw,ty);x.lineTo(cx,ty-h*.42);x.lineTo(cx+tw,ty);x.closePath();x.fill();
    x.fillStyle=hi;x.beginPath();x.moveTo(cx-tw,ty);x.lineTo(cx,ty-h*.42);x.lineTo(cx-tw*.25,ty);x.closePath();x.fill();}}
function paintArt(x,res,rng){
  x.lineCap='round';
  if(['knight','vp','roads','plenty','monopoly'].includes(res)){
    x.fillStyle=lg(x,24,360,['#5a2a1c','#1e0d08']);x.fillRect(0,0,CW,CH);
    const g=x.createRadialGradient(150,170,10,150,170,170);g.addColorStop(0,'rgba(255,214,140,.35)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,CW,CH);
    strokes(x,rng,120,[0,0,CW,CH],['rgba(255,255,255,.04)','rgba(0,0,0,.12)'],30,6,.3);
    x.save();x.translate(150,190);x.fillStyle='#e6c06a';x.strokeStyle='#5a3c12';x.lineWidth=4;
    if(res==='knight'){x.beginPath();x.moveTo(0,-95);x.lineTo(70,-70);x.lineTo(70,-5);x.quadraticCurveTo(70,60,0,100);x.quadraticCurveTo(-70,60,-70,-5);x.lineTo(-70,-70);x.closePath();x.fill();x.stroke();
      x.fillStyle='#9b2a22';x.fillRect(-12,-75,24,150);x.fillRect(-55,-22,110,24);x.strokeStyle='#d9dce2';x.lineWidth=8;x.beginPath();x.moveTo(-90,95);x.lineTo(90,-95);x.stroke();x.fillStyle='#6b4a24';x.fillRect(-100,82,30,10);}
    if(res==='vp'){x.beginPath();x.moveTo(-80,40);x.lineTo(-90,-50);x.lineTo(-45,-10);x.lineTo(0,-75);x.lineTo(45,-10);x.lineTo(90,-50);x.lineTo(80,40);x.closePath();x.fill();x.stroke();x.fillRect(-82,48,164,22);x.strokeRect(-82,48,164,22);
      for(const [cx,cy,c] of [[0,-20,'#c0302a'],[-50,10,'#2f80ed'],[50,10,'#2f9a4a']]){x.fillStyle=c;x.beginPath();x.arc(cx,cy,10,0,7);x.fill();}}
    if(res==='roads'){x.fillStyle='#4f7a3a';x.fillRect(-110,-20,220,120);x.fillStyle='#c9b48a';x.beginPath();x.moveTo(-25,-20);x.lineTo(25,-20);x.lineTo(90,100);x.lineTo(-90,100);x.fill();
      x.strokeStyle='#8a7550';x.lineWidth=2;for(let i=0;i<6;i++){const y=-10+i*20,w=30+i*13;x.beginPath();x.moveTo(-w,y);x.lineTo(w,y);x.stroke();}x.fillStyle='#e6c06a';x.fillRect(-4,-90,8,70);x.beginPath();x.moveTo(4,-90);x.lineTo(50,-75);x.lineTo(4,-60);x.fill();}
    if(res==='plenty'){x.fillStyle='#8a5a2a';x.beginPath();x.ellipse(0,40,85,40,0,0,7);x.fill();x.stroke();
      [['#d9a52b',-40,0],['#c0302a',0,-25],['#4f8a3a',40,-5],['#e6c06a',-15,15],['#b65a35',25,20],['#8a8898',-55,25]].forEach(([c,dx,dy])=>{x.fillStyle=c;x.beginPath();x.arc(dx,dy,22,0,7);x.fill();});
      x.fillStyle='#6b4420';x.fillRect(-85,40,170,40);}
    if(res==='monopoly'){x.beginPath();x.moveTo(-70,-80);x.lineTo(-25,-80);x.lineTo(-25,10);x.arc(0,10,25,Math.PI,0,true);x.lineTo(25,-80);x.lineTo(70,-80);x.lineTo(70,10);x.arc(0,10,70,0,Math.PI);x.closePath();x.fill();x.stroke();
      x.fillStyle='#c0302a';x.fillRect(-70,-80,45,28);x.fillRect(25,-80,45,28);x.strokeStyle='#ffe9a8';x.lineWidth=3;for(const a of [-1,0,1]){x.beginPath();x.arc(0,-110,30+Math.abs(a)*12,-.4+a*.6-Math.PI/2,.4+a*.6-Math.PI/2);x.stroke();}}
    x.restore();
  }
}
function flourish(x,cx,cy,sx,sy,st){x.save();x.translate(cx,cy);x.scale(sx,sy);x.strokeStyle=st;x.fillStyle=st;x.lineWidth=1.8;x.lineCap='round';
  x.beginPath();x.moveTo(0,34);x.bezierCurveTo(0,10,10,0,34,0);x.stroke();
  x.beginPath();x.moveTo(5,22);x.bezierCurveTo(6,12,12,6,22,5);x.stroke();
  x.beginPath();x.arc(11,11,5,Math.PI*.2,Math.PI*1.75);x.stroke();x.beginPath();x.arc(11,11,1.8,0,7);x.fill();
  x.beginPath();x.moveTo(34,0);x.quadraticCurveTo(44,-1,48,5);x.quadraticCurveTo(42,4,38,8);x.stroke();
  x.beginPath();x.moveTo(0,34);x.quadraticCurveTo(-1,44,5,48);x.quadraticCurveTo(4,42,8,38);x.stroke();x.restore();}
function grain(x,rng,n,a,area){area=area||[0,0,CW,CH];for(let i=0;i<n;i++){x.fillStyle=`rgba(${rng()<.5?'40,22,8':'255,240,210'},${(rng()*a).toFixed(3)})`;x.fillRect(area[0]+rng()*area[2],area[1]+rng()*area[3],1+rng()*1.6,1+rng()*1.6);}}
const CTINT={wood:'#17502e',brick:'#7a2210',wool:'#5e8212',grain:'#7a560c',ore:'#38495a'},GOLDM={wood:[.94,1.03,.9],brick:[1.04,.94,.9],wool:[.96,1.04,.88],ore:[.9,.97,1.1]};
function paintCard(res,label,dark){
  if(!FRAMEIMG)return CARDIMG[res]||'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
  const K=CW/999,c=document.createElement('canvas');c.width=CW;c.height=CH;const x=c.getContext('2d');
  const ax=133*K-3,ay=153*K-3,aw=732*K+6,ah=918*K+6;const A=ARTIMG[res];
  if(A){const r=Math.max(aw/A.width,ah/A.height),dw=A.width*r,dh=A.height*r;x.save();x.beginPath();x.rect(ax,ay,aw,ah);x.clip();x.drawImage(A,ax+(aw-dw)/2,ay+(ah-dh)/2,dw,dh);x.restore();}
  else{x.fillStyle='#2a2018';x.fillRect(ax,ay,aw,ah);}
  const f=document.createElement('canvas');f.width=CW;f.height=CH;const fx=f.getContext('2d');fx.drawImage(FRAMEIMG,0,0,CW,CH);
  const d=fx.getImageData(0,0,CW,CH),p=d.data;const t=(CTINT[res]||'#6a1418').match(/\w\w/g).map(h=>parseInt(h,16)/255);const gm=GOLDM[res]||[1,1,1];
  for(let i=0;i<p.length;i+=4){if(!p[i+3])continue;const R=p[i]/255,G=p[i+1]/255,B=p[i+2]/255;const mx=Math.max(R,G,B),mn=Math.min(R,G,B),sat=(mx-mn)/(mx+.004),L0=(R+G+B)/3;
    const w=Math.min(1,Math.max(0,(.36-sat)/.12))*Math.min(1,Math.max(0,(.7-L0)/.12));
    if(!w){if(sat>.36){const m=L0*.14;p[i]=255*Math.min(1,(R*.86+m)*.94*gm[0]);p[i+1]=255*Math.min(1,(G*.86+m)*.94*gm[1]);p[i+2]=255*Math.min(1,(B*.86+m)*.94*gm[2]);}continue;}
    const ff=.15+L0;const V=[R,G,B];for(let k=0;k<3;k++)p[i+k]=255*(V[k]*(1-w)+Math.min(1,t[k]*ff)*w);}
  fx.putImageData(d,0,0);x.drawImage(f,0,0);
