*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{font-family:var(--body);font-size:14px}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap}
header.top h1{margin:0}
header.top .tools{margin-left:auto;display:flex;flex-wrap:wrap}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
select.btn{appearance:auto}
.game{display:grid;margin:0 auto;align-items:start}
@media (max-width:920px){.game{grid-template-columns:minmax(0,1fr)}}
.board-wrap{min-width:0;display:flex;flex-direction:column}
.coach{border:1px solid var(--line);border-radius:10px}
.side{display:flex;flex-direction:column;min-width:0}
.panel{background:linear-gradient(180deg,var(--surface-2),var(--surface) 60px);border:1px solid var(--line);border-top-color:var(--trim);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.panel h2{text-transform:uppercase}
.turnbar{display:flex;align-items:center;gap:12px}
.turnbar .who{flex:1;min-width:0}
.turnbar .who .n{font-family:var(--display);font-weight:800;line-height:1.1}
.turnbar .who .t{color:var(--muted);font-size:12px}
.dice{display:flex;gap:6px}
.die{width:38px;height:38px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5px}
.die i{width:7px;height:7px;border-radius:50%;background:var(--token-ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.roll{animation:shake .45s}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.08)}60%{transform:rotate(10deg)}100%{transform:rotate(0)}}
.art.bg-wood{background:linear-gradient(160deg,#4f8a45,#2c5a2a)}
.art.bg-brick{background:linear-gradient(160deg,#c4704a,#8a3f24)}
.art.bg-wool{background:linear-gradient(160deg,#9ccc65,#5f8c36)}
.art.bg-grain{background:linear-gradient(160deg,#e6be4f,#a8811f)}
.art.bg-ore{background:linear-gradient(160deg,#8a94a3,#4d5562)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.act.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;background:#2a3f30}

.tray{position:relative;display:grid;background-color:#5b3a20;background-size:cover}
.tray-h{display:flex;align-items:baseline;flex-wrap:wrap}
.tray-h span{font-weight:500;font-size:12.5px}
.fan{position:relative;height:var(--fh,230px);margin:4px 0 0}
.fan .cw{position:absolute;left:50%;top:22px;transform-origin:50% 120%;transition:transform .25s}
.fan .card{display:block;width:var(--cw,128px);height:auto;border-radius:calc(var(--cw,128px)*.075);box-shadow:0 1px 0 rgba(0,0,0,.3),-2px 6px 14px rgba(0,0,0,.45);transition:transform .18s;cursor:default;user-select:none;-webkit-user-drag:none}

.fan .cw:hover{z-index:99!important}
.fan .newtag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;white-space:nowrap}
.emptyhand{display:grid;place-items:center;text-align:center;padding:10px}
.tally{display:flex;flex-wrap:wrap}
.tally span{font-size:12.5px;font-variant-numeric:tabular-nums}

.bld{position:relative;display:flex;flex-direction:column;align-items:center;color:#f3dfb8}

.sum small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:-.02em}
.res{border-radius:10px;padding:6px 4px 5px;text-align:center;color:#fff;position:relative;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.res svg{width:22px;height:22px;display:block;margin:0 auto;color:rgba(255,255,255,.9)}
.res .c{font-size:20px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.res .l{font-size:11px;opacity:.9}
.bg-wood{background:var(--t-wood)}
.bg-brick{background:var(--t-brick)}
.bg-wool{background:#6e9d3a}
.bg-grain{background:#b88a17}
.bg-ore{background:#5f6a7b}
.bg-desert{background:#9d8a5a}
.dev{display:flex;align-items:center;gap:8px;background:var(--sea-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.dev .nm{font-weight:700}
.dev .ds{color:var(--muted);font-size:12px;flex:1;min-width:0}
.dev .btn{padding:4px 10px}
.empty{color:var(--muted);font-size:12.5px}
.cost{display:flex;gap:3px;flex-wrap:wrap}
.pip{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:4px;font-size:10.5px;font-weight:700;color:#fff}
.players{display:flex;flex-direction:column}
.pl{display:grid;align-items:center}
.pl .dot{border-radius:3px;grid-column:1;grid-row:1/3}
.pl .nm{grid-column:2;grid-row:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .vp{grid-column:3;grid-row:1/3;font-variant-numeric:tabular-nums}
.pl .meta{grid-column:2;grid-row:2;display:flex;flex-wrap:wrap}
.badge{font-size:10.5px;padding:0 5px}
.log{max-height:220px;overflow:auto;display:flex;flex-direction:column}
.log .turn{padding-top:4px;margin-top:2px}
.log .sys{color:var(--muted)}
details.ref summary{cursor:pointer;font-size:12.5px}
.reftable{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.reftable td{padding:4px 0}
#stage{position:relative;overflow:hidden;touch-action:none}

.toast{position:absolute;background:rgba(10,20,28,.88);border:1px solid var(--trim);border-radius:10px;line-height:1.5;z-index:3;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast .ex{font-size:12.5px;margin-top:2px}
.toast.show{animation:toastIn .25s ease-out}
#tip,#pop{position:fixed;z-index:70;max-width:300px;background:#0d1922;border:1px solid var(--trim);border-radius:9px;padding:9px 11px;font-size:12.8px;line-height:1.55;box-shadow:0 10px 28px rgba(0,0,0,.45);color:var(--ink)}
#tip{pointer-events:none}
#pop{max-width:340px}
#pop h4{margin:0 0 4px;font-family:var(--display);font-weight:800;color:var(--gold);font-size:16px}
#pop p{margin:0 0 6px}

.cnt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.cnt .btn{display:flex;flex-direction:column;align-items:flex-start;min-width:110px;flex:1;text-align:left}
.cnt small{font-weight:400;opacity:.8;font-size:11.5px}

.nogl{padding:40px 20px;text-align:center;color:var(--muted)}
@media (max-width:920px){#stage{height:min(96vw,620px);min-height:340px}}

@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}

.sheet{background:var(--surface);border:1px solid var(--line);width:min(620px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.label{font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.resp{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.resp .r{display:flex;align-items:center;gap:8px;padding:6px 10px}
.resp .r span{flex:1}
.ok{color:var(--ok)}
.no{color:var(--danger)}
.diag{display:block;width:100%;max-width:380px;height:auto;margin:2px auto 12px;color:var(--ink);font-family:var(--body)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.flow span{border:1px solid var(--trim);padding:5px 9px;font-weight:700;font-size:13px}
.flow i{color:var(--gold);font-style:normal}
.terr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}

.steps{margin:6px 0 10px;padding-left:20px;line-height:1.75}
.scores{display:flex;flex-direction:column;gap:6px;margin:10px 0}

<script id="logic">
// ================= GAME LOGIC (no DOM) =================
let ME=0; // seat index of the local player
const HR=60,SQ3=Math.sqrt(3);
const RES=['wood','brick','wool','grain','ore'];
const RN={wood:'목재',brick:'벽돌',wool:'양모',grain:'곡물',ore:'광석',desert:'사막'};
const TN={wood:'숲',brick:'언덕',wool:'목초지',grain:'밭',ore:'산',desert:'사막'};
const COST={road:{wood:1,brick:1},settlement:{wood:1,brick:1,wool:1,grain:1},city:{grain:2,ore:3},dev:{wool:1,grain:1,ore:1}};
const BN={road:'도로',settlement:'정착지',city:'도시',dev:'발전 카드'};
const DEVN={knight:'기사',roads:'도로 건설',plenty:'풍년',monopoly:'독점',vp:'승점'};
const DEVD={knight:'도적을 옮기고 상대 카드 1장을 빼앗아요.',roads:'도로 2개를 무료로 놓아요.',plenty:'은행에서 원하는 자원 2장을 받아요.',monopoly:'자원 1종을 골라 상대들이 가진 것을 전부 가져와요.',vp:'갖고만 있어도 1점. 상대에게는 보이지 않아요.'};
const PCOL=['#ff2a1a','#f5c400','#2fa548','#3a8cff','#e331c5','#efe6cf'];
const PCOL_AI=['#ff2a1a','#3a8cff','#f5c400','#2fa548','#e331c5','#efe6cf'];
const CHARS=[['otter','수달'],['owl','부엉이'],['cat','고양이'],['mole','두더지'],['raccoon','너구리'],['squirrel','다람쥐'],['seagull','갈매기'],['fox','여우'],['rabbit','토끼'],['sheep','양'],['bear','곰'],['deer','사슴'],['capybara','카피바라'],['penguin','펭귄'],['dog','강아지'],['pig','돼지'],['hedgehog','고슴도치'],['hamster','햄스터'],['redpanda','레서판다'],['panda','판다'],['alpaca','알파카'],['quokka','쿼카'],['chick','병아리'],['wolf','늑대'],['lion','사자'],['tiger','호랑이'],['mouse','쥐'],['potato','감자'],['mushroom','버섯'],['pumpkin','호박'],['claude','클로드']];
const CHN=Object.fromEntries(CHARS);
function charOf(name){if(!name)return null;let best=null;for(const [id,n] of CHARS)if((name===n||name.endsWith(' '+n))&&(!best||n.length>CHN[best].length))best=id;return best;}
function myChar(){if(!ui.char||!CHN[ui.char]){ui.char=CHARS[Math.floor(Math.random()*CHARS.length)][0];try{saveUi();}catch(e){}}return ui.char;}
function muteCol(c){if(!c||c[0]!=='#')return c;const n=parseInt(c.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;const m=(r+g+b)/3;const f=x=>Math.round((x*.75+m*.25)*.85);return `rgb(${f(r)},${f(g)},${f(b)})`;}
function pChar(p){return (p&&(p.ch||charOf(p.name)))||'otter';}
function avHTML(p,cls){return `<span class="av ${cls||''}" style="--c:${muteCol(p&&p.color)};background-image:url(assets/pt/${pChar(p)}.webp)"></span>`;}
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const emptyRes=()=>({wood:0,brick:0,wool:0,grain:0,ore:0});
const sumRes=r=>RES.reduce((s,k)=>s+(r[k]||0),0);
const pips=n=>n?6-Math.abs(7-n):0;
function argmax(arr,f){let b=arr[0],bv=-Infinity;for(const x of arr){const v=f(x);if(v>bv){bv=v;b=x;}}return b;}
const fmt=o=>RES.filter(k=>o[k]).map(k=>`${RN[k]} ${o[k]}`).join(', ')||'없음';

const G=(function(){
  const hexes=[],verts=[],edges=[],vk=new Map(),ek=new Map();
  for(let r=-2;r<=2;r++)for(let q=-2;q<=2;q++){if(Math.abs(q+r)>2)continue;hexes.push({q,r,x:HR*SQ3*(q+r/2),y:HR*1.5*r,v:[],e:[],n:[]});}
  hexes.forEach((h,hi)=>{
    for(let k=0;k<6;k++){const a=(60*k-90)*Math.PI/180;const x=h.x+HR*Math.cos(a),y=h.y+HR*Math.sin(a);const key=Math.round(x)+','+Math.round(y);
      let id=vk.get(key);if(id===undefined){id=verts.length;vk.set(key,id);verts.push({x,y,h:[],e:[],adj:[]});}
      verts[id].h.push(hi);h.v.push(id);}
    for(let k=0;k<6;k++){const a=h.v[k],b=h.v[(k+1)%6];const key=Math.min(a,b)+'-'+Math.max(a,b);let id=ek.get(key);
      if(id===undefined){id=edges.length;ek.set(key,id);edges.push({a,b,h:[]});verts[a].e.push(id);verts[b].e.push(id);verts[a].adj.push(b);verts[b].adj.push(a);}
      edges[id].h.push(hi);h.e.push(id);}
  });
  edges.forEach(e=>{if(e.h.length===2){hexes[e.h[0]].n.push(e.h[1]);hexes[e.h[1]].n.push(e.h[0]);}});
  const ang=i=>{const e=edges[i];return Math.atan2((verts[e.a].y+verts[e.b].y)/2,(verts[e.a].x+verts[e.b].x)/2);};
  const coast=edges.map((_,i)=>i).filter(i=>edges[i].h.length===1).sort((i,j)=>ang(i)-ang(j));
  return {hexes,verts,edges,coast};
})();
let TOKGEO=null,TOKBODY=null,SCLEAR=0;
const VIDX=G.verts.map((_,i)=>i), EIDX=G.edges.map((_,i)=>i), HIDX=G.hexes.map((_,i)=>i);

let S=null;
function log(p,t,k,ex){S.logSeq=(S.logSeq||0)+1;S.log.push({p,t,k:k||'',ex,seq:S.logSeq});if(S.log.length>150)S.log.splice(0,S.log.length-150);}

const NICK_A=['보라색','침착한','민트빛','자유로운','주황빛','졸린','용감한','수줍은','바쁜','느긋한','반짝이는','배고픈','엉뚱한','다정한','꼼꼼한','씩씩한','고요한','신난','하늘색','용감한'].filter((v,i,a)=>a.indexOf(v)===i);
const NICK_B=CHARS.map(c=>c[1]);
function aiNames(k,avoid){const out=[],used=new Set(avoid||[]);let guard=0;while(out.length<k&&guard++<5000){const a=NICK_A[rnd(NICK_A.length)],b=NICK_B[rnd(NICK_B.length)];if(used.has(a)||used.has(b))continue;if((a+' '+b).length>7)continue;used.add(a);used.add(b);out.push(a+' '+b);}return out;}
function newGame(n,diff,cols){n=n||4;
  const tiles=shuffle([...Array(4).fill('wood'),...Array(3).fill('brick'),...Array(4).fill('wool'),...Array(4).fill('grain'),...Array(3).fill('ore'),'desert']);
  let hexes;
  for(let t=0;t<1000;t++){
    const nums=shuffle([2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]);let k=0;
    hexes=tiles.map(res=>({res,num:res==='desert'?0:nums[k++]}));
    const hot=i=>hexes[i].num===6||hexes[i].num===8;
    if(G.hexes.every((h,i)=>!hot(i)||h.n.every(j=>!hot(j))))break;
  }
  const ptypes=shuffle(['any','any','any','any','wood','brick','wool','grain','ore']);
  const gaps=[3,3,4,3,3,4,3,3,4];let idx=rnd(30);const ports=[];
  ptypes.forEach((t,i)=>{ports.push({e:G.coast[idx%30],t});idx+=gaps[i];});
  S={board:{hexes,robber:hexes.findIndex(h=>h.res==='desert'),ports},
    players:['나',...aiNames(n-1,[CHN[myChar()]])].map((name,i)=>({name,ch:i===0?myChar():charOf(name),color:(cols||PCOL_AI)[i],ai:i!==0,res:emptyRes(),dev:[],knights:0})),
    vb:Array(G.verts.length).fill(null),eo:Array(G.edges.length).fill(-1),
    bank:{wood:19,brick:19,wool:19,grain:19,ore:19},
    deck:shuffle([...Array(14).fill('knight'),...Array(5).fill('vp'),'roads','roads','plenty','plenty','monopoly','monopoly']),
    n,diff:diff||'normal',order:[...Array(n).keys(),...[...Array(n).keys()].reverse()],phase:'setup',si:0,sub:'settlement',lastV:-1,cur:0,rolled:false,dice:null,rollId:0,devPlayed:false,
    pend:null,lr:{o:-1,len:0},la:{o:-1,n:0},rl:Array(n).fill(0),log:[],winner:-1,turn:1,acts:0};
  log(-1,'새 게임이 시작됐어요. 초기 배치부터 진행해요.','turn');
  return S;
}

function portOf(v){for(const p of S.board.ports){const e=G.edges[p.e];if(e.a===v||e.b===v)return p.t;}return null;}
function ratios(p){const b=(S.diff==='hard'&&S.players[p].ai)?3:4;const r={wood:b,brick:b,wool:b,grain:b,ore:b};
  S.vb.forEach((b,v)=>{if(b&&b.o===p){const t=portOf(v);if(t==='any')RES.forEach(k=>r[k]=Math.min(r[k],3));else if(t)r[t]=2;}});return r;}
function count(p){let s=0,c=0;S.vb.forEach(b=>{if(b&&b.o===p){b.c?c++:s++;}});let r=0;S.eo.forEach(o=>{if(o===p)r++;});return{s,c,r};}
function vp(p,real){const k=count(p);let v=k.s+2*k.c;if(S.lr.o===p)v+=2;if(S.la.o===p)v+=2;if(real)v+=S.players[p].dev.filter(d=>d.t==='vp').length;return v;}

function spotFree(v){return !S.vb[v]&&G.verts[v].adj.every(a=>!S.vb[a]);}
function canSettle(p,v,setup){if(!spotFree(v))return false;if(setup)return true;return G.verts[v].e.some(e=>S.eo[e]===p);}
function canRoad(p,e,setup){
  if(S.eo[e]!==-1)return false;const E=G.edges[e];
  if(setup)return E.a===S.lastV||E.b===S.lastV;
  return [E.a,E.b].some(v=>{const b=S.vb[v];if(b)return b.o===p;return G.verts[v].e.some(x=>x!==e&&S.eo[x]===p);});
}
function canCity(p,v){const b=S.vb[v];return !!b&&b.o===p&&!b.c;}
const settleSpots=(p,setup)=>VIDX.filter(v=>canSettle(p,v,setup));
const roadSpots=(p,setup)=>EIDX.filter(e=>canRoad(p,e,setup));
const citySpots=p=>VIDX.filter(v=>canCity(p,v));
function afford(p,c){const r=S.players[p].res;return RES.every(k=>r[k]>=(c[k]||0));}
function pay(p,c){RES.forEach(k=>{const n=c[k]||0;S.players[p].res[k]-=n;S.bank[k]+=n;});}
function canBuild(p,w){const k=count(p);
  if(w==='road')return afford(p,COST.road)&&k.r<15&&roadSpots(p).length>0;
  if(w==='settlement')return afford(p,COST.settlement)&&k.s<5&&settleSpots(p).length>0;
  if(w==='city')return afford(p,COST.city)&&k.c<4&&citySpots(p).length>0;
  if(w==='dev')return afford(p,COST.dev)&&S.deck.length>0;return false;}

function placeSettlement(p,v){
  const setup=S.phase==='setup';
  if(!setup)pay(p,COST.settlement);
  S.vb[v]={o:p,c:false};
  if(setup){S.lastV=v;
    if(S.si>=S.n){const got=emptyRes();for(const hi of G.verts[v].h){const t=S.board.hexes[hi];if(t.res!=='desert'&&S.bank[t.res]>0){S.players[p].res[t.res]++;S.bank[t.res]--;got[t.res]++;}}
      log(p,`두 번째 정착지를 놓고 ${fmt(got)} 받았어요.`,'','두 번째 정착지는 닿아 있는 땅의 자원을 1장씩 바로 받아요.');}
    else log(p,'첫 정착지를 놓았어요.');
    S.sub='road';
  } else {log(p,'정착지를 지었어요. (+1점)','','정착지는 1점이고, 닿아 있는 땅의 숫자가 나오면 자원을 1장씩 받아요.');updateLongest();}
}
function placeRoad(p,e,free){
  if(S.phase==='setup'){S.eo[e]=p;S.si++;
    if(S.si>=2*S.n){S.phase='main';S.cur=0;S.rolled=false;S.turn=1;log(-1,'초기 배치 끝! 본 게임을 시작해요.','turn');log(0,'의 차례','turn');}
    else{S.cur=S.order[S.si];S.sub='settlement';}
    return;}
  if(!free)pay(p,COST.road);S.eo[e]=p;
  if(!free)log(p,'도로를 건설했어요.');
  updateLongest();
}
function placeCity(p,v){pay(p,COST.city);S.vb[v].c=true;log(p,'정착지를 도시로 업그레이드했어요. (+1점)','','도시는 2점이고, 닿아 있는 땅에서 자원을 2장씩 받아요.');}
function buyDev(p){pay(p,COST.dev);const t=S.deck.pop();S.players[p].dev.push({t,fresh:true});if(p===ME){ui.handTab='dev';ui.devFlash=true;}
  log(p,p===0?`발전 카드를 샀어요. (${DEVN[t]})`:'발전 카드를 샀어요.','',p===0?DEVD[t]+' 산 차례에는 쓸 수 없어요.':'어떤 카드인지는 비공개예요. 다음 차례부터 쓸 수 있어요.');return t;}

function roll(p){
  const [a,b]=(typeof TUT!=='undefined'&&TUT.on)?TUT.dice(p):[1+rnd(6),1+rnd(6)],n=a+b;S.dice=[a,b];S.rolled=true;S.rollId++;
  log(p,`주사위 ${a} + ${b} = ${n}`,'',n===7?'7은 아무 땅도 생산하지 않아요. 카드가 8장 이상인 사람은 절반을 버리고, 굴린 사람이 도적을 옮겨요.':`숫자 ${n}이 적힌 땅에 건물이 닿아 있는 사람이 자원을 받아요.`);
  if(n===7){
    let human=false;
    const hq=[];S.players.forEach((pl,i)=>{const t=sumRes(pl.res);if(t>7){if(pl.ai)aiDiscard(i,Math.floor(t/2));else hq.push(i);}});
    S.pend=hq.length?{k:'discard',p:hq[0],n:Math.floor(sumRes(S.players[hq[0]].res)/2),q:hq.slice(1)}:{k:'robber'};
  } else produce(n);
}
function produce(n){
  const gain=S.players.map(()=>emptyRes());
  S.board.hexes.forEach((t,hi)=>{if(t.num!==n||hi===S.board.robber)return;for(const v of G.hexes[hi].v){const b=S.vb[v];if(b)gain[b.o][t.res]+=b.c?2:1;}});
  RES.forEach(r=>{const tot=gain.reduce((s,g)=>s+g[r],0);if(!tot||tot<=S.bank[r])return;
    const recv=gain.filter(g=>g[r]>0).length;
    if(recv>1){gain.forEach(g=>g[r]=0);log(-1,`은행에 ${RN[r]}이 부족해서 아무도 받지 못했어요.`,'sys');}
    else gain.forEach(g=>{if(g[r])g[r]=S.bank[r];});});
  let any=false;
  gain.forEach((g,i)=>{if(!sumRes(g))return;any=true;RES.forEach(r=>{S.players[i].res[r]+=g[r];S.bank[r]-=g[r];});log(i,`${fmt(g)} 획득`);});
  if(!any)log(-1,'이번에는 아무도 자원을 받지 못했어요.','sys');
  if(DF()==='hard'){const bon=[];S.players.forEach((pl,i)=>{if(!pl.ai||sumRes(gain[i])>1)return;const g=aiGoal(i);const c=g?COST[g]:{};const k=argmax(RES.filter(r=>S.bank[r]>0),r=>((c[r]||0)-pl.res[r])+Math.random()*.1);if(!k)return;pl.res[k]++;S.bank[k]--;bon.push(pl.name);});if(bon.length)log(-1,`어려움 보너스: ${bon.join(', ')} 자원 1장씩`,'sys');}
}
function takeOverSeat(p){const pl=S.players[p];if(!pl||pl.ai)return;pl.ai=true;pl.left=true;log(p,'이(가) 나가서 AI가 이어서 플레이해요.','sys');}
function nextDiscard(){const q=(S.pend&&S.pend.q)||[];if(q.length){const p=q[0];S.pend={k:'discard',p,n:Math.floor(sumRes(S.players[p].res)/2),q:q.slice(1)};}else S.pend={k:'robber'};}
function discard(p,obj){RES.forEach(r=>{S.players[p].res[r]-=obj[r]||0;S.bank[r]+=obj[r]||0;});log(p,`카드 ${sumRes(obj)}장을 버렸어요.`);}
function robberVictims(p,hi){return [...new Set(G.hexes[hi].v.map(v=>S.vb[v]).filter(b=>b&&b.o!==p&&sumRes(S.players[b.o].res)>0).map(b=>b.o))];}
function moveRobber(p,hi){
  S.board.robber=hi;const t=S.board.hexes[hi];
  log(p,`도적을 ${TN[t.res]}${t.num?'('+t.num+')':''}으로 옮겼어요.`,'','도적(검은 망토)이 있는 땅은 숫자가 나와도 자원이 나오지 않아요.');
  const vs=robberVictims(p,hi);
  if(!vs.length){S.pend=null;return;}
  if(vs.length===1||S.players[p].ai){steal(p,vs.length===1?vs[0]:DF()==='easy'?vs[rnd(vs.length)]:argmax(vs,q=>vp(q)+sumRes(S.players[q].res)*0.1));S.pend=null;return;}
  S.pend={k:'steal',v:vs};
}
function steal(p,q){const pool=[];RES.forEach(r=>{for(let i=0;i<S.players[q].res[r];i++)pool.push(r);});
  if(!pool.length)return;const r=pool[rnd(pool.length)];S.players[q].res[r]--;S.players[p].res[r]++;
  S.lastSteal={p,q,r,k:S.turn+':'+S.cur};
  log(p,`${S.players[q].name}에게서 카드 1장을 빼앗았어요.`,'','도적을 옮긴 사람은 그 땅에 건물이 있는 상대의 카드 1장을 무작위로 가져가요.');}

function canPlayDev(p,t){return S.phase==='main'&&S.cur===p&&!S.devPlayed&&!S.pend&&t!=='vp'&&S.players[p].dev.some(d=>d.t===t&&!d.fresh);}
function playDev(p,t){const pl=S.players[p];const i=pl.dev.findIndex(d=>d.t===t&&!d.fresh);pl.dev.splice(i,1);S.devPlayed=true;S.lastDev={p,t,id:(S.lastDev?S.lastDev.id:0)+1};log(p,`${DEVN[t]} 카드를 사용했어요.`,'',DEVD[t]);}
function useKnight(p){playDev(p,'knight');S.players[p].knights++;updateArmy(p);S.pend={k:'robber'};}
function updateArmy(p){const n=S.players[p].knights;
  if(S.la.o===p){S.la.n=n;return;}
  if(n>=3&&n>(S.la.o===-1?0:S.la.n)){S.la={o:p,n};log(p,`최강 기사단(기사 ${n}장)을 차지했어요! (+2점)`,'','기사 카드를 3장 이상, 가장 많이 쓴 사람이 2점을 받아요.');}}
function useRoads(p){playDev(p,'roads');const left=Math.min(2,15-count(p).r);S.pend=left>0&&roadSpots(p).length?{k:'roads',left}:null;}
function freeRoad(p,e){placeRoad(p,e,true);S.pend.left--;log(p,'무료 도로를 놓았어요.');
  if(S.pend.left<=0||!roadSpots(p).length||count(p).r>=15)S.pend=null;}
function plenty(p,a,b){playDev(p,'plenty');const got=emptyRes();[a,b].forEach(r=>{if(S.bank[r]>0){S.bank[r]--;S.players[p].res[r]++;got[r]++;}});log(p,`은행에서 ${fmt(got)} 받았어요.`);}
function monopoly(p,r){playDev(p,'monopoly');let tot=0;S.players.forEach((pl,i)=>{if(i!==p){tot+=pl.res[r];pl.res[r]=0;}});S.players[p].res[r]+=tot;log(p,`${RN[r]} ${tot}장을 모두 가져왔어요.`);}

function roadLen(p){let best=0;const used=new Set();
  const dfs=(v,len)=>{if(len>best)best=len;const b=S.vb[v];if(len>0&&b&&b.o!==p)return;
    for(const e of G.verts[v].e){if(S.eo[e]!==p||used.has(e))continue;used.add(e);const E=G.edges[e];dfs(E.a===v?E.b:E.a,len+1);used.delete(e);}};
  for(const v of VIDX){if(G.verts[v].e.some(e=>S.eo[e]===p))dfs(v,0);}return best;}
function updateLongest(){
  const IDX=S.players.map((_,i)=>i);const L=IDX.map(roadLen);const h=S.lr.o;const mx=Math.max(...L);let nh;
  if(h!==-1&&L[h]>=5&&L[h]>=mx)nh=h;
  else{const top=IDX.filter(i=>L[i]===mx);nh=(mx>=5&&top.length===1)?top[0]:-1;}
  if(nh!==h){if(nh!==-1)log(nh,`최장 교역로(${L[nh]}칸)를 차지했어요! (+2점)`,'','끊기지 않고 이어진 도로가 5칸 이상이면서 가장 긴 사람이 2점을 받아요.');else log(-1,'최장 교역로 보유자가 없어졌어요.','sys');}
  S.lr={o:nh,len:nh===-1?0:L[nh]};S.rl=L;
}
function bankTrade(p,give,get){const r=ratios(p)[give];S.players[p].res[give]-=r;S.bank[give]+=r;S.players[p].res[get]++;S.bank[get]--;
  log(p,`${RN[give]} ${r}장을 ${RN[get]} 1장으로 교환했어요. (${r===4?'은행':'항구 '+r+':1'})`);}
function playerTrade(p,q,give,get){if(typeof TUT!=='undefined')TUT.traded=true;RES.forEach(r=>{const a=give[r]||0,b=get[r]||0;S.players[p].res[r]+=b-a;S.players[q].res[r]+=a-b;});
  log(p,`${S.players[q].name}와 거래: ${fmt(give)} 주고 ${fmt(get)} 받음`);}
function endTurn(){S.offer=null;const pl=S.players[S.cur];pl.dev.forEach(d=>d.fresh=false);
  S.cur=(S.cur+1)%S.players.length;S.rolled=false;S.devPlayed=false;S.pend=null;S.acts=0;if(S.cur===0)S.turn++;
  log(S.cur,'의 차례','turn');}
function checkWin(){if(!S||S.phase!=='main')return;const p=S.cur;if(vp(p,true)>=10){S.phase='over';S.winner=p;S.pend=null;log(p,`${vp(p,true)}점 달성! 승리했어요.`,'turn');}}
function actor(){if(!S||S.phase==='over')return null;if(S.pend&&S.pend.k==='discard')return S.pend.p;return S.cur;}


// ---------- multiplayer rules: offers, deadlines ----------
const TL={turn:90000,setup:60000,discard:60000,robber:45000,offer:30000};
function proposeOffer(from,give,get){const to={};S.players.forEach((pl,q)=>{if(q===from)return;
    if(pl.ai){const r=aiAccepts(q,give,get,from);to[q]={s:r.ok?'yes':'no',why:r.why};}
    else{const lack=RES.some(k=>(get[k]||0)>pl.res[k]);to[q]={s:'wait',why:'답변을 기다리는 중'};}});
  S.offer={id:(S.offer?S.offer.id:0)+1,from,give:{...give},get:{...get},to,t:Date.now()+TL.offer};}
function respondOffer(q,yes){const o=S.offer;if(!o||!o.to[q]||o.to[q].s!=='wait')return;
  const lack=RES.some(k=>(o.get[k]||0)>S.players[q].res[k]);
  o.to[q]=yes&&!lack?{s:'yes',why:'좋아요, 거래해요'}:{s:'no',why:yes?'카드가 부족해요':'거절했어요'};}
function acceptOffer(from,q){const o=S.offer;if(!o||o.from!==from||!o.to[q]||o.to[q].s!=='yes')return false;
  const okA=RES.every(k=>(o.give[k]||0)<=S.players[from].res[k]),okB=RES.every(k=>(o.get[k]||0)<=S.players[q].res[k]);
  if(!okA||!okB){o.to[q]={s:'no',why:'카드가 부족해요'};return false;}
  playerTrade(from,q,o.give,o.get);S.offer=null;return true;}
function cancelOffer(){S.offer=null;}
function randomDiscard(p,n){const r=S.players[p].res,out=emptyRes();for(let i=0;i<n;i++){const pick=RES.filter(x=>r[x]-out[x]>0);if(!pick.length)break;out[pick[rnd(pick.length)]]++;}discard(p,out);}
function dlKey(){const a=actor();if(a===null)return '';return [S.phase,S.turn,S.si,S.cur,a,S.pend?S.pend.k+':'+(S.pend.p===undefined?'':S.pend.p):''].join('|');}
function dlLimit(){if(S.pend&&S.pend.k==='discard')return TL.discard;if(S.pend&&(S.pend.k==='robber'||S.pend.k==='steal'))return TL.robber;return S.phase==='setup'?TL.setup:TL.turn;}
function timeoutAct(p){
  if(S.pend&&S.pend.k==='discard'&&S.pend.p===p){log(p,'시간 초과로 카드를 무작위로 버렸어요.','sys');randomDiscard(p,S.pend.n);nextDiscard();return;}
  log(p,'시간 초과! 자동으로 진행했어요.','sys');
  if(S.phase==='setup'){aiStep(p);return;}
  let g=0;while(S.phase==='main'&&S.cur===p&&g++<12){
    if(S.pend){if(S.pend.k==='discard')return;if(S.pend.k==='steal'){steal(p,S.pend.v[rnd(S.pend.v.length)]);S.pend=null;}else if(S.pend.k==='robber')moveRobber(p,aiRobberHex(p));else S.pend=null;continue;}
    if(!S.rolled){roll(p);continue;}
    S.offer=null;endTurn();}}
// host clock: returns true if state changed
function mpTick(now){if(!S||!S.mp||S.phase==='over')return false;let ch=false;
  if(S.offer&&now>S.offer.t){Object.keys(S.offer.to).forEach(q=>{if(S.offer.to[q].s==='wait')S.offer.to[q]={s:'no',why:'시간 초과'};});}
  const k=dlKey();if(k!==S.dlKey){S.dlKey=k;S.deadline=now+dlLimit();ch=true;}
  else if(S.deadline&&now>S.deadline){const a=actor();if(a!==null&&!S.players[a].ai){timeoutAct(a);S.dlKey=null;ch=true;}}
  return ch;}

// ---------- AI ----------
const DF=()=>S.diff||'normal';
// AI personalities, fixed per character: exp=expander (roads/settlements), dev=builder (cities),
// trd=merchant (trades, ports), kn=bully (knights, robber on the leader), bal=balanced
const CHPERS={};[['exp','rabbit squirrel deer sheep alpaca chick quokka mouse'],['dev','mole bear panda capybara hedgehog potato pumpkin mushroom'],['trd','fox raccoon cat otter hamster redpanda pig dog'],['kn','wolf lion tiger owl seagull penguin']].forEach(([k,l])=>l.split(' ').forEach(c=>CHPERS[c]=k));
const PERS={bal:{s:0,c:0,r:0,d:0,res:{},port:1,tr:0},
  exp:{s:-.25,c:-.05,r:0,d:0,res:{wood:.05,brick:.05},port:1,tr:0},
  dev:{s:.05,c:-.25,r:.3,d:.1,res:{ore:.3,grain:.25},port:1,tr:0},
  trd:{s:0,c:-.05,r:0,d:.1,res:{},port:1.8,tr:1.2},
  kn:{s:.1,c:.1,r:.2,d:-.12,res:{ore:.15,grain:.1,wool:.15},port:1,tr:-.5}};
const persOf=p=>{const pl=S&&S.players[p];return pl&&pl.ai?(pl.pers||CHPERS[pl.ch]||'bal'):'bal';};
const PB=p=>PERS[persOf(p)]||PERS.bal;

function prodOf(p){const pr=emptyRes();S.vb.forEach((b,v)=>{if(b&&b.o===p)for(const hi of G.verts[v].h){const t=S.board.hexes[hi];if(t.res!=='desert')pr[t.res]+=pips(t.num)*(b.c?2:1);}});return pr;}
function spotValue(v,p,pr){pr=pr||prodOf(p);let s=0;const kinds=new Set();
  const B=PB(p);for(const hi of G.verts[v].h){const t=S.board.hexes[hi];if(t.res==='desert')continue;let w=1+(B.res[t.res]||0);if(pr[t.res]===0)w+=0.35;if(t.res==='brick'||t.res==='wood')w+=0.1;
    s+=pips(t.num)*w*(hi===S.board.robber?0.6:1);kinds.add(t.res);}
  s+=kinds.size*0.5;const pt=portOf(v);if(pt==='any')s+=1*B.port;else if(pt)s+=(pr[pt]>=4?2:0.4)*B.port;return s;}
function roadScore(p,e,pr){pr=pr||prodOf(p);const E=G.edges[e];let best=0;
  for(const [near,far] of [[E.a,E.b],[E.b,E.a]]){if(S.vb[far]&&S.vb[far].o!==p)continue;
    if(spotFree(far))best=Math.max(best,spotValue(far,p,pr));
    else for(const a of G.verts[far].adj){if(a!==near&&spotFree(a))best=Math.max(best,spotValue(a,p,pr)*0.7);}}
  return best;}
function missing(p,c){const r=S.players[p].res;return RES.reduce((s,k)=>s+Math.max(0,(c[k]||0)-r[k]),0);}
function aiGoal(p){const k=count(p);const c=[];const B=PB(p);
  const spots=k.s<5&&settleSpots(p).length>0;
  if(spots)c.push(['settlement',0+B.s]);
  if(k.c<4&&k.s>0)c.push(['city',0.2+B.c]);
  if(!spots&&k.r<15&&k.s<5){const pr=prodOf(p);if(roadSpots(p).some(e=>roadScore(p,e,pr)>0))c.push(['road',0.3+B.r]);}
  if(S.deck.length)c.push(['dev',1.1+B.d]);
  if(!c.length)return null;
  c.sort((a,b)=>(missing(p,COST[a[0]])+a[1])-(missing(p,COST[b[0]])+b[1]));return c[0][0];}
function robberHurts(p){const hi=S.board.robber;return pips(S.board.hexes[hi].num)>=3&&G.hexes[hi].v.some(v=>S.vb[v]&&S.vb[v].o===p);}
function aiRobberHex(p){const d=DF();return argmax(HIDX.filter(i=>i!==S.board.robber),hi=>{const t=S.board.hexes[hi];let s=t.res==='desert'?-1:0;if(d==='easy')s+=Math.random()*12;
  for(const v of G.hexes[hi].v){const b=S.vb[v];if(!b)continue;if(b.o===p)s-=12;else s+=(b.c?2:1)*pips(t.num)*(1+vp(b.o)/(d==='hard'?4:8))*(d==='easy'&&!S.players[b.o].ai?.15:d==='hard'&&!S.players[b.o].ai&&vp(b.o)>=Math.max(...S.players.map((_,i)=>vp(i)))?1.6:1)*(persOf(p)==='kn'&&vp(b.o)>=Math.max(...S.players.map((_,i)=>vp(i)))?1.5:1)+(sumRes(S.players[b.o].res)?0.5:0);}
  return s+Math.random()*0.2;});}
function aiDiscard(p,k){const r=S.players[p].res;if(DF()==='easy'){const out=emptyRes();for(let i=0;i<k;i++){const pick=RES.filter(x=>r[x]-out[x]>0);out[pick[rnd(pick.length)]]++;}discard(p,out);return;}const g=aiGoal(p);const c=g?COST[g]:{};const out=emptyRes();
  for(let i=0;i<k;i++){const pick=argmax(RES.filter(x=>r[x]-out[x]>0),x=>(r[x]-out[x])-(c[x]||0)*1.5);out[pick]++;}
  discard(p,out);}
function aiStep(p){
  if(typeof TUT!=='undefined'&&TUT.on){if(S.phase==='setup'){TUT.aiPlace(p);return;}if(S.pend){if(S.pend.k==='discard'&&S.pend.p===p){aiDiscard(p,S.pend.n);nextDiscard();}else S.pend=null;return;}if(!S.rolled){roll(p);return;}endTurn();return;}
  if(S.phase==='setup'){
    const pr=prodOf(p);
    const nz={easy:7,normal:.6,hard:.15}[DF()];if(S.sub==='settlement')placeSettlement(p,argmax(settleSpots(p,true),v=>spotValue(v,p,pr)+Math.random()*nz));
    else placeRoad(p,argmax(roadSpots(p,true),e=>roadScore(p,e,pr)+Math.random()*0.3));
    return;}
  if(S.pend){if(S.pend.k==='discard'&&S.pend.p===p){aiDiscard(p,S.pend.n);nextDiscard();}else if(S.pend.k==='robber')moveRobber(p,aiRobberHex(p));else S.pend=null;return;}
  if(!S.rolled){if(canPlayDev(p,'knight')&&robberHurts(p)){useKnight(p);return;}roll(p);return;}
  S.acts++;if(S.acts>40){endTurn();return;}
  const pl=S.players[p],res=pl.res;const d=DF();
  if(d==='easy'&&S.acts===1&&Math.random()<.35){endTurn();return;}
  if((d==='hard'||(persOf(p)==='kn'&&Math.random()<.5))&&!S.devPlayed&&canPlayDev(p,'knight')&&S.board.robber!==undefined){const lead=argmax(S.players.map((_,i)=>i).filter(i=>i!==p),i=>vp(i));if(vp(lead)>=5&&vp(lead)>=vp(p)&&!G.hexes[S.board.robber].v.some(v=>S.vb[v]&&S.vb[v].o===lead)){useKnight(p);return;}}
  if(!S.devPlayed&&(d!=='easy'||Math.random()<.4)){
    if(canPlayDev(p,'knight')&&(robberHurts(p)||(pl.knights+1>=3&&S.la.o!==p&&pl.knights+1>(S.la.o===-1?0:S.la.n)))){useKnight(p);return;}
    if(canPlayDev(p,'roads')&&count(p).r<15&&roadSpots(p).length){useRoads(p);const pr=prodOf(p);
      while(S.pend&&S.pend.k==='roads')freeRoad(p,argmax(roadSpots(p),e=>roadScore(p,e,pr)));return;}
    const g0=aiGoal(p);
    if(canPlayDev(p,'plenty')&&g0&&missing(p,COST[g0])>0){const need=[];RES.forEach(k=>{let m=(COST[g0][k]||0)-res[k];while(m-->0)need.push(k);});
      while(need.length<2)need.push(argmax(RES,k=>-res[k]));plenty(p,need[0],need[1]);return;}
    if(canPlayDev(p,'monopoly')){const others=r=>S.players.reduce((s,x,i)=>s+(i===p?0:x.res[r]),0);const r=argmax(RES,others);if(others(r)>=4){monopoly(p,r);return;}}
  }
  if(canBuild(p,'city')){placeCity(p,argmax(citySpots(p),v=>G.verts[v].h.reduce((s,hi)=>s+pips(S.board.hexes[hi].num),0)+(d==='easy'?Math.random()*20:0)));return;}
  if(canBuild(p,'settlement')){const pr=prodOf(p);placeSettlement(p,argmax(settleSpots(p),v=>spotValue(v,p,pr)+(d==='easy'?Math.random()*8:0)));return;}
  const goal=aiGoal(p);
  if(canBuild(p,'road')){const pr=prodOf(p);const rs=roadSpots(p);const be=argmax(rs,e=>roadScore(p,e,pr)+(d==='easy'?Math.random()*6:0));
    if((goal==='road'&&roadScore(p,be,pr)>0)||sumRes(res)>7){placeRoad(p,be);return;}}
  if(canBuild(p,'dev')&&(goal==='dev'||sumRes(res)>7)&&(d!=='easy'||Math.random()<.5)){buyDev(p);return;}
  if(goal&&S.acts<25&&(d!=='easy'||Math.random()<.3)){const c=COST[goal],rat=ratios(p);const need=RES.filter(k=>(c[k]||0)>res[k]&&S.bank[k]>0);
    if(need.length){const give=RES.filter(k=>res[k]-(c[k]||0)>=rat[k]);
      if(give.length){bankTrade(p,argmax(give,k=>res[k]-(c[k]||0)-rat[k]),need[0]);return;}}}
  endTurn();
}
function aiAccepts(q,give,get,from){if(typeof TUT!=='undefined'&&TUT.on){const lack=RES.some(k=>(get[k]||0)>S.players[q].res[k]);return sumRes(give)>0&&!lack?{ok:true,why:'좋아요, 거래해요'}:{ok:false,why:lack?'그 카드가 없어요':'빈 제안이에요'};}from=from===undefined?ME:from;
  const r=S.players[q].res;
  if(!sumRes(give)&&!sumRes(get))return{ok:false,why:'빈 제안이에요'};
  const d=DF();const lack=RES.filter(k=>(get[k]||0)>r[k]);
  if(lack.length){if(d==='easy')return{ok:false,why:'그 카드가 없어요'};if(d==='normal'&&RES.filter(k=>get[k]).length===1&&Math.random()<.5)return{ok:false,why:'그건 좀 부족해요'};return{ok:false,why:d==='hard'?'거절할게요':'저한테 손해예요'};}
const lead0=S.players.every((_,i)=>i===from||vp(from)>=vp(i));
if(sumRes(get)&&d!=='easy'&&lead0&&vp(from)>=(d==='hard'?6:8))return{ok:false,why:d==='hard'?'거절할게요':'선두와는 거래 안 해요'};
  const g=aiGoal(q)||'dev';const c=COST[g];let gain=0,loss=0;

function sheetReady(){const sh=$('#sheet');if(!sh)return;sh.classList.remove('fin');sh.classList.add('fwait');
  const urls=new Set();const grab=el=>{if(!el)return;const cs=getComputedStyle(el);[cs.backgroundImage,cs.borderImageSource].forEach(v=>{(v||'').replace(/url\(["']?([^"')]+)["']?\)/g,(m,u)=>{urls.add(u);});});};
  grab(sh);sh.querySelectorAll('.rbook,.fhead,.ffoot,.btn,.mclose,img').forEach(el=>{grab(el);if(el.tagName==='IMG'&&el.src)urls.add(el.src);});
  const load=u=>new Promise(r=>{const im=new Image();im.onload=im.onerror=()=>r();im.src=u;if(im.complete)r();});
  let done=false;const go=()=>{if(done)return;done=true;sh.classList.remove('fwait');void sh.offsetWidth;sh.classList.add('fin');clearTimeout(ui.finT);ui.finT=setTimeout(()=>sh.classList.remove('fin'),1300);};
  Promise.all([...urls].slice(0,40).map(load)).then(go);setTimeout(go,1800);}

  const body=`<div class="plcards" id="pl">${RES.map(k=>`<div class="plg">${[0,1].map(j=>{const id=k+j,on=picks.includes(id),dis=!on&&(n>=2||cnt(k)>=S.bank[k]);return `<button class="plc${on?' on':''}" data-id="${id}" ${dis?'disabled':''} aria-label="${RN[k]}"><img src="${CARDIMG[k]}" alt="${RN[k]}"></button>`;}).join('')}</div>`).join('')}</div>`;
  cardDlg('plenty',`<h3>풍년</h3><p>은행에서 원하는 자원 2장을 고르세요. 같은 자원 2장도 돼요.</p><div class="plwrap">${body}</div><div class="row"><button class="btn" id="px">취소</button><button class="btn primary" id="pk" ${n===2?'':'disabled'}>받기</button></div>`);
  $('#px').onclick=closeModal;
  $('#pl').onclick=e=>{const t=e.target.closest('button');if(!t||t.disabled)return;const id=t.dataset.id,ix=picks.indexOf(id);if(ix>=0)picks.splice(ix,1);else if(picks.length<2)picks.push(id);draw();};
  $('#pk').onclick=()=>{const l=picks.map(id=>id.slice(0,-1));closeModal();act('plenty',l[0],l[1]);};};draw();}
function showMonopoly(){cardDlg('mono',`<h3>독점</h3><p>자원 하나를 고르면 상대 ${S.players.length-1}명이 가진 그 자원을 전부 가져와요.<br>상대 손패는 보이지 않으니 기록을 보고 추측해 보세요.</p>
  <div class="plwrap"><div class="plcards mono" id="mp">${RES.map(k=>`<div class="plg"><button class="plc" data-k="${k}" aria-label="${RN[k]}"><img src="${CARDIMG[k]}" alt="${RN[k]}"></button></div>`).join('')}</div></div><div class="row"><button class="btn" id="mx">취소</button><button class="btn primary" id="mk" disabled>확인</button></div>`);
  let pick=null;$('#mx').onclick=closeModal;$('#mp').onclick=e=>{const t=e.target.closest('button');if(!t)return;pick=pick===t.dataset.k?null:t.dataset.k;$('#mp').querySelectorAll('.plc').forEach(b=>b.classList.toggle('on',b.dataset.k===pick));$('#mk').disabled=!pick;};
  $('#mk').onclick=()=>{if(!pick)return;closeModal();act('mono',pick);};}
function showDiscard(n){n=n||S.pend.n;const me=S.players[ME];const cards=RES.flatMap(r=>Array(me.res[r]).fill(r));const sel=new Set();
  const draw=()=>{const k=sel.size,full=k>=n;
    cardDlg('discard',`<h3>카드 ${n}장 버리기</h3>${S.mp?'<p class="muted">남은 시간 <i data-cd="dl"></i> · 시간이 지나면 무작위로 버려져요</p>':''}<p>주사위 7이 나왔고 내 카드가 8장 이상이라 절반을 은행에 버려야 해요.<br>아래 카드 중 버릴 카드를 누르세요.</p>
    <div class="plwrap"><div class="plcards dcards" id="dc" style="--m:${cards.length}">${cards.map((r,i)=>{const on=sel.has(i);return `<button class="plc${on?' on':''}" data-i="${i}" ${!on&&full?'disabled':''} aria-label="${RN[r]}"><img src="${CARDIMG[r]}" alt="${RN[r]}"></button>`;}).join('')}</div></div>
    <div class="row"><button class="btn primary" id="dOk" ${full?'':'disabled'}>버리기</button></div>`);
    $('#dc').onclick=e=>{const t=e.target.closest('button');if(!t||t.disabled)return;const i=+t.dataset.i;if(sel.has(i))sel.delete(i);else if(sel.size<n)sel.add(i);draw();};
    $('#dOk').onclick=()=>{const o=emptyRes();sel.forEach(i=>o[cards[i]]++);closeModal();act('discard',o);};};
  draw();}

const DG={wood:'#3a7232',brick:'#a65a36',wool:'#76a845',grain:'#c49b36',ore:'#73777f',desert:'#c8ad78'};
function dHex(cx,cy,r,res,num,label){const pts=[0,1,2,3,4,5].map(k=>{const a=(60*k-90)*Math.PI/180;return (cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1);}).join(' ');
  let s=`<polygon points="${pts}" fill="${DG[res]}" stroke="#2a2016" stroke-width="3"/>`;
  if(label)s+=`<text x="${cx}" y="${cy-r*.42}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" style="paint-order:stroke" stroke="rgba(0,0,0,.45)" stroke-width="3">${label}</text>`;
  if(num){const hot=num===6||num===8,p=pips(num);s+=`<circle cx="${cx}" cy="${cy+4}" r="15" fill="#f4e7c6" stroke="#6b4f2a" stroke-width="2"/><text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="14" font-weight="700" fill="${hot?'#c0302a':'#2a2118'}">${num}</text>`;
}
  return s;}
const dHouse=(x,y,c)=>`<path d="M${x-9} ${y+7}V${y-2}l9-8 9 8v9z" fill="${c||'#ef5350'}" stroke="#13171a" stroke-width="2"/>`;
const dRoad=(x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#13171a" stroke-width="10" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c||'#ef5350'}" stroke-width="6" stroke-linecap="round"/>`;
const dSvg=(w,h,inner)=>`<svg class="diag" viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`;
// three hexes around one corner at (cx,cy)
function trio(cx,cy,r,a,b,c){const w=r*1.732;return dHex(cx-w/2,cy-r/2,r,a[0],a[1],a[2])+dHex(cx+w/2,cy-r/2,r,b[0],b[1],b[2])+dHex(cx,cy+r,r,c[0],c[1],c[2]);}

  pubSync(){if(!NET.isHost||!NET.meta)return;const M=NET.meta,cnt=Object.keys(NET.members).length,ai=M.pub?0:(M.ai||0),used=cnt+ai;const r=this.db.ref('open/'+NET.room);

  drawLobby(){if(!NET.meta||NET.meta.status!=='lobby')return;const M=NET.meta,host=M.host===NET.uid,ord=this.order(),n=M.n;const mine=NET.members[NET.uid]||{};

  start(){hideTitle();const ord=this.order(),n=NET.meta.n;newGame(n,NET.meta.diff);

  // ---------- presence / leave / host migration ----------

  checkHost(){const m=NET.meta;if(!m)return;const was=NET.isHost;NET.isHost=m.host===NET.uid;

  async leave(){this.leaving=true;const wasLobby=!(NET.meta&&NET.meta.status==='play');const others=this.order().some(([u,v])=>u!==NET.uid&&v.online!==false);try{const r=this.ref('members/'+NET.uid);await r.child('online').onDisconnect().cancel();

<script id="snd">
// ================= AUDIO v3 (procedural piano-centric) =================
const SND={ctx:null,playing:null,next:0,timer:null,vol:{bgm:.5,sfx:.5},on:{bgm:true,sfx:true},
  load(){try{const v=JSON.parse(localStorage.getItem('hexisle-audio2')||'{}');Object.assign(this.vol,v.vol||{});Object.assign(this.on,v.on||{});}catch(e){}},
  save(){try{localStorage.setItem('hexisle-audio2',JSON.stringify({vol:this.vol,on:this.on}));}catch(e){}},
  init(){if(this.ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    const c=this.ctx=new AC();const master=c.createDynamicsCompressor();master.threshold.value=-16;master.ratio.value=3;master.connect(c.destination);
    this.bgmBus=c.createGain();this.bgmG=c.createGain();this.sfxBus=c.createGain();this.sfxG=c.createGain();this.bgmBus.connect(this.bgmG);this.sfxBus.connect(this.sfxG);this.bgmG.connect(master);this.sfxG.connect(master);
    const mk=(sec,dec)=>{const len=c.sampleRate*sec,ir=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}return ir;};
    this.rev=c.createConvolver();this.rev.buffer=mk(3.2,2.2);const rg=c.createGain();rg.gain.value=.42;this.rev.connect(rg);rg.connect(this.bgmG);
    this.revS=c.createConvolver();this.revS.buffer=mk(1.8,2.6);const rs=c.createGain();rs.gain.value=.22;this.revS.connect(rs);rs.connect(this.sfxG);
    this.apply();return true;},
  apply(){if(!this.ctx)return;const t=this.ctx.currentTime;this.bgmG.gain.setTargetAtTime(this.on.bgm?this.vol.bgm*.4:0,t,.15);this.sfxG.gain.setTargetAtTime(this.on.sfx?this.vol.sfx*1.045:0,t,.05);},
  unlock(){if(!this.init())return;if(this.ctx.state==='suspended')this.ctx.resume();this.apply();},
  hz(n){return 440*Math.pow(2,(n-69)/12);},
  nbuf:null,noiseBuf(){if(this.nbuf)return this.nbuf;const c=this.ctx,b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return this.nbuf=b;},
  waves:{},
  wave(kind){if(this.waves[kind])return this.waves[kind];const N=24,re=new Float32Array(N),im=new Float32Array(N);
    const A={piano:k=>Math.pow(k,-1.35)*(k%7===0?.3:1)*(k===2?1.15:1),bell:k=>[0,1,.5,.0,.35,.0,.2,0,.1][k]||0,marimba:k=>k===1?1:k===4?.35:k===10?.08:0,harp:k=>Math.pow(k,-1.9),string:k=>1/k}[kind];
    for(let k=1;k<N;k++)im[k]=A(k);return this.waves[kind]=this.ctx.createPeriodicWave(re,im);},
  // ---------- instruments (dest: bus, rev) ----------
  piano(n,t,v,dur,bus,rv){const c=this.ctx,f=this.hz(n);bus=bus||this.bgmBus;rv=rv||this.rev;
    const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';const bright=Math.min(9000,f*(5+v*30));lp.frequency.setValueAtTime(bright,t);lp.frequency.exponentialRampToValueAtTime(Math.max(f*1.5,300),t+Math.min(2.5,dur));lp.Q.value=.3;
    [-3,3].forEach(ct=>{const o=c.createOscillator();o.setPeriodicWave(this.wave('piano'));o.frequency.value=f;o.detune.value=ct;o.connect(lp);o.start(t);o.stop(t+dur+1.2);});
    const T=Math.max(.6,4.2*Math.pow(220/f,.55));
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(v*.35,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+Math.min(T,dur+1));
    lp.connect(g);g.connect(bus);g.connect(rv);
    const h=c.createBufferSource();h.buffer=this.noiseBuf();const hf=c.createBiquadFilter();hf.type='bandpass';hf.frequency.value=Math.min(4000,f*4);hf.Q.value=1.5;const hg=c.createGain();
    hg.gain.setValueAtTime(v*.08,t);hg.gain.exponentialRampToValueAtTime(.0001,t+.03);h.connect(hf);hf.connect(hg);hg.connect(bus);h.start(t,Math.random());h.stop(t+.05);},
  tone(kind,n,t,v,dur,bus,rv){const c=this.ctx,f=this.hz(n);bus=bus||this.bgmBus;rv=rv||this.rev;const o=c.createOscillator(),g=c.createGain();o.setPeriodicWave(this.wave(kind));o.frequency.value=f;o.connect(g);g.connect(bus);g.connect(rv);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(kind==='marimba'?.003:.006));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.05);},
  strings(ns,t,v,dur,bus,rv){const c=this.ctx;bus=bus||this.bgmBus;rv=rv||this.rev;const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;lp.Q.value=.5;lp.connect(g);g.connect(bus);g.connect(rv);
    ns.forEach(n=>[-8,0,7].forEach(ct=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=this.hz(n);o.detune.value=ct;const og=c.createGain();og.gain.value=.33;o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur+.1);}));
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(1.2,dur*.4));g.gain.setValueAtTime(v,t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur);},
  flute(n,t,v,dur){const c=this.ctx;const o=c.createOscillator(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain(),f=c.createBiquadFilter();
    o.type='sine';o.frequency.value=this.hz(n);lfo.frequency.value=5;lg.gain.value=this.hz(n)*.004;lfo.connect(lg);lg.connect(o.frequency);f.type='lowpass';f.frequency.value=2200;o.connect(f);f.connect(g);g.connect(this.bgmBus);g.connect(this.rev);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.12);g.gain.setValueAtTime(v*.85,t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05);},
  // ---------- songs ----------
  SONGS:{},
  // ---------- sfx: lower, instrument-based ----------
  sfx(k){if(!this.ctx||!this.on.sfx||this.vol.sfx<=0)return;if(this.ctx.state==='suspended')this.ctx.resume();const c=this.ctx,t=c.currentTime,B=this.sfxBus,R=this.revS;
    const pn=(n,dt,v,d)=>this.piano(n,t+dt,v,d||1.2,B,R);const mar=(n,dt,v,d)=>this.tone('marimba',n,t+dt,v,d||.35,B,R);const bell=(n,dt,v,d)=>this.tone('bell',n,t+dt,v,d||1.6,B,R);
    const st=(ns,dt,v,d)=>this.strings(ns,t+dt,v,d,B,R);
    const noise=(dt,v,d,type,fq,q)=>{const s=c.createBufferSource();s.buffer=this.noiseBuf();const f=c.createBiquadFilter();f.type=type;f.frequency.value=fq;f.Q.value=q||.7;const g=c.createGain();s.connect(f);f.connect(g);g.connect(B);
      g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(v,t+dt+d*.25);g.gain.exponentialRampToValueAtTime(.0001,t+dt+d);s.start(t+dt,Math.random());s.stop(t+dt+d+.05);};
    const knock=(dt,v,f0)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t+dt);o.frequency.exponentialRampToValueAtTime(f0*.6,t+dt+.07);o.connect(g);g.connect(B);
      g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(v,t+dt+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dt+.09);o.start(t+dt);o.stop(t+dt+.12);};
    switch(k){
      case 'click':mar(45,0,.28,.22);break;
      case 'card':noise(0,.18,.09,'highpass',2800,.5);noise(.05,.13,.12,'bandpass',4200,.8);noise(.11,.08,.08,'highpass',3500,.5);break;
      case 'roll':{noise(0,.035,.55,'bandpass',900,.6);let dt=.08,gap=.13,v=.16;for(let i=0;i<8;i++){knock(dt,v,300+Math.random()*90);noise(dt,v*.25,.03,'bandpass',1400,3);if(i%2)knock(dt+.02,v*.6,340+Math.random()*80);dt+=gap;gap*=.78;v*=i<2?1.15:.82;}break;}
      case 'gain':pn(62,0,.11,1.4);pn(66,.08,.09,1.4);pn(69,.16,.09,1.8);break;
      case 'build':mar(43,0,.34);mar(47,.1,.26);pn(55,.22,.11,1.4);pn(62,.3,.09,1.6);break;
      case 'road':mar(43,0,.38);mar(45,.09,.25);break;
      case 'city':mar(40,0,.32);mar(43,.1,.28);pn(50,.24,.11,2);pn(54,.32,.1,2);pn(57,.4,.1,2);pn(62,.48,.11,2.4);break;
      case 'dev':noise(0,.06,.14,'highpass',2600,.5);pn(67,.12,.12,1.2);pn(71,.2,.1,1.4);break;
      case 'trade':bell(74,0,.07,1.2);bell(79,.09,.06,1.3);bell(76,.18,.05,1.4);break;
      case 'turn':pn(50,0,.11,2);pn(57,0,.08,2);pn(62,.05,.08,2.2);break;
      case 'robber':pn(31,0,.12,2.4);pn(38,0,.08,2.2);pn(39,.02,.05,2.2);st([38,45],0,.025,2);break;
      case 'steal':pn(57,0,.15,1.2);pn(53,.15,.15,1.4);break;
      case 'error':pn(48,0,.16,.8);pn(47,.12,.14,.9);break;
      case 'win':st([50,57,62,66],0,.05,3.6);[50,54,57,62,66,69,74].forEach((n,i)=>pn(n,i*.13,.11,2.6));pn(38,0,.15,3.4);pn(45,.9,.1,3);break;
      case 'lose':st([45,52,57],0,.035,3);[57,55,52,50].forEach((n,i)=>pn(n,i*.28,.1,2));pn(38,.1,.11,3);break;}},
};

// ---------- recorded music (Pixabay, free license) — streamed <audio> → WebAudio gain ----------
// plays: how many times a game track repeats (loop versions) before crossfading to another random track
const MUSIC={title:'assets/music/title.mp3',game:[{src:'assets/music/game1.mp3',plays:[1,1]},{src:'assets/music/game2.mp3',plays:[2,3]},{src:'assets/music/game3.mp3',plays:[2,3]},{src:'assets/music/game4.mp3',plays:[2,3]}]};
Object.assign(SND,{cur:null,want:null,lastGame:-1,nextGame:-1,FADE:2.5,pre:{},
  el(src){let a=this.pre[src];if(a){delete this.pre[src];return a;}a=new Audio();a.preload='auto';a.src=src;return a;},
  preload(src){if(this.pre[src]||(this.cur&&this.cur.src===src))return;for(const k in this.pre)if(k!==MUSIC.title){this.pre[k].removeAttribute('src');delete this.pre[k];}const a=new Audio();a.preload='auto';a.src=src;try{a.load();}catch(e){}this.pre[src]=a;},
  pickGame(){let i;do{i=Math.floor(Math.random()*MUSIC.game.length);}while(i===this.lastGame&&MUSIC.game.length>1);return i;},
  music(mode){this.want=mode;if(!mode||!this.ctx||!this.on.bgm||this.vol.bgm<=0)return;if(this.cur&&this.cur.mode===mode&&!this.cur.ending)return;this.startMusic(mode);},
  startMusic(mode){let src,plays=1;
    if(mode==='title')src=MUSIC.title;else{const i=this.nextGame>=0&&this.nextGame!==this.lastGame?this.nextGame:this.pickGame();this.lastGame=i;const tr=MUSIC.game[i];src=tr.src;plays=tr.plays[0]+Math.floor(Math.random()*(tr.plays[1]-tr.plays[0]+1));
      this.nextGame=this.pickGame();}
    const prev=this.cur;const c=this.ctx,a=this.el(src);a.loop=mode==='title'||plays>1;
    const g=c.createGain();g.gain.value=0;let n;try{n=c.createMediaElementSource(a);n.connect(g);g.connect(this.bgmBus);}catch(e){a.volume=.4;}
    const cur=this.cur={mode,src,a,g,n,plays,loopN:0,lastT:0};const fin=mode==='title'&&!prev?.35:this.FADE;
    const go=()=>{if(this.cur!==cur)return;const t=c.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(mode==='title'?1:.54,t+fin);this.fadeOut(prev);if(mode==='game')this.preload(MUSIC.game[this.nextGame].src);};
    if(prev)prev.ending=true;a.addEventListener('playing',go,{once:true});
    if(mode==='game')a.addEventListener('timeupdate',()=>{if(this.cur!==cur||cur.ending)return;const ct=a.currentTime;if(ct+1<cur.lastT){cur.loopN++;if(cur.loopN>=cur.plays-1)a.loop=false;}cur.lastT=ct;
      if(cur.loopN>=cur.plays-1&&a.duration&&a.duration-ct<this.FADE+.3){this.startMusic('game');}});
    a.addEventListener('ended',()=>{if(this.cur===cur){this.cur=null;this.music(this.want);}});
    const p=a.play();if(p&&p.catch)p.catch(()=>{cur.blocked=true;});},
  fadeOut(o,d){if(!o||o.dead)return;o.dead=true;const t=this.ctx.currentTime;d=d||this.FADE;o.ending=true;o.g.gain.cancelScheduledValues(t);o.g.gain.setValueAtTime(o.g.gain.value,t);o.g.gain.linearRampToValueAtTime(0,t+d);
    setTimeout(()=>{try{o.a.pause();o.n&&o.n.disconnect();o.a.removeAttribute('src');o.a.load();}catch(e){}},d*1000+150);},
  stopMusic(){if(!this.cur)return;const o=this.cur;this.cur=null;this.fadeOut(o,1);},
  endMusic(){this.want=null;if(!this.cur)return;const o=this.cur;this.cur=null;this.fadeOut(o,2.5);}});

// ---------- recorded SFX (assets/sfx, volumes tuned on sound-test.html) ----------
const SFXG={"ui": 1.5, "btn1": 0.56, "btn2": 0.38, "click": 0.58, "toggle": 0.17, "page": 0.23, "join": 0.42, "start": 0.22, "card": 0.2, "gain": 0.22, "dice": 0.33, "turn": 0.25, "tick": 0.17, "dev": 0.26, "trade": 0.32, "robber": 0.35, "robber2": 0.34, "steal": 0.12, "error": 0.23, "place_other": 0.29, "road": 0.33, "build": 0.46, "city": 0.49, "win": 0.22, "lose": 0.19};
const SFXALIAS={roll:'dice'};const SFXFILE={place_other:'robber2'};
Object.assign(SND,{fx:{},fxLoading:false,lastUi:0,
  loadSfx(){if(this.fxLoading||!this.ctx)return;this.fxLoading=true;const c=this.ctx;
    Object.keys(SFXG).forEach((k,i)=>setTimeout(()=>fetch('assets/sfx/'+(SFXFILE[k]||k)+'.mp3').then(r=>r.arrayBuffer()).then(ab=>new Promise((res,rej)=>c.decodeAudioData(ab,res,rej))).then(b=>{this.fx[k]=b;}).catch(e=>console.warn('sfx',k,e)),i*40));},
  sfx(k,delay){if(!this.ctx||!this.on.sfx||this.vol.sfx<=0)return;k=SFXALIAS[k]||k;if(this.ctx.state==='suspended')this.ctx.resume();this.loadSfx();
    if(k==='ui'){const n=performance.now();if(n-(this.lastBtn||0)<350)return;this.lastUi=n;}const b=this.fx[k];if(!b)return;const c=this.ctx,src=c.createBufferSource(),g=c.createGain();g.gain.value=SFXG[k]??.5;src.buffer=b;src.connect(g);g.connect(this.sfxBus);src.start(c.currentTime+(delay||0));},
  sfxN(k,n,gap){n=Math.max(1,Math.min(10,n|0));for(let i=0;i<n;i++)this.sfx(k,i*(gap||.09));}});
{const ul=SND.unlock.bind(SND);SND.unlock=function(){ul();this.loadSfx();};}
{const ap=SND.apply.bind(SND);SND.apply=function(){ap();if(!this.ctx)return;if(!this.on.bgm||this.vol.bgm<=0)this.stopMusic();else if(this.cur&&this.cur.blocked){this.cur.blocked=false;const p=this.cur.a.play();if(p&&p.catch)p.catch(()=>{this.cur&&(this.cur.blocked=true);});}else if(this.want&&!this.cur)this.music(this.want);};}


SND.load();

// keep the page at 100%: some mobile browsers keep a stray zoom after rotating or leaving fullscreen
(function(){const VP='width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
  const meta=()=>{let m=document.querySelector('meta[name=viewport]');if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m);}return m;};
  const fix=()=>{const vv=window.visualViewport;if(vv&&Math.abs(vv.scale-1)<.01)return;const m=meta();m.content=VP.replace('initial-scale=1','initial-scale=1.0001');requestAnimationFrame(()=>{m.content=VP;});};
  let t;const later=()=>{clearTimeout(t);t=setTimeout(fix,250);};
  ['orientationchange','resize','pageshow','fullscreenchange','webkitfullscreenchange'].forEach(ev=>addEventListener(ev,later));document.addEventListener('fullscreenchange',later);
  if(window.visualViewport)visualViewport.addEventListener('resize',later);fix();})();
['pointerdown','pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>SND.unlock(),{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!SND.ctx)return;const a=SND.cur&&SND.cur.a;if(document.hidden){SND.ctx.suspend();a&&a.pause();}else{SND.ctx.resume();a&&!SND.cur.dead&&a.play().catch(()=>{});}});
// buffer the title track right away; it starts on the splash tap together with the intro
SND.preload(MUSIC.title);
// global click sound for buttons
document.addEventListener('click',e=>{if(e.target.closest('#splash'))return;
  if(e.target.closest('.aitg,.sndt,.mi.tg,[role="switch"]')){SND.sfx('toggle');SND.lastBtn=performance.now();return;}
  if(e.target.closest('.dzone [data-r],.tcell,.tpick [data-r],img.card,.dvc,[data-dev]')){SND.sfx('card');return;}
  const b=e.target.closest('button,.tm,.mi,.mtab,[data-act],[data-v],[data-c]');if(!b||b.disabled)return;if(b.matches('[data-act="roll"],#rp,#rn'))return;
  const k=b.matches('.cnt .btn,.swatches .sw,[data-sp]')?'click':b.matches('.btn.primary,.tm,[data-act],#fGo')?'btn1':b.matches('.btn,.mtab,.pbtn,.seg button')?'btn2':'click';const t0=performance.now();
  // inside a popup/dialog the button keeps its own sound (and mutes the open/close sound it triggers)
  if(b.closest('#modal,#dialog,.setmenu')){SND.lastBtn=t0;SND.sfx(k);return;}
  setTimeout(()=>{if(SND.lastUi<t0-5)SND.sfx(k);},0);},true);
// sound settings dialog
function showSound(){const row=(k,label)=>`<div class="sndrow"><span class="sndl">${label}</span><input type="range" min="0" max="100" value="${Math.round(SND.vol[k]*100)}" data-k="${k}" class="sndr"><button class="sndt" data-t="${k}" aria-checked="${SND.on[k]}"></button></div>`;
  openDialog(`<h3>사운드</h3><div class="sndbox">${row('bgm','배경음')}${row('sfx','효과음')}</div><div class="row"><button class="btn sub" id="sndOk">확인</button></div>`,'dlg-snd');
  const upd=()=>document.querySelectorAll('#dsheet .sndr').forEach(r=>r.style.setProperty('--p',r.value+'%'));upd();
  document.querySelectorAll('#dsheet .sndr').forEach(r=>{r.oninput=()=>{SND.vol[r.dataset.k]=r.value/100;if(r.value>0){SND.on[r.dataset.k]=true;document.querySelector(`#dsheet [data-t="${r.dataset.k}"]`).setAttribute('aria-checked',true);}SND.unlock();SND.apply();SND.save();upd();};
    r.onchange=()=>{if(r.dataset.k==='sfx')SND.sfx('gain');};});
  document.querySelectorAll('#dsheet .sndt').forEach(b=>b.onclick=()=>{const k=b.dataset.t;SND.on[k]=!SND.on[k];b.setAttribute('aria-checked',SND.on[k]);SND.unlock();SND.apply();SND.save();});
  $('#sndOk').onclick=closeDialog;}

function devTabWatch(){if(!S||!S.players||!S.players[ME])return;const n=S.players[ME].dev.length;const p=ui.devN;ui.devN=n;if(p===undefined)return;if(n>p&&ui.handTab!=='dev'){ui.handTab='dev';ui.devFlash=true;setTimeout(()=>{try{render();}catch(e){}},0);}else if(n<p&&ui.handTab==='dev'){ui.handTab='res';setTimeout(()=>{try{render();}catch(e){}},0);}}
function sndWatch(){devTabWatch();if(typeof SND==='undefined'||!S||!S.players||!S.players[ME])return;const me=S.players[ME];const k=count(ME);
  let ob=0;S.players.forEach((q,i)=>{if(i!==ME){const c=count(i);ob+=c.s+2*c.c+c.r;}});
  const cur={id:S.rollId,res:sumRes(me.res),s:k.s,c:k.c,r:k.r,ob,dev:me.dev.length,cur:S.cur,ph:S.phase,rob:S.board.robber,st:S.lastSteal?JSON.stringify(S.lastSteal):'',g:S.board.hexes.map(h=>h.num).join('')+S.board.ports.map(p=>p.e).join('')};
  const p=ui.sndPrev;ui.sndPrev=cur;if(!p||p.g!==cur.g)return;
  if(cur.id!==p.id)SND.sfx('roll');
  if(cur.c>p.c)SND.sfx('city',.2);else if(cur.s>p.s)SND.sfx('build',.2);else if(cur.r>p.r)SND.sfx('road',.2);else if(cur.dev>p.dev)SND.sfx('dev');
  else if(cur.ob>p.ob)SND.sfx('place_other',.15);
  if(cur.rob!==p.rob){const mine=G.hexes[cur.rob]&&G.hexes[cur.rob].v.some(v=>S.vb[v]&&S.vb[v].o===ME);SND.sfx(mine?'robber':'robber2');}
  if(cur.st!==p.st&&cur.st){const L=S.lastSteal;if(L.q===ME||L.p===ME)setTimeout(()=>SND.sfx('steal'),cur.rob!==p.rob?650:200);}
  if(cur.res>p.res){const n=cur.res-p.res;if(cur.id!==p.id)ui.gainN=n;else if(cur.s===p.s&&cur.r===p.r&&cur.c===p.c){if(cur.dev===p.dev&&!(S.pend&&S.pend.k))SND.sfx('trade');else SND.sfxN('gain',n);}}
  if(cur.ph==='main'&&cur.cur===ME&&(p.cur!==ME||p.ph!=='main'))setTimeout(()=>SND.sfx('turn'),150);
  if(cur.ph==='over'&&p.ph!=='over'){SND.sfx(S.winner===ME?'win':'lose');SND.endMusic();}}
// last 9 seconds of my own time limit: one tick per second
setInterval(()=>{try{if(typeof SND==='undefined'||!S||!S.mp||!S.deadline||S.phase==='over'||actor()!==ME){ui.lastTick=null;return;}
  const r=Math.ceil((S.deadline-Date.now())/1000);if(r>=1&&r<=9&&r!==ui.lastTick){ui.lastTick=r;SND.sfx('tick');}else if(r>9)ui.lastTick=null;}catch(e){}},200);
